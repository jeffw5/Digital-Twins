<style>

  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f6f7f9; color: #202124; }
  header { background: #10233f; color: white; padding: 18px 32px; }
  header h1 { margin: 0; font-size: 19px; }
  header .sub { opacity: .78; font-size: 12.5px; margin-top: 4px; }

             cursor: pointer; border-bottom: 3px solid transparent; }
  .tab-btn:hover { color: white; }
  .tab-btn.active { color: white; border-bottom-color: #4c8dff; }
  .container { padding: 22px 32px 60px; }
  .tabpanel { display: none; }
  .tabpanel.active { display: block; }
  h2.section-title { font-size: 16px; margin: 22px 0 6px; }
  h2.section-title:first-child { margin-top: 0; }
  h3.sub-title { font-size: 13.5px; margin: 18px 0 8px; color: #344; }
  p.hint { color: #5f6368; font-size: 12.5px; margin: -2px 0 14px; max-width: 900px; }
  .card { background: white; border-radius: 10px; padding: 14px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 12.5px; vertical-align: top; }
  th { background: #f1f3f4; font-size: 10.5px; text-transform: uppercase; color: #5f6368; }

  /* component grid */
  .block-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .block-nav button { border: 1px solid #dadce0; background: white; border-radius: 999px; padding: 6px 14px; font-size: 12px;
                       font-weight: 600; cursor: pointer; color: #344; }
  .block-nav button.active { background: #0c1c33; color: white; border-color: #0c1c33; }
  .comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 10px 0 6px; }
  .comp-card { border-radius: 10px; padding: 12px 14px; color: white; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15);
               transition: transform .1s ease; }
  .comp-card:hover { transform: translateY(-2px); }
  .comp-card .cc-code { font-size: 10.5px; opacity: .85; font-weight: 700; text-transform: uppercase; }
  .comp-card .cc-name { font-size: 13.5px; font-weight: 700; margin: 3px 0 4px; }
  .comp-card .cc-func { font-size: 11px; opacity: .92; line-height: 1.4; }

  /* system diagram */
  .sys-node { border-radius: 8px; padding: 8px 10px; color: white; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.18);
              text-align: center; transition: transform .1s ease; }
  .sys-node:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,.24); }

  /* drawer (shared with dashboard style) */
  .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
  .drawer-backdrop.open { display: block; }
  .drawer { position: fixed; top: 0; right: -560px; width: 540px; max-width: 92vw; height: 100%; background: white;
            box-shadow: -4px 0 18px rgba(0,0,0,.18); z-index: 50; transition: right .18s ease; overflow-y: auto; padding: 22px 24px 40px; }
  .drawer.open { right: 0; }
  .drawer h3 { margin-top: 0; font-size: 17px; }
  .drawer .close-btn { position: absolute; top: 14px; right: 16px; border: none; background: none; font-size: 18px; cursor: pointer; color: #5f6368; }
  .drawer .kv-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #5f6368; margin: 14px 0 4px; }
  .drawer p { font-size: 13px; line-height: 1.55; margin: 4px 0; }

  /* glossary */
  .glossary-search { width: 100%; max-width: 420px; padding: 9px 12px; border: 1px solid #dadce0; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
  .g-term { background: white; border-radius: 8px; padding: 10px 16px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; }
  .g-term:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .g-term .g-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .g-term .g-name { font-weight: 700; font-size: 13.5px; }
  .g-term .g-cat { font-size: 10px; text-transform: uppercase; color: white; background: #5f6368; border-radius: 999px; padding: 1px 8px; font-weight: 700; }
  .g-term .g-alias { font-size: 11px; color: #9aa0a6; font-style: italic; }
  .g-term .g-def { font-size: 12.5px; color: #3c4043; margin-top: 4px; line-height: 1.5; }
  .hash { font-family: monospace; color: #9aa0a6; font-size: 10.5px; word-break: break-all; }
  details.voc-group { margin-bottom: 10px; background: white; border-radius: 10px; padding: 4px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  details.voc-group > summary { cursor: pointer; font-size: 13.5px; padding: 10px 0; list-style: revert; }
  details.cat-group { margin: 2px 0 10px 16px; }
  details.cat-group > summary { cursor: pointer; font-size: 12px; color: #5f6368; font-weight: 700; text-transform: uppercase; padding: 6px 0; list-style: revert; }

  /* tuple diagram */
  .tuple-diagram-wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .tuple-node { width: 108px; height: 108px; border-radius: 50%; display: flex; flex-direction: column; align-items: center;
                justify-content: center; color: white; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .tuple-node .tn-code { font-size: 26px; font-weight: 800; }
  .tuple-node .tn-name { font-size: 9.5px; text-align: center; padding: 0 8px; opacity: .9; }
  .framing-card { border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-left: 4px solid #9aa0a6; }
  .framing-card.correct { border-left-color: #1e8e3e; }
  .framing-card.fails { border-left-color: #d93025; }
  .framing-card .fc-name { font-weight: 700; font-size: 12.5px; }
  .framing-card .fc-verdict { font-size: 10px; text-transform: uppercase; font-weight: 700; margin-left: 8px; }
  .framing-card.correct .fc-verdict { color: #1e8e3e; }
  .framing-card.fails .fc-verdict { color: #d93025; }
  .framing-card .fc-detail { font-size: 12px; color: #5f6368; margin-top: 4px; line-height: 1.5; }
  .callout { background: #fff8e1; border-left: 4px solid #e8a300; border-radius: 6px; padding: 12px 16px; font-size: 12.5px; margin: 14px 0; line-height: 1.55; }

  /* quadrant */
  .quad-wrap { display: flex; gap: 24px; flex-wrap: wrap; }
  .quad-legend { display: flex; flex-direction: column; gap: 8px; min-width: 240px; }
  .quad-legend-item { border-radius: 8px; padding: 8px 12px; color: white; font-size: 12px; cursor: pointer; }
  .quad-legend-item .ql-name { font-weight: 700; }
  .quad-legend-item .ql-sub { font-size: 10.5px; opacity: .9; }
  .quad-controls { display: flex; gap: 18px; margin: 10px 0 16px; flex-wrap: wrap; align-items: center; }
  .quad-controls label { font-size: 11.5px; color: #5f6368; }
  .quad-controls input[type=range] { width: 140px; vertical-align: middle; margin: 0 6px; }

  /* composition theorem */
  .comp-theorem-formula { font-size: 20px; font-family: Georgia, serif; background: white; border-radius: 10px; padding: 16px 20px;
                           box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 12px; }
  .comp-calc { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .comp-bars { display: flex; align-items: flex-end; gap: 18px; height: 200px; background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .comp-bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 70px; }
  .comp-bar { width: 44px; border-radius: 4px 4px 0 0; }
  .comp-bar-label { font-size: 10.5px; color: #5f6368; margin-top: 6px; text-align: center; }
  .comp-bar-value { font-size: 13px; font-weight: 700; margin-bottom: 4px; }

  /* simulation */
  .sim-scenario-picker { display: flex; gap: 8px; margin-bottom: 16px; }
  .sim-scenario-picker button { border: 1px solid #dadce0; background: white; border-radius: 999px; padding: 7px 16px; font-size: 12.5px;
                                  font-weight: 600; cursor: pointer; }
  .sim-scenario-picker button.active { background: #0c1c33; color: white; border-color: #0c1c33; }
  .sim-rail { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
  .sim-node { flex: 1; text-align: center; padding: 10px 6px; border-radius: 8px; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.08);
              font-size: 11.5px; font-weight: 700; color: #9aa0a6; border: 2px solid transparent; cursor: pointer; }
  .sim-node.current { border-color: #4c8dff; color: #0c1c33; }
  .sim-node.done-ok { color: #1e8e3e; }
  .sim-node.done-trip { color: #d93025; }
  .sim-arrow { color: #b7c2d6; font-size: 16px; }
  .sim-panel { background: white; border-radius: 10px; padding: 18px 22px; box-shadow: 0 1px 3px rgba(0,0,0,.08); min-height: 160px; }
  .sim-panel h3 { margin-top: 0; }
  .sim-panel .sim-verdict { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; color: white; margin-bottom: 10px; }
  .sim-panel .sim-verdict.ok { background: #1e8e3e; }
  .sim-panel .sim-verdict.trip { background: #d93025; }
  .sim-data { font-family: monospace; font-size: 11.5px; background: #f6f7f9; border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; margin-top: 10px; }
  .sim-controls { display: flex; gap: 10px; margin-top: 16px; }
  .btn { border: 1px solid #dadce0; background: white; border-radius: 6px; padding: 8px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #f1f3f4; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: #0c1c33; color: white; border-color: #0c1c33; }
  .btn.primary:hover { background: #17304f; }

  .badge.ok { color: #1e8e3e; border-color: #1e8e3e; background: #eaf7ee; }
  .badge.bad { color: #d93025; border-color: #d93025; background: #fdecea; }
  .reasons { max-width: 340px; color: #5f6368; }
  .hash { font-family: monospace; color: #9aa0a6; font-size: 11px; word-break: break-all; }

  .tabpanel.active { display: block; }

  /* --- Flow diagram --- */
  .flow-row { display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding: 6px 2px 18px; }
  .flow-node { flex: 1 0 150px; background: white; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
               border-top: 4px solid #9aa0a6; position: relative; cursor: pointer; transition: transform .1s ease; }
  .flow-node:hover { transform: translateY(-2px); box-shadow: 0 2px 8px rgba(0,0,0,.14); }
  .flow-node .fn-tag { font-size: 10px; color: #9aa0a6; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  .flow-node .fn-title { font-size: 13px; font-weight: 700; margin: 3px 0 6px; }
  .flow-node .fn-detail { font-size: 11.5px; color: #5f6368; line-height: 1.5; }
  .flow-node.state-normal { border-top-color: #1e8e3e; }
  .flow-node.state-alert { border-top-color: #e8a300; }
  .flow-node.state-trip { border-top-color: #e8730a; }
  .flow-node.state-halt, .flow-node.state-lockout { border-top-color: #d93025; }
  .flow-arrow { align-self: center; font-size: 20px; color: #b7c2d6; flex: 0 0 auto; }

  /* --- Morphism scatter --- */
  .scatter-wrap { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 18px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: #5f6368; margin-top: 8px; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }

  .fidelity-panel { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .fidelity-card { flex: 1 0 220px; background: white; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .fidelity-card .big { font-size: 22px; font-weight: 700; }
  .fidelity-card .loss { color: #d93025; font-weight: 700; }

  /* --- HITL drawer --- */
  .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
  .drawer-backdrop.open { display: block; }

  .drawer h3 { margin-top: 0; font-size: 16px; }

  .drawer label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: #5f6368; margin: 14px 0 4px; }
  .drawer textarea, .drawer input[type=text] { width: 100%; padding: 8px; border: 1px solid #dadce0; border-radius: 6px; font-size: 13px; font-family: inherit; }
  .drawer .action-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn { border: 1px solid #dadce0; background: white; border-radius: 6px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #f1f3f4; }
  .btn.primary { background: #0c1c33; color: white; border-color: #0c1c33; }
  .btn.primary:hover { background: #17304f; }
  .btn.danger { color: #d93025; border-color: #d93025; }
  .btn.ok { color: #1e8e3e; border-color: #1e8e3e; }
  .kv { font-size: 12.5px; margin: 3px 0; }
  .kv b { color: #5f6368; font-weight: 600; }
  .metrics-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin: 8px 0 4px; }

  .staged-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #0c1c33; color: white; padding: 10px 26px;
                  display: none; align-items: center; gap: 16px; z-index: 30; font-size: 12.5px; }
  .staged-panel.show { display: flex; }
  .staged-panel .count { font-weight: 700; }

  .tab-sep { display: inline-block; width: 1px; margin: 8px 10px; background: #2c3e5c; align-self: stretch; }

<script id="explorer-data" type="application/json">{"glossary": [{"term": "A -- Domain Agent", "category": "Governance Tuple", "vocab": "governance-tuple", "definition": "The AI agent itself, specified as a CONSTITUTIVE element of the tuple rather than an artifact governance is bolted onto afterward. Its output schema must be grounded in O, its retrieval must reference V, and its authority scope must correspond to H's boundary -- or the CB operates on a systematic mismatch between what the agent thinks its decision space is and what the CB thinks it authorized.", "iri": "https://aicb.dev/vocab/governance-tuple#A-Domain-Agent", "broader": "https://aicb.dev/vocab/governance-tuple#Governance-Tuple"}, {"term": "AI CB", "category": "Acronym", "vocab": "core", "definition": "This project's own umbrella acronym: AI Circuit Breaker -- a domain-agnostic, dependency-light 'deterministic veto' governance layer insertable in front of any AI model or agent.", "iri": "https://aicb.dev/vocab/core#AI-CB", "broader": "https://aicb.dev/vocab/core#Acronym"}, {"term": "API", "category": "Concept", "vocab": "tooling", "aliases": ["Application Programming Interface"], "definition": "A defined integration surface between two components. The System Diagram labels every edge with the concrete API/protocol at that integration point (SPARQL, MCP, SHACL validation calls, etc.) rather than leaving integration implicit.", "iri": "https://aicb.dev/vocab/tooling#API", "broader": "https://aicb.dev/vocab/tooling#Concept"}, {"term": "Architecture Layer Naming (disambiguation)", "category": "Concept", "vocab": "architecture", "aliases": ["L1-L5 (which one?)"], "definition": "THREE different numbered scales appear across the source documents and are easy to conflate. (1) TB-02 Architecture Layers: L1 Ground Truth Authority, L2 Functor Certification, L3 Consistency Manager, L4 Circuit Breaker + Monitor, L5 Human Trustee. (2) The Talking Points' business framing of the SAME per-agent stack, different labels: L1 Reference Standard, L2 Measurement Engine, L3 Statistical Process Control, L4 Holonic Immune Response, L5 Provenance Audit Trail (note this L5 is the AUDIT LOG, not the human -- a real terminology divergence from TB-02's L5). (3) The Talking Points' Multi-Agent Governance Hierarchy -- a completely separate ORGANIZATIONAL/holarchy scale, not an architecture-layer scale: L1 Individual Agent CB, L2 Domain Cluster CB, L3 Enterprise Orchestrator CB, L4 HITL Governance Board. Also unrelated: (4) the SE4AI abstract's Context Assurance Levels (WHO/WHAT/WHEN/WHERE/WHY maturity, L1-L5) -- see that glossary entry separately.", "iri": "https://aicb.dev/vocab/architecture#Architecture-Layer-Naming-disambiguation", "broader": "https://aicb.dev/vocab/architecture#Concept"}, {"term": "ARR", "category": "Business Term", "vocab": "value", "aliases": ["Annual Recurring Revenue"], "definition": "The SaaS revenue metric used in T-Comm's Path P1 projections ($60-160K ARR Year 1 scaling to ~$750K ARR Year 3).", "iri": "https://aicb.dev/vocab/value#ARR", "broader": "https://aicb.dev/vocab/value#Business-Term"}, {"term": "B1", "category": "Boundary", "vocab": "morphism", "aliases": ["Sensing -> Feature Extraction"], "definition": "This prototype's wireless/edge network-ops instance: raw telemetry (link state, congestion, interference, RF/optical readings) to structured features (tau_S=0.25, tau_M=0.20, w_c=0.3).", "iri": "https://aicb.dev/vocab/morphism#B1", "broader": "https://aicb.dev/vocab/morphism#Boundary-F-i-B-i"}, {"term": "B2", "category": "Boundary", "vocab": "morphism", "aliases": ["Feature Extraction -> Intent Classification"], "definition": "This prototype's wireless/edge network-ops instance: structured features to a candidate intent/action, e.g. 'reroute traffic' (tau_S=0.15, tau_M=0.12, w_c=0.6).", "iri": "https://aicb.dev/vocab/morphism#B2", "broader": "https://aicb.dev/vocab/morphism#Boundary-F-i-B-i"}, {"term": "B3", "category": "Boundary", "vocab": "morphism", "aliases": ["Intent Classification -> Action Decision"], "definition": "This prototype's wireless/edge network-ops instance: candidate intent to the specific action decision. Tightest tolerance (tau_S=0.06, tau_M=0.05), maximum consequence weight (w_c=1.0) -- the last checkpoint before the Circuit Breaker's veto gate.", "iri": "https://aicb.dev/vocab/morphism#B3", "broader": "https://aicb.dev/vocab/morphism#Boundary-F-i-B-i"}, {"term": "BAA", "category": "Program", "vocab": "program", "aliases": ["Broad Agency Announcement"], "definition": "A DARPA/DoD solicitation mechanism for early-stage research, distinct from a standard RFP -- evaluated on technical merit rather than a fixed statement of work.", "iri": "https://aicb.dev/vocab/program#BAA", "broader": "https://aicb.dev/vocab/program#Program"}, {"term": "Behavioral Entropy Monitor", "category": "Concept", "vocab": "value", "definition": "Detects when an agent's output distribution narrows over time -- e.g. an investment agent reinforcing existing portfolio bias, or a strategy agent recommending the same category of option repeatedly. Low entropy is itself a risk signal, not just high anomaly scores.", "iri": "https://aicb.dev/vocab/value#Behavioral-Entropy-Monitor", "broader": "https://aicb.dev/vocab/value#Concept"}, {"term": "Boundary (F_i / B_i)", "category": "Concept", "vocab": "morphism", "definition": "One transformation/handoff between two stages of an agent's pipeline (e.g. sensing -> features -> classification -> decision). Each boundary carries its own tau_S/tau_M tolerances and consequence weight w_c; tolerances tighten and w_c rises as boundaries approach the final decision. Instantiated as F1-F4 in the ECG domain example (TB-04) and as B1-B3 in this prototype's wireless/edge network-ops instance.", "iri": "https://aicb.dev/vocab/morphism#Boundary-F-i-B-i", "broader": "https://aicb.dev/vocab/morphism#Concept"}, {"term": "Build-Measure-Learn (AI governance analog)", "category": "Concept", "vocab": "value", "definition": "The Lean Startup validated-learning loop, mapped onto AI trustworthiness: Build = deploy the agent inside its policy envelope; Measure = the five-vector score + SPC drift signal; Learn = HITL review outcomes feed back into the policy corpus (L1). The three-cycle HITL cadence (Daily/Monthly/Quarterly) is explicitly framed as this loop operating at the governance layer instead of the product layer.", "iri": "https://aicb.dev/vocab/value#Build-Measure-Learn-AI-governance-analog", "broader": "https://aicb.dev/vocab/value#Concept"}, {"term": "CBER", "category": "Record type", "vocab": "hitl", "aliases": ["Circuit Breaker Event Record"], "definition": "Written every CB state transition. Retained operational-life + 7 years. Satisfies MIL-STD-882E hazard-log requirements.", "iri": "https://aicb.dev/vocab/hitl#CBER", "broader": "https://aicb.dev/vocab/hitl#Record-type"}, {"term": "CER", "category": "Record type", "vocab": "hitl", "aliases": ["Calibration Event Record"], "definition": "Written every calibration change. Retained permanently. Implements the DoDI 5000.97 digital thread for AI configuration management.", "iri": "https://aicb.dev/vocab/hitl#CER", "broader": "https://aicb.dev/vocab/hitl#Record-type"}, {"term": "Circuit Breaker + Monitor", "category": "Layer", "vocab": "architecture", "aliases": ["Layer 4", "L4", "CB"], "definition": "Layer 4: the CB state machine, MTBH counter, and sanitization gate. Trips at 1.5x the engineering tolerance (tau); executes an Emergency Halt on any guardrail violation, independent of the SPC/threshold trip path.", "iri": "https://aicb.dev/vocab/architecture#Circuit-Breaker-Monitor", "broader": "https://aicb.dev/vocab/architecture#Layer"}, {"term": "Composition Theorem", "category": "Theorem", "vocab": "morphism", "definition": "phi(Fn o ... o F1) >= prod(phi(Fi)). Fidelity degrades MULTIPLICATIVELY across a chain of boundaries, not additively or by simple averaging. A four-layer pipeline at 0.95 fidelity per layer delivers only 0.81 end-to-end fidelity -- a 19% loss invisible to any single per-layer/per-boundary test. This is the headline formal result of the morphism-grounded assurance framework (TB-01/TB-03).", "iri": "https://aicb.dev/vocab/morphism#Composition-Theorem", "broader": "https://aicb.dev/vocab/morphism#Theorem"}, {"term": "Consistency Manager", "category": "Layer", "vocab": "architecture", "aliases": ["Layer 3", "L3"], "definition": "Layer 3: evaluates Delta/Tolerance and detects ontologically impossible states. Impossible states halt coupling unconditionally, independent of any numeric distance score -- this is the SHACL-style consistency gate that catches hallucinations which are internally consistent but ontologically invalid.", "iri": "https://aicb.dev/vocab/architecture#Consistency-Manager", "broader": "https://aicb.dev/vocab/architecture#Layer"}, {"term": "Context Assurance Levels (L1-L5)", "category": "Concept", "vocab": "architecture", "definition": "NOT the same scale as the Architecture Layers below. From the SE4AI abstract's Layer 1: each of the five WHO/WHAT/WHEN/WHERE/WHY context dimensions maps to a structured assurance level L1-L5, used to compute context-relevancy distance (D_r) -- whether an AI has been invoked outside the operational envelope it was calibrated for.", "iri": "https://aicb.dev/vocab/architecture#Context-Assurance-Levels-L1-L5", "broader": "https://aicb.dev/vocab/architecture#Concept"}, {"term": "Contextual Relevancy Index (Cr)", "category": "Metric", "vocab": "core", "definition": "Cr = sum_i w_i (1 - |Cm_i - Sgt_i|): whether the AI's situational model (Cm) is grounded in real-time sensor ground truth (Sgt). Tolerance: Cr > 0.85. Catches a DIFFERENT fault class than d_S/d_M -- a pipeline can be perfectly morphism-certified while still acting on stale or wrong context.", "iri": "https://aicb.dev/vocab/core#Contextual-Relevancy-Index-Cr", "broader": "https://aicb.dev/vocab/core#Metric"}, {"term": "CUSUM", "category": "Metric", "vocab": "core", "aliases": ["Cumulative Sum control chart"], "definition": "A statistical process control technique detecting small, sustained shifts in a monitored signal faster than simple threshold rules -- part of TB-03's drift-detection rule set alongside the Western Electric rules in aicb/spc.py.", "iri": "https://aicb.dev/vocab/core#CUSUM", "broader": "https://aicb.dev/vocab/core#Metric"}, {"term": "d_M", "category": "Metric", "vocab": "morphism", "aliases": ["semantic distance"], "definition": "Semantic distance: how much the MEANING of a representation changed crossing a pipeline boundary, computed as cosine distance between domain-encoder embeddings anchored to a reference ontology. Certified iff d_M <= tau_M.", "iri": "https://aicb.dev/vocab/morphism#d-M", "broader": "https://aicb.dev/vocab/morphism#Metric"}, {"term": "d_S", "category": "Metric", "vocab": "morphism", "aliases": ["structural distance"], "definition": "Structural distance: how much the SHAPE of a representation changed crossing a pipeline boundary, computed via normalized graph-edit-distance (or a lightweight structural-feature proxy in this prototype). Certified iff d_S <= tau_S.", "iri": "https://aicb.dev/vocab/morphism#d-S", "broader": "https://aicb.dev/vocab/morphism#Metric"}, {"term": "DARPA", "category": "Program", "vocab": "program", "aliases": ["Defense Advanced Research Projects Agency"], "definition": "U.S. DoD agency funding high-risk, high-payoff research via BAAs. Shell 1's target evaluator (Research PM + technical advisors), scoring primarily on scientific novelty.", "iri": "https://aicb.dev/vocab/program#DARPA", "broader": "https://aicb.dev/vocab/program#Program"}, {"term": "DoDD 3000.09", "category": "Framework", "vocab": "regulatory", "definition": "DoD Directive on Autonomy in Weapon Systems -- requires appropriate levels of human judgment over the use of force. HTDR (Human Trustee Decision Record) satisfies its SS4(c) traceability requirement for human review of autonomous actions.", "iri": "https://aicb.dev/vocab/regulatory#DoDD-3000-09", "broader": "https://aicb.dev/vocab/regulatory#Framework"}, {"term": "DoDI 5000.97", "category": "Framework", "vocab": "regulatory", "definition": "DoD Instruction implementing the Digital Engineering / digital-thread policy for defense acquisition. CER (Calibration Event Record) implements its digital-thread requirement for AI configuration management.", "iri": "https://aicb.dev/vocab/regulatory#DoDI-5000-97", "broader": "https://aicb.dev/vocab/regulatory#Framework"}, {"term": "EKGF", "category": "Institution", "vocab": "program", "aliases": ["Enterprise Knowledge Graph Foundation"], "definition": "Industry body for enterprise knowledge-graph practice. Cited as institutional anchoring alongside INCOSE and the Business Architecture Guild.", "iri": "https://aicb.dev/vocab/program#EKGF", "broader": "https://aicb.dev/vocab/program#Institution"}, {"term": "Emergency Halt", "category": "Concept", "vocab": "core", "definition": "A guardrail-violation state distinct from a numeric threshold Trip -- triggered by an unconditional rule violation (e.g. a jurisdictional/authority breach, or an ontology impossible-state) regardless of how small the measured distance scores are.", "iri": "https://aicb.dev/vocab/core#Emergency-Halt", "broader": "https://aicb.dev/vocab/core#Concept"}, {"term": "EU AI Act", "category": "Framework", "vocab": "regulatory", "definition": "The European Union's risk-tiered AI regulation. Referenced in TB-06's provenance mapping as one of the frameworks a single federated provenance store is designed to satisfy alongside the U.S. defense/health frameworks.", "iri": "https://aicb.dev/vocab/regulatory#EU-AI-Act", "broader": "https://aicb.dev/vocab/regulatory#Framework"}, {"term": "F1", "category": "Boundary", "vocab": "morphism", "aliases": ["Acquisition -> Features"], "definition": "ECG domain instance (TB-04): raw signal acquisition to extracted features. Loosest tolerance in the chain (tau_S=0.25, tau_M=0.20), lowest consequence weight (w_c=0.3).", "iri": "https://aicb.dev/vocab/morphism#F1", "broader": "https://aicb.dev/vocab/morphism#Boundary-F-i-B-i"}, {"term": "F2", "category": "Boundary", "vocab": "morphism", "aliases": ["Features -> Classification"], "definition": "ECG domain instance (TB-04): extracted features to rhythm classification (tau_S=0.15, tau_M=0.12, w_c=0.6).", "iri": "https://aicb.dev/vocab/morphism#F2", "broader": "https://aicb.dev/vocab/morphism#Boundary-F-i-B-i"}, {"term": "F3", "category": "Boundary", "vocab": "morphism", "aliases": ["Classification -> Rhythm"], "definition": "ECG domain instance (TB-04): classification to rhythm determination (tau_S=0.08, tau_M=0.06, w_c=0.9).", "iri": "https://aicb.dev/vocab/morphism#F3", "broader": "https://aicb.dev/vocab/morphism#Boundary-F-i-B-i"}, {"term": "F4", "category": "Boundary", "vocab": "morphism", "aliases": ["Rhythm -> Decision"], "definition": "ECG domain instance (TB-04): rhythm determination to clinical decision. Tightest tolerance in the chain (tau_S=0.04, tau_M=0.03), maximum consequence weight (w_c=1.0) -- the last checkpoint before a cardiac-relevant action.", "iri": "https://aicb.dev/vocab/morphism#F4", "broader": "https://aicb.dev/vocab/morphism#Boundary-F-i-B-i"}, {"term": "FAA / EASA", "category": "Framework", "vocab": "regulatory", "definition": "The U.S. Federal Aviation Administration and EU Aviation Safety Agency -- the regulated-environment context for the Gulfstream MBSE toolchain-integration engagement cited as relevant past performance for Part II's integration-cost claims.", "iri": "https://aicb.dev/vocab/regulatory#FAA-EASA", "broader": "https://aicb.dev/vocab/regulatory#Framework"}, {"term": "Five-Vector Scoring Framework", "category": "Metric", "vocab": "value", "definition": "From the Talking Points' Measurement Engine (L2): semantic alignment, PII/IP proximity, manipulation intent, regulatory boundary, and behavioral entropy, scored per transaction in under 10ms. A business-facing vector set distinct from (but conceptually parallel to) d_S/d_M -- semantic alignment maps most directly onto d_M/Sa; the other four vectors are domain-risk dimensions with no direct TB-03 equivalent.", "iri": "https://aicb.dev/vocab/value#Five-Vector-Scoring-Framework", "broader": "https://aicb.dev/vocab/value#Metric"}, {"term": "FPR", "category": "Metric", "vocab": "core", "aliases": ["False Positive Rate"], "definition": "Fraction of normal, non-violating actions incorrectly flagged/tripped. Target <5% on normal operations in the acceptance-testing step (T-Eval / Value Points tailoring).", "iri": "https://aicb.dev/vocab/core#FPR", "broader": "https://aicb.dev/vocab/core#Metric"}, {"term": "Functor Certification", "category": "Layer", "vocab": "architecture", "aliases": ["Layer 2", "L2"], "definition": "Layer 2 of the five-layer assurance architecture. Monitors d_S and d_M at every pipeline boundary and enforces the Composition Theorem. A boundary is 'certified' iff d_S <= tau_S AND d_M <= tau_M. Independent of Layer 3 -- a pipeline stage can silently distort meaning even when the final output still passes ontology/semantic-anomaly checks downstream.", "iri": "https://aicb.dev/vocab/architecture#Functor-Certification", "broader": "https://aicb.dev/vocab/architecture#Layer"}, {"term": "Global Trust Budget", "category": "Concept", "vocab": "value", "definition": "A per-session trust budget aggregated across ALL agents by the Enterprise Orchestrator CB. High-frequency drift events across multiple agents -- even individually below any single trip threshold -- deplete the global budget and trigger enterprise-level HITL escalation. The early-warning system for systemic drift that no individual agent's own threshold would catch.", "iri": "https://aicb.dev/vocab/value#Global-Trust-Budget", "broader": "https://aicb.dev/vocab/value#Concept"}, {"term": "GraphDB (RDF Triple Store)", "category": "Component", "vocab": "tooling", "definition": "Stores the domain ontology's rules and runs real-time inference against incoming assertions, queried via SPARQL. L1/L3's ontology backing store in the System Diagram.", "iri": "https://aicb.dev/vocab/tooling#GraphDB-RDF-Triple-Store", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "Ground Truth Authority", "category": "Layer", "vocab": "architecture", "aliases": ["Layer 1", "L1"], "definition": "Layer 1: live sensor physics and the immutable provenance store. Sensor-deterministic ground truth holds a deterministic veto over any AI assertion -- the physical/logical 'reference standard' every other layer measures against.", "iri": "https://aicb.dev/vocab/architecture#Ground-Truth-Authority", "broader": "https://aicb.dev/vocab/architecture#Layer"}, {"term": "GUM", "category": "Formalism", "vocab": "core", "aliases": ["Guide to the Expression of Uncertainty in Measurement"], "definition": "The international standard for computing measurement uncertainty budgets. TB-03's distance metrics attach GUM-style uncertainty (Type A/B) to every d_S/d_M measurement rather than reporting a bare point estimate.", "iri": "https://aicb.dev/vocab/core#GUM", "broader": "https://aicb.dev/vocab/core#Formalism"}, {"term": "H -- Holonic Boundary", "category": "Governance Tuple", "vocab": "governance-tuple", "definition": "The formal specification of an agent's scope of authority: the authority envelope (what it may decide unilaterally), the escalation topology (who owns escalation for which trip condition), and the lateral interface rules (how it interacts with adjacent holons). Without H, the CB can measure distance from the center of a domain but has no definition of where the domain ends.", "iri": "https://aicb.dev/vocab/governance-tuple#H-Holonic-Boundary", "broader": "https://aicb.dev/vocab/governance-tuple#Governance-Tuple"}, {"term": "HITL", "category": "Acronym", "vocab": "hitl", "aliases": ["Human-in-the-Loop"], "definition": "The Layer 5 discipline of routing flagged/tripped epochs to a human Trustee for review, correction, or escalation -- this project's Training & Feedback tab.", "iri": "https://aicb.dev/vocab/hitl#HITL", "broader": "https://aicb.dev/vocab/hitl#Acronym"}, {"term": "Holon / Holarchy", "category": "Concept", "vocab": "core", "definition": "A holon is a self-contained whole that simultaneously participates as a component in a larger whole. Each deployed AI agent instance is treated as a holon carrying its own morphism instruments, SPC state, and ontology version; holons are embedded in a holarchy of agents operating at higher organizational scales.", "iri": "https://aicb.dev/vocab/core#Holon-Holarchy", "broader": "https://aicb.dev/vocab/core#Concept"}, {"term": "HTDR", "category": "Record type", "vocab": "hitl", "aliases": ["Human Trustee Decision Record"], "definition": "Written every Human Trustee action. Retained permanently. Satisfies DoDD 3000.09 SS4(c). In this prototype, HTDR is a hash-chained log kept SEPARATE from the main decision audit trail -- a correction never edits the original record, it appends a new event referencing it.", "iri": "https://aicb.dev/vocab/hitl#HTDR", "broader": "https://aicb.dev/vocab/hitl#Record-type"}, {"term": "Human Trustee", "category": "Layer", "vocab": "architecture", "aliases": ["Layer 5", "L5", "HT"], "definition": "Layer 5: ultimate veto and re-coupling authority. Cannot be overridden by any automated layer. Reviews flagged/tripped epochs, confirms or overrides the breaker's verdict, and authorizes resumption after a lockout. Every action is recorded as an HTDR.", "iri": "https://aicb.dev/vocab/architecture#Human-Trustee", "broader": "https://aicb.dev/vocab/architecture#Layer"}, {"term": "INCOSE", "category": "Institution", "vocab": "program", "aliases": ["International Council on Systems Engineering"], "definition": "Professional systems-engineering body. Cited as institutional anchoring (KSWG contributor, ontology templates) supporting T-Quals' peer-review-accountability argument.", "iri": "https://aicb.dev/vocab/program#INCOSE", "broader": "https://aicb.dev/vocab/program#Institution"}, {"term": "Irreversibility Firewall", "category": "Concept", "vocab": "value", "definition": "Any output flagged as capital-commitment-triggering, contract-executing, or otherwise irreversible requires a cryptographic human co-sign before it can execute -- regardless of how well it scores on every other vector. Escalates further at the multi-agent level as the Irreversibility Consensus Protocol (individual agent CB + domain cluster CB + human token, all three required).", "iri": "https://aicb.dev/vocab/value#Irreversibility-Firewall", "broader": "https://aicb.dev/vocab/value#Concept"}, {"term": "Ktrust", "category": "Metric", "vocab": "core", "aliases": ["Human-AI Calibration Coefficient"], "definition": "Ktrust = AI Health Indicator / Human Cognitive Load. Sensitivity multiplier for breaker thresholds. Ktrust < 0.5 (high operator stress + degraded AI health) triggers an autonomous lockdown regardless of any other metric.", "iri": "https://aicb.dev/vocab/core#Ktrust", "broader": "https://aicb.dev/vocab/core#Metric"}, {"term": "MBSE", "category": "Methodology", "vocab": "program", "aliases": ["Model-Based Systems Engineering"], "definition": "A systems-engineering practice centered on formal models rather than document-centric specs. Cited via the Gulfstream engagement (MBSE toolchain integration in a FAA/EASA-regulated environment) as relevant past performance.", "iri": "https://aicb.dev/vocab/program#MBSE", "broader": "https://aicb.dev/vocab/program#Methodology"}, {"term": "MCP", "category": "Component", "vocab": "tooling", "aliases": ["Model Context Protocol"], "definition": "The integration-layer protocol letting one Trust Engine deployment present an identical interface across manufacturing R&D, edge, and cloud agent runtimes -- L4's adapter to heterogeneous agent hosts in the System Diagram.", "iri": "https://aicb.dev/vocab/tooling#MCP", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "MER", "category": "Record type", "vocab": "hitl", "aliases": ["Morphism Evaluation Record"], "definition": "Written every L2 evaluation cycle. Retained operational-life + 7 years. Satisfies the NIST AI RMF 'Measure' function.", "iri": "https://aicb.dev/vocab/hitl#MER", "broader": "https://aicb.dev/vocab/hitl#Record-type"}, {"term": "Metaphactory", "category": "Component", "vocab": "tooling", "definition": "Ontology management platform used for modeling domain concepts and version-controlling ontology updates (paired with OMG ODM in the Part II tooling stack).", "iri": "https://aicb.dev/vocab/tooling#Metaphactory", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "MIL-STD-882E", "category": "Framework", "vocab": "regulatory", "definition": "DoD System Safety standard. The provenance mapping's CBER (Circuit Breaker Event Record) satisfies its hazard-log requirements.", "iri": "https://aicb.dev/vocab/regulatory#MIL-STD-882E", "broader": "https://aicb.dev/vocab/regulatory#Framework"}, {"term": "MTBH", "category": "Metric", "vocab": "core", "aliases": ["Mean Time Between Hallucinations"], "definition": "Primary longitudinal reliability metric: total operational time divided by the count of verified hallucinations / circuit-breaker trips. The first time-series measure of semantic failure frequency analogous to MTBF (Mean Time Between Failures) in hardware reliability engineering. Declining MTBH signals model drift and should trigger re-validation.", "iri": "https://aicb.dev/vocab/core#MTBH", "broader": "https://aicb.dev/vocab/core#Metric"}, {"term": "MTBH (business framing)", "category": "Metric", "vocab": "value", "definition": "In the Talking Points document, MTBH is expanded as 'Mean Time Between HARMFUL OUTPUTS' (vs. the technical documents' 'Mean Time Between Hallucinations') -- the primary HITL quality KPI, tracked per agent and enterprise-wide. Same underlying measurement, audience-appropriate framing. Target: continuously increasing MTBH over time; a downward trend is the early warning of systemic governance failure.", "iri": "https://aicb.dev/vocab/value#MTBH-business-framing", "broader": "https://aicb.dev/vocab/core#MTBH"}, {"term": "NIH", "category": "Program", "vocab": "program", "aliases": ["National Institutes of Health"], "definition": "U.S. federal agency funding biomedical/health research (R01 and related mechanisms). The other half of Shell 3's dual track, leading with the ECG domain instance (TB-04) and the health-equity distribution-shift argument.", "iri": "https://aicb.dev/vocab/program#NIH", "broader": "https://aicb.dev/vocab/program#Program"}, {"term": "NIST AI RMF", "category": "Framework", "vocab": "regulatory", "aliases": ["NIST AI Risk Management Framework"], "definition": "U.S. NIST's voluntary framework (Govern/Map/Measure/Manage) for trustworthy AI. MER (Morphism Evaluation Record) satisfies its Measure function.", "iri": "https://aicb.dev/vocab/regulatory#NIST-AI-RMF", "broader": "https://aicb.dev/vocab/regulatory#Framework"}, {"term": "NSF", "category": "Program", "vocab": "program", "aliases": ["National Science Foundation"], "definition": "U.S. federal agency funding basic research, evaluated on Intellectual Merit and Broader Impact. Half of Shell 3's dual track, leading with the Composition Theorem and AGM belief revision (TB-01/TB-05).", "iri": "https://aicb.dev/vocab/program#NSF", "broader": "https://aicb.dev/vocab/program#Program"}, {"term": "O -- Domain Ontology", "category": "Governance Tuple", "vocab": "governance-tuple", "definition": "The formal (OWL 2 DL + SHACL + SWRL) semantic representation of a domain's concepts, relationships, regulatory rules, and constraints. Without O, the CB pattern-matches against text; with O, it reasons against a formally consistent model -- and gains the SHACL consistency gate that catches internally-consistent-but-ontologically-invalid hallucinations.", "iri": "https://aicb.dev/vocab/governance-tuple#O-Domain-Ontology", "broader": "https://aicb.dev/vocab/governance-tuple#Governance-Tuple"}, {"term": "OMG ODM", "category": "Component", "vocab": "tooling", "aliases": ["Object Management Group Ontology Definition Metamodel"], "definition": "A standard metamodel for representing ontologies in UML/MOF-based tooling -- part of the ontology-management pairing with Metaphactory.", "iri": "https://aicb.dev/vocab/tooling#OMG-ODM", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "OWL 2 DL", "category": "Component", "vocab": "tooling", "aliases": ["Web Ontology Language 2, Description Logic profile"], "definition": "The formal semantic representation language the Domain Ontology (O) is specified in -- the decidable Description Logic profile of OWL 2, used at the Verizon KG scale (1800+ classes).", "iri": "https://aicb.dev/vocab/tooling#OWL-2-DL", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "phi_i (per-boundary fidelity)", "category": "Metric", "vocab": "morphism", "definition": "phi_i = 1 - d_M for boundary i: that boundary's individual contribution to composed fidelity. The Composition Theorem multiplies these together across a chain rather than averaging them.", "iri": "https://aicb.dev/vocab/morphism#phi-i-per-boundary-fidelity", "broader": "https://aicb.dev/vocab/morphism#Composition-Theorem"}, {"term": "PROV-O", "category": "Component", "vocab": "tooling", "aliases": ["W3C Provenance Ontology"], "definition": "W3C standard ontology for representing provenance. The federated, SPARQL-queryable audit trail across all five record types (MER/CBER/SR/CER/HTDR) is expressed in PROV-O.", "iri": "https://aicb.dev/vocab/tooling#PROV-O", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "RDF", "category": "Component", "vocab": "tooling", "aliases": ["Resource Description Framework"], "definition": "The W3C data model (subject-predicate-object triples) underlying the GraphDB store, OWL ontologies, and the PROV-O audit trail.", "iri": "https://aicb.dev/vocab/tooling#RDF", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "RFP", "category": "Program", "vocab": "program", "aliases": ["Request for Proposal"], "definition": "A commercial or government procurement solicitation evaluated on Technical + Management + Price. Shell 4's target -- a Defense Prime's commercial RFP, where TB-06 (compliance matrix) is the centrepiece rather than an appendix.", "iri": "https://aicb.dev/vocab/program#RFP", "broader": "https://aicb.dev/vocab/program#Program"}, {"term": "Safe State Levels", "category": "Concept", "vocab": "core", "definition": "Graduated CB response: Level 1 Soft Alert (flagged, proceeds with mandatory review), Level 2 Hold (withheld pending human review), Level 3 Halt (autonomous operation stops for this action), Lockout (SOP-02: 3+ trips in 10 minutes locks out ALL autonomous operation until a Trustee re-authorizes).", "iri": "https://aicb.dev/vocab/core#Safe-State-Levels", "broader": "https://aicb.dev/vocab/core#Concept"}, {"term": "SBIR", "category": "Program", "vocab": "program", "aliases": ["Small Business Innovation Research"], "definition": "A U.S. federal set-aside program funding small-business R&D in phases (Phase I feasibility, Phase II development). Shell 2's target: scored roughly equally on Technical merit, Qualifications, and Commercialization potential.", "iri": "https://aicb.dev/vocab/program#SBIR", "broader": "https://aicb.dev/vocab/program#Program"}, {"term": "Semantic Anomaly Score (Sa)", "category": "Metric", "vocab": "core", "definition": "From the earlier design spec: Sa = 1 - cos(Intent Vector, Ontology Centroid). The runtime, single-score cousin of d_M -- quantifies logical divergence between an AI's proposed intent and the valid ontological state space. Tolerance: Sa < 0.15.", "iri": "https://aicb.dev/vocab/core#Semantic-Anomaly-Score-Sa", "broader": "https://aicb.dev/vocab/core#Metric"}, {"term": "SHACL", "category": "Component", "vocab": "tooling", "aliases": ["Shapes Constraint Language"], "definition": "W3C standard for validating RDF graphs against a set of structural/rule conditions ('shapes'). L3's consistency gate calls out to a SHACL validator ahead of any vector/distance scoring.", "iri": "https://aicb.dev/vocab/tooling#SHACL", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "SOP-01", "category": "Procedure", "vocab": "core", "aliases": ["Semantic Handshake"], "definition": "Pre-flight check executed before any autonomous operation begins: verify the ontology is current and reachable, verify sensor precision meets the Rule of Ten, sweep for sensor/electrode faults, verify filter/processing state, initialize trust gauges.", "iri": "https://aicb.dev/vocab/core#SOP-01", "broader": "https://aicb.dev/vocab/core#Procedure"}, {"term": "SOP-02", "category": "Procedure", "vocab": "core", "aliases": ["Real-Time Trust Calibration", "Triple-Trip Lockout"], "definition": "Continuous monitoring of drift on a rolling window; if the deterministic veto activates more than 3 times within any 10-minute window, ALL autonomous operation locks out until a designated Trustee reviews the event log and authorizes resumption.", "iri": "https://aicb.dev/vocab/core#SOP-02", "broader": "https://aicb.dev/vocab/core#Procedure"}, {"term": "SOP-03", "category": "Procedure", "vocab": "core", "aliases": ["Recursive Loop Sanitization"], "definition": "The anti-Model-Collapse immunology layer: every epoch associated with a CB trip is flagged and permanently excluded from the training queue (the triggering segment plus a preceding buffer), preventing the model from re-learning its own hallucinations.", "iri": "https://aicb.dev/vocab/core#SOP-03", "broader": "https://aicb.dev/vocab/core#Procedure"}, {"term": "SOW", "category": "Business Term", "vocab": "value", "aliases": ["Statement of Work"], "definition": "Contract-level scope document. T-Comm's MTBH-as-standard revenue path includes draft SOW language a Defense Prime can insert directly into subcontracts.", "iri": "https://aicb.dev/vocab/value#SOW", "broader": "https://aicb.dev/vocab/value#Business-Term"}, {"term": "SPARQL", "category": "Component", "vocab": "tooling", "aliases": ["SPARQL Protocol and RDF Query Language"], "definition": "The query language/protocol used to query the GraphDB ontology store and the PROV-O audit store -- the concrete API named on most System Diagram integration edges.", "iri": "https://aicb.dev/vocab/tooling#SPARQL", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "SR", "category": "Record type", "vocab": "hitl", "aliases": ["Sanitization Record"], "definition": "Written every Trip or Emergency Halt. Retained permanently. Satisfies DoD AI Ethics traceability requirements -- the record that a tripped epoch was excluded from training.", "iri": "https://aicb.dev/vocab/hitl#SR", "broader": "https://aicb.dev/vocab/hitl#Record-type"}, {"term": "STAMP", "category": "Methodology", "vocab": "regulatory", "aliases": ["Systems-Theoretic Accident Model and Processes"], "definition": "Leveson's systems-theoretic accident causality model underlying STPA -- treats safety as a control problem (inadequate control actions), not just a component-reliability problem.", "iri": "https://aicb.dev/vocab/regulatory#STAMP", "broader": "https://aicb.dev/vocab/regulatory#Methodology"}, {"term": "STPA", "category": "Methodology", "vocab": "regulatory", "aliases": ["Systems-Theoretic Process Analysis"], "definition": "Nancy Leveson's hazard analysis technique built on STAMP, identifying Unsafe Control Actions (UCAs) a system's controllers could issue. The Value Points document extends STPA's UCA concept to the multi-agent case.", "iri": "https://aicb.dev/vocab/regulatory#STPA", "broader": "https://aicb.dev/vocab/regulatory#Methodology"}, {"term": "STTR", "category": "Program", "vocab": "program", "aliases": ["Small Business Technology Transfer"], "definition": "A sibling program to SBIR requiring a formal small-business/research-institution partnership -- used here for a clinical/university ECG-domain variant without diluting the defense Phase II track.", "iri": "https://aicb.dev/vocab/program#STTR", "broader": "https://aicb.dev/vocab/program#Program"}, {"term": "SWRL", "category": "Component", "vocab": "tooling", "aliases": ["Semantic Web Rule Language"], "definition": "A rule language combining OWL with Horn-like rules, used alongside SHACL for the domain ontology's constraint/rule layer (e.g. the RDSG engagement's persona-registry rules).", "iri": "https://aicb.dev/vocab/tooling#SWRL", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "T-Comm", "category": "Gap Block", "vocab": "architecture", "aliases": ["Commercialization and Transition Block"], "definition": "Tier 4 block: the three revenue paths, pricing, and the non-dilutive growth strategy -- 30% of SBIR evaluation score.", "iri": "https://aicb.dev/vocab/architecture#T-Comm", "broader": "https://aicb.dev/vocab/architecture#Tier-4"}, {"term": "T-Eval", "category": "Gap Block", "vocab": "architecture", "aliases": ["Evaluation Plan and Metrics"], "definition": "Tier 4 block: the success-criteria chain (SC-1/SC-2/SC-3), statistical test specs, and the prerequisite uncertainty gate before evaluation may proceed.", "iri": "https://aicb.dev/vocab/architecture#T-Eval", "broader": "https://aicb.dev/vocab/architecture#Tier-4"}, {"term": "T-Quals", "category": "Gap Block", "vocab": "architecture", "aliases": ["Team and Qualifications"], "definition": "Tier 4 block: teaming strategy, track record, and institutional anchoring -- the solo-LLC risk-mitigation evidence.", "iri": "https://aicb.dev/vocab/architecture#T-Quals", "broader": "https://aicb.dev/vocab/architecture#Tier-4"}, {"term": "T-TRL", "category": "Gap Block", "vocab": "architecture", "aliases": ["TRL Progression Block"], "definition": "Tier 4 block: the Phase I activity plan advancing each component from TRL 3 to TRL 4/6, with named evidence artifacts.", "iri": "https://aicb.dev/vocab/architecture#T-TRL", "broader": "https://aicb.dev/vocab/architecture#Tier-4"}, {"term": "tau_S / tau_M", "category": "Parameter", "vocab": "morphism", "aliases": ["tolerance thresholds"], "definition": "Engineering tolerances for d_S and d_M respectively, set per boundary. Tolerances tighten (get smaller) closer to the final decision boundary -- the ECG chain's F1 (acquisition) tolerates tau_S=0.25 while F4 (decision) tolerates only tau_S=0.04.", "iri": "https://aicb.dev/vocab/morphism#tau-S-tau-M", "broader": "https://aicb.dev/vocab/morphism#Parameter"}, {"term": "TB-02", "category": "Technical Block", "vocab": "architecture", "aliases": ["Five-Layer Assurance Architecture"], "definition": "The L1-L5 containment diagram with the circuit-breaker state machine -- this explorer's main Architecture tab subject.", "iri": "https://aicb.dev/vocab/architecture#TB-02", "broader": "https://aicb.dev/vocab/architecture#Tier-2"}, {"term": "TB-02/03", "category": "Technical Block", "vocab": "architecture", "aliases": ["Circuit Breaker / ML Interface Diagram"], "definition": "How the CB sits in the ML inference pipeline as a tight-coupled interceptor, with the guardrail trigger path running in parallel to the primary inference path.", "iri": "https://aicb.dev/vocab/architecture#TB-02-03", "broader": "https://aicb.dev/vocab/architecture#Tier-2"}, {"term": "TB-03", "category": "Technical Block", "vocab": "architecture", "aliases": ["Distance Metrics and Verification"], "definition": "The two-axis morphism quality framework (d_S vs. d_M), four operational quadrants, SPC thresholds, and the CUSUM drift rule. Anchors the Composition Theorem.", "iri": "https://aicb.dev/vocab/architecture#TB-03", "broader": "https://aicb.dev/vocab/architecture#Tier-2"}, {"term": "TB-04", "category": "Technical Block", "vocab": "architecture", "aliases": ["Domain Application: ECG Morphism Chain"], "definition": "The worked ECG domain instance: F1-F4 boundaries, tolerance thresholds, consequence weights, five physiological guardrails, and a Medtronic failure post-mortem.", "iri": "https://aicb.dev/vocab/architecture#TB-04", "broader": "https://aicb.dev/vocab/architecture#Tier-2"}, {"term": "TB-06", "category": "Technical Block", "vocab": "architecture", "aliases": ["Provenance and Regulatory Mapping"], "definition": "The five record types (MER/CBER/SR/CER/HTDR) mapped to five regulatory frameworks -- the compliance backbone letting one provenance store satisfy all of them at once.", "iri": "https://aicb.dev/vocab/architecture#TB-06", "broader": "https://aicb.dev/vocab/architecture#Tier-2"}, {"term": "TB-07b", "category": "Technical Block", "vocab": "architecture", "aliases": ["Wymore / Control Theory"], "definition": "The Wymore 7-tuple mapped to the architecture layers, with the Wymore-Morphism Correspondence Theorem and three gap-closure statements.", "iri": "https://aicb.dev/vocab/architecture#TB-07b", "broader": "https://aicb.dev/vocab/architecture#Tier-2"}, {"term": "Tier 1", "category": "Documentation Tier", "vocab": "architecture", "definition": "The Master Narrative -- written once, trimmed per submission (target 600 words): the hook and the foundational technical claims. Folded into the Value Points tab in this explorer.", "iri": "https://aicb.dev/vocab/architecture#Tier-1", "broader": "https://aicb.dev/vocab/architecture#Documentation-Tier"}, {"term": "Tier 2", "category": "Documentation Tier", "vocab": "architecture", "definition": "The six modular technical blocks (TB-02, TB-03, TB-04, TB-07b, TB-02/03, TB-06) -- written once, reused with different emphasis across every Tier 3 submission shell.", "iri": "https://aicb.dev/vocab/architecture#Tier-2", "broader": "https://aicb.dev/vocab/architecture#Documentation-Tier"}, {"term": "Tier 3", "category": "Documentation Tier", "vocab": "architecture", "definition": "The four submission shells (DARPA BAA, DoD SBIR/STTR, NSF/NIH, Defense Prime RFP) that repackage the same Tier 2 blocks for different evaluators and criteria.", "iri": "https://aicb.dev/vocab/architecture#Tier-3", "broader": "https://aicb.dev/vocab/architecture#Documentation-Tier"}, {"term": "Tier 4", "category": "Documentation Tier", "vocab": "architecture", "definition": "The gap blocks -- organizational, evidence, and commercial content beyond the technical blocks: Team & Qualifications, TRL Progression, Evaluation Plan, Commercialization.", "iri": "https://aicb.dev/vocab/architecture#Tier-4", "broader": "https://aicb.dev/vocab/architecture#Documentation-Tier"}, {"term": "Tom Sawyer Perspectives", "category": "Component", "vocab": "tooling", "definition": "The analytics/visualization workbench used for root-cause analysis of CB event clusters and impact visualization of misclassification propagation -- reads the PROV-O audit store.", "iri": "https://aicb.dev/vocab/tooling#Tom-Sawyer-Perspectives", "broader": "https://aicb.dev/vocab/tooling#Component"}, {"term": "Trip Multiplier (1.5x tau)", "category": "Parameter", "vocab": "core", "definition": "Per TB-02: the CB does not trip the instant a distance exceeds tolerance (tau) -- it enters an Alert state between 1.0x and 1.5x tau, and only formally Trips at or beyond 1.5x tau. This graduated response avoids over-tripping on borderline measurement noise while still catching real drift early (as an Alert).", "iri": "https://aicb.dev/vocab/core#Trip-Multiplier-1-5x-tau", "broader": "https://aicb.dev/vocab/core#Parameter"}, {"term": "TRL", "category": "Program", "vocab": "program", "aliases": ["Technology Readiness Level"], "definition": "A 1-9 maturity scale for a technology component, from basic principles observed (TRL 1) to flight-proven (TRL 9). Part II's tooling inventory is TRL 7+ across all 23 components; T-TRL tracks this prototype's own CB/metrics components from TRL 3 to TRL 4/6.", "iri": "https://aicb.dev/vocab/program#TRL", "broader": "https://aicb.dev/vocab/program#Program"}, {"term": "Two-Axis Morphism Distance (D_s, D_b)", "category": "Metric", "vocab": "morphism", "definition": "From the SE4AI abstract's Figure 2: D_s (structural distance, x-axis) captures how many distinct real-world states the AI lumps together; D_b (behavioral distance, y-axis) captures worst-case output discrepancy. The morphism_assurance document's d_S/d_M is a practically-scoped instance of this same two-axis idea, applied per pipeline boundary.", "iri": "https://aicb.dev/vocab/morphism#Two-Axis-Morphism-Distance-D-s-D-b", "broader": "https://aicb.dev/vocab/morphism#Metric"}, {"term": "Unsafe Control Action (UCA)", "category": "Concept", "vocab": "value", "definition": "From STPA/STAMP (Leveson): a control action that, in a particular context, leads to a hazard. The Talking Points document extends this to the MULTI-AGENT case: an ensemble of individually-safe agent actions whose coordinated effect is an undisclosed material change in enterprise risk posture -- a composite UCA no single agent's own governance would catch.", "iri": "https://aicb.dev/vocab/value#Unsafe-Control-Action-UCA", "broader": "https://aicb.dev/vocab/value#Concept"}, {"term": "V -- Vector Context Store", "category": "Governance Tuple", "vocab": "governance-tuple", "definition": "The dynamic, scenario-specific embedding store: current regulatory guidance, counterparty/transaction context, operational risk parameters, and the historical decision distribution that calibrates SPC control limits. Without V, every decision is scored against the same static standard regardless of context, and SPC thresholds are theoretical, not measured.", "iri": "https://aicb.dev/vocab/governance-tuple#V-Vector-Context-Store", "broader": "https://aicb.dev/vocab/governance-tuple#Governance-Tuple"}, {"term": "VDC", "category": "Metric", "vocab": "core", "aliases": ["Value-Drift Coefficient"], "definition": "Distance between current agent behavior and the original validated baseline intent, tracked over a rolling window. Sustained drift above a set threshold triggers a Level-1 alert (SOP-02).", "iri": "https://aicb.dev/vocab/core#VDC", "broader": "https://aicb.dev/vocab/core#Metric"}, {"term": "w_c", "category": "Parameter", "vocab": "morphism", "aliases": ["consequence weight"], "definition": "Consequence weight in [0,1]: how costly a certification failure at this boundary is. Rises toward 1.0 as boundaries approach the final action/decision -- the same numeric distance error means something very different at the sensing boundary (w_c=0.3) than at the decision boundary (w_c=1.0).", "iri": "https://aicb.dev/vocab/morphism#w-c", "broader": "https://aicb.dev/vocab/morphism#Parameter"}, {"term": "Wymore 7-tuple", "category": "Formalism", "vocab": "architecture", "aliases": ["Sigma = (T,X,Omega,S,Y,Lambda,delta)"], "definition": "The classical Wymore mathematical-systems-theory tuple, mapped onto the architecture as the formal backbone: T = time set, X = input set, Omega = admissible input segments, S = state set, Y = output set, Lambda = output/readout function, delta = state transition function. The Wymore-Morphism Correspondence Theorem: every Wymore system composition is a morphism in the category of Wymore systems (WSys) and vice versa. Three gaps this closes: (1) static models -> runtime functor certification, (2) no measurement procedure -> GUM uncertainty metrics, (3) no composition assurance -> the Composition Theorem.", "iri": "https://aicb.dev/vocab/architecture#Wymore-7-tuple", "broader": "https://aicb.dev/vocab/architecture#Formalism"}], "tuple_elements": [{"code": "H", "name": "Holonic Boundary Definition", "color": "#4c8dff", "definition": "The formal specification of this agent's scope of authority: the authority envelope, the escalation topology, and the lateral interface rules to adjacent holons.", "without_it": "The CB's semantic alignment scores outputs against the policy envelope -- but the policy envelope's edges are defined by H. Without H, the CB cannot distinguish 'operating at the boundary of its holon' (a proximity warning) from 'operating outside its holon entirely' (a jurisdictional violation). Trip-event escalation routing also has no structural basis.", "cb_dependency": "L1 Reference Standard (policy envelope edges). L4 Actuation (escalation routing). L3 SPC (boundary proximity as a monitored variable, not just a binary trip)."}, {"code": "O", "name": "Domain Ontology", "color": "#7b5fd9", "definition": "The formal (OWL 2 DL + SHACL + SWRL) semantic representation of the domain's concepts, relationships, regulatory rules, and validity constraints.", "without_it": "The CB pattern-matches against text instead of reasoning against a formally consistent model. The SHACL consistency gate -- which catches hallucinations that are internally consistent but ontologically invalid -- does not exist without O.", "cb_dependency": "L1 Reference Standard (the 'what is correct' definition). L2 Measurement Engine (consistency gate, pre-vector). L5 Provenance Audit (domain-specific entity typing)."}, {"code": "V", "name": "Vector Context Store", "color": "#2ba0a0", "definition": "The dynamic, scenario-specific embedding store: current regulatory guidance, transaction/counterparty context, operational risk parameters, and the historical decision distribution.", "without_it": "Every action is scored against the same static standard regardless of scenario -- producing false positives (flagging behavior that's fine in context) AND false negatives (clearing behavior that's dangerous in the specific scenario). SPC control limits become theoretical numbers instead of measured ones.", "cb_dependency": "L2 Measurement Engine (contextual scoring against V, not just O's general envelope). L3 SPC (behavioral baseline + control-chart calibration). HITL loop (reviewer decisions write back to V)."}, {"code": "A", "name": "Domain Agent", "color": "#d9527b", "definition": "The AI agent itself, specified as a CONSTITUTIVE element of the tuple: output schema grounded in O, retrieval referencing V, authority scope corresponding to H, training data filtered through O's constraints.", "without_it": "If A is built independently and governance is added afterward, the CB operates on a systematic mismatch: what the agent considers its decision space and what the CB considers authorized scope diverge. This is the most common failure mode in enterprise AI governance -- false positives from ungrounded vocabulary, false negatives from unscored retrieval context.", "cb_dependency": "All five CB layers depend on A's co-design with the tuple."}], "tuple_framings": [{"name": "Stack (sequential layers)", "verdict": "fails", "detail": "Build A, then add O on top, then V, then H. Fails because H's boundary definition constrains what A is allowed to do -- A cannot be fully specified until H exists. The boundary comes last in a stack; it must come first in a tuple."}, {"name": "Pipeline (directional flow)", "verdict": "fails", "detail": "H feeds O, O feeds V, V feeds A -- implies one-way dependency. Fails because V's embeddings must anchor to O's types, but O's constraint rules must reflect what V will encounter, which requires knowing A's operational context. Circular, not directional."}, {"name": "Menu (optional components)", "verdict": "fails", "detail": "Deploy whichever elements are available. Fails immediately: V without O scores similarity against an undefined standard; O without H can't tell a boundary crossing from an in-scope edge case. Partial tuples produce partial governance -- worse than none, because they create false confidence."}, {"name": "Tuple (co-defined simultaneously)", "verdict": "correct", "detail": "All four defined together, each constraining and informed by the others. Iterative convergence across all four in parallel is the only development model consistent with the CB's actual operational requirements."}], "tuple_completeness": [{"missing": "H missing (O, V, A present)", "fails": "L1 policy envelope has no defined edges. L4 escalation routing has no structural basis.", "production_failure": "CB cannot distinguish boundary proximity from jurisdictional violation. Escalation routes to the wrong authority. Adjacent-holon interference goes undetected."}, {"missing": "O missing (H, V, A present)", "fails": "Consistency gate (SHACL pre-check) does not exist. Policy envelope contains raw text embeddings, not ontology-grounded assertions.", "production_failure": "Ontologically invalid but internally consistent hallucinations pass vector scoring. Audit records are queryable by keyword but not by ontological relationship. Regulatory compliance cannot be demonstrated from the audit trail."}, {"missing": "V missing (H, O, A present)", "fails": "SPC control-chart limits are theoretical, not empirical. Contextual scoring evaluates against general policy, not scenario-specific risk parameters.", "production_failure": "False-positive spikes in high-context scenarios (novel counterparties, elevated risk). False-negative spikes for policy-compliant-but-contextually-dangerous behavior. HITL reviewer decisions have no write-back target -- they're lost."}, {"missing": "A not co-designed with the tuple (H, O, V present, A built independently)", "fails": "Output schema not ontologically typed -- L1 embedding space misaligns with agent output space. Retrieval diverges from V, invalidating L2 contextual scoring.", "production_failure": "Systematic CB miscalibration from day one. False-positive rate structurally elevated because the agent's vocabulary was never grounded in O. HITL reviewers face a constant stream of legitimate outputs flagged as violations. CB credibility erodes and governance is abandoned."}, {"missing": "H + O missing (V, A present)", "fails": "L1 reference standard is undefined. No policy envelope. No boundary specification.", "production_failure": "CB has no definition of 'correct' -- it can only detect statistical anomalies from the agent's own historical distribution, which is circular if the agent was already drifting during the baseline period."}, {"missing": "V + A not co-designed (H, O present, V static, A independent)", "fails": "CB becomes a static compliance checker, not a dynamic governance layer. No contextual adaptation or behavioral-baseline evolution.", "production_failure": "The CB becomes a regulatory checkbox -- checks outputs against a fixed rulebook and nothing else. Sophisticated drift (gradual behavioral entropy increase, context-specific policy evasion) is invisible to it."}], "tuple_deployment_rule": "The quad-tuple elements are version-locked together at deployment. H v1.0 + O v1.0 + V v1.0 + A v1.0 ship as a single release artifact. ANY change to any element -- a regulatory update to O, a new scenario class in V, a fine-tuning run on A -- triggers a new tuple release cycle, not an isolated component update, because any change to one element potentially invalidates the calibration of the others.", "tuple_lean_startup": [["Hypothesis (what does success look like?)", "H -- the formal, testable statement of what the agent is and isn't supposed to do."], ["Measurement Instrument (how will you know?)", "O -- the formal definition of what 'correct' means in this domain; without it the CB estimates correctness rather than measuring it."], ["Minimum Viable Test (smallest signal?)", "V -- the specific context the hypothesis is tested in right now, not a generalized abstract environment."], ["The Product Being Tested", "A -- but only valid if designed against the specific H/O/V, not built independently."], ["The Validated Learning Loop", "The HITL cycle: reviewer decision -> V update -> O refinement -> H adjustment -> A retraining -> new tuple version."], ["Premature Scaling", "Deploying A without a complete tuple -- committing production resources to an unvalidated hypothesis, where the cost of failure is a regulatory breach, not a pivot."]], "tier1": {"id": "MN", "title": "Master Narrative", "subtitle": "Written once, trimmed per submission -- target 600 words", "hook": "The full narrative and the three foundational technical claims now live in the Value Points tab -- start there for the business case. This Architecture tab documents HOW those claims are technically realized: the Tier 2 technical blocks, Tier 3 submission shells, Tier 4 gap blocks, the Part II tooling stack, and the System Diagram showing how it all integrates with the governed agent.", "claims": []}, "tier1_diagram": {"intro": "Figure 1 from the source document -- the master layout of every component in this explorer: the Master Narrative feeding nine Tier 2 technical blocks, four Tier 3 submission shells that repackage those same nine blocks per evaluator, and four Tier 4 gap blocks that complete a submission beyond the technical content. Click any box to jump straight to its full page.", "nodes": [{"id": "MN", "label": "MN -- Master Narrative", "kind": "mn", "x": 50, "y": 7, "detail": "The 600-word shared hook and three foundational claims every submission's opening paragraph draws from -- now developed in full under the Value Points tab.", "jump": {"tab": "value"}}, {"id": "TB-01", "label": "TB-01 Morphism", "kind": "tb", "x": 6, "y": 30, "detail": "The formal foundation: two-axis morphism distance and the Composition Theorem proving multiplicative fidelity degradation across boundaries.", "jump": {"block": "TB-01"}}, {"id": "TB-02", "label": "TB-02 Architecture", "kind": "tb", "x": 17, "y": 30, "detail": "The five-layer (L1-L5) assurance architecture and circuit-breaker state machine.", "jump": {"block": "TB-02"}}, {"id": "TB-03", "label": "TB-03 Metrics", "kind": "tb", "x": 28, "y": 30, "detail": "The d_S / d_M two-axis distance metrics that anchor the Composition Theorem.", "jump": {"block": "TB-03"}}, {"id": "TB-04", "label": "TB-04 Domain (ECG)", "kind": "tb", "x": 39, "y": 30, "detail": "The worked ECG domain instance: five boundaries (F1-F4) with concrete tolerances and physiological guardrails.", "jump": {"block": "TB-04"}}, {"id": "TB-05", "label": "TB-05 ML/Bayesian", "kind": "tb", "x": 50, "y": 30, "detail": "Probabilistic functors and AGM belief revision for learning-enabled components -- sketched in the source material but not fully drafted (see its page for the honest scope note).", "jump": {"block": "TB-05"}}, {"id": "TB-06", "label": "TB-06 Provenance", "kind": "tb", "x": 61, "y": 30, "detail": "Five provenance record types mapped to five regulatory frameworks -- the compliance backbone.", "jump": {"block": "TB-06"}}, {"id": "TB-07b", "label": "TB-07b Wymore", "kind": "tb", "x": 72, "y": 30, "detail": "The Wymore 7-tuple mapped onto the architecture layers, with the Wymore-Morphism Correspondence Theorem.", "jump": {"block": "TB-07b"}}, {"id": "TB-0203", "label": "TB-02/03 CB/ML Interface", "kind": "tb", "x": 83, "y": 30, "detail": "How the circuit breaker tight-couples into the ML inference pipeline: primary inference path, parallel semantic-guardrail path, and the L5 escalation path.", "jump": {"block": "TB-02/03"}}, {"id": "PART2", "label": "Part II Tooling", "kind": "tb", "x": 94, "y": 30, "detail": "The 23-component tooling and technology inventory, all TRL 7+, cross-referenced by layer.", "jump": {"block": "PART2"}}, {"id": "SHELL-DARPA", "label": "Shell 1: DARPA BAA", "kind": "shell", "x": 15, "y": 57, "detail": "15-page technical volume; scientific novelty is the primary evaluation criterion.", "jump": {"block": "TIER3"}}, {"id": "SHELL-SBIR", "label": "Shell 2: DoD SBIR/STTR", "kind": "shell", "x": 38, "y": 57, "detail": "20-page volume; merit + qualifications + commercialization, binary success criteria.", "jump": {"block": "TIER3"}}, {"id": "SHELL-NSF", "label": "Shell 3: NSF/NIH", "kind": "shell", "x": 62, "y": 57, "detail": "Dual-track academic application; intellectual merit + broader impact.", "jump": {"block": "TIER3"}}, {"id": "SHELL-PRIME", "label": "Shell 4: Defense Prime RFP", "kind": "shell", "x": 85, "y": 57, "detail": "Technical + management + price; the compliance matrix (TB-06) is the centrepiece.", "jump": {"block": "TIER3"}}, {"id": "GAP-QUALS", "label": "T-Quals: Team & Quals", "kind": "gap", "x": 15, "y": 82, "detail": "Teaming strategy, track record, and institutional anchoring for a solo-LLC risk profile.", "jump": {"block": "TIER4", "t4": "T-Quals"}}, {"id": "GAP-TRL", "label": "T-TRL: TRL Progression", "kind": "gap", "x": 38, "y": 82, "detail": "TRL 3 -> 4 -> 6 arc with named evidence artifacts per Phase I deliverable.", "jump": {"block": "TIER4", "t4": "T-TRL"}}, {"id": "GAP-EVAL", "label": "T-Eval: Evaluation Plan", "kind": "gap", "x": 62, "y": 82, "detail": "Success-criterion chains: claim -> statistical test -> pass condition -> evidence artifact.", "jump": {"block": "TIER4", "t4": "T-Eval"}}, {"id": "GAP-COMM", "label": "T-Comm: Commercialization", "kind": "gap", "x": 85, "y": 82, "detail": "Three revenue paths and the non-dilutive SBIR/STTR growth strategy.", "jump": {"block": "TIER4", "t4": "T-Comm"}}], "edges": [{"src": "MN", "dst": "TB-01", "label": ""}, {"src": "MN", "dst": "TB-02", "label": ""}, {"src": "MN", "dst": "TB-03", "label": ""}, {"src": "MN", "dst": "TB-04", "label": ""}, {"src": "MN", "dst": "TB-05", "label": ""}, {"src": "MN", "dst": "TB-06", "label": ""}, {"src": "MN", "dst": "TB-07b", "label": ""}, {"src": "MN", "dst": "TB-0203", "label": ""}, {"src": "MN", "dst": "PART2", "label": ""}]}, "tier2_blocks": [{"id": "TB-01", "title": "Morphism-Grounded Compositional Assurance", "meta": "DARPA S2 centrepiece | NSF IM S1 centrepiece | SBIR S2.1 (stated only) | Defense Prime one paragraph", "summary": "The formal foundation underneath TB-02 (architecture), TB-03 (metrics), and TB-04 (domain instance): the two-axis morphism distance and the Composition Theorem that proves fidelity degrades multiplicatively, not additively, across a pipeline's boundaries. Source of the Master Narrative's three novel claims.", "components": [{"code": "THM", "name": "Composition Theorem", "color": "#7b5fd9", "function": "phi(Fn o ... o F1) >= prod(phi(Fi)) -- fidelity degrades MULTIPLICATIVELY across a chain of boundaries, not additively or by averaging", "invariant": "A four-layer pipeline at 0.95 fidelity per layer delivers only 0.81 end-to-end fidelity", "description": "The headline formal result of the morphism-grounded assurance framework, and the first of the Master Narrative's three novel claims: per-boundary testing that only checks each boundary in isolation cannot see this loss, because no single boundary's test fails -- the loss only appears when the boundaries are composed.", "example": "Worked example (Master Narrative, Three Novel Claims): a 19% end-to-end fidelity loss (0.95^4 = 0.8145) is completely undetectable by per-layer testing alone -- each of the four layers reports a passing 0.95, and only the composed measurement reveals the true 0.81."}, {"code": "MTBH", "name": "MTBH as a Formal Trust Metric", "color": "#7b5fd9", "function": "Mean Time Between Hallucinations -- total operational time / verified hallucination count", "invariant": "The first time-series measure of semantic failure frequency analogous to MTBF in hardware reliability engineering", "description": "The second of the three novel claims: reframing semantic/hallucination failure as a reliability-engineering quantity with an established measurement discipline (MTBF-style longitudinal tracking), rather than a one-off benchmark accuracy score.", "example": "Worked example (Technical Design Document, Section 12.1): declining MTBH is explicitly defined as the signal that triggers mandatory model re-validation -- MTBH is not just reported, it is wired into an operational SOP."}, {"code": "SAN", "name": "Sanitization as Anti-Collapse Mechanism", "color": "#7b5fd9", "function": "Architecturally mandated exclusion of tripped data from training corpora (SOP-03)", "invariant": "The first structurally enforced implementation of Recursive Loop Sanitization in an autonomous-systems assurance framework", "description": "The third of the three novel claims: without this mechanism, a model that hallucinates, gets corrected, and is then retrained on its own (uncorrected) hallucinated output can silently reinforce the very failure mode it was corrected for -- 'model collapse' by self-training on bad data. SOP-03 makes exclusion structural, not a training-pipeline hygiene suggestion.", "example": "Worked example (Technical Design Document, Section 11.3, Inbound Data Validation Workflow): 'any record associated with a prior CB trip is automatically rejected' at the SHACL validation step -- the exclusion happens at data-loading time, before the record can ever reach a training corpus."}]}, {"id": "TB-02", "title": "Five-Layer Assurance Architecture", "meta": "SBIR S2.2 | DARPA S4 | Defense Prime S2 -- ~900 words / 2 pages", "summary": "L1-L5 containment diagram showing the full stack with the circuit-breaker state machine. Each layer has a distinct functional domain, data flow, and trust-measurement point.", "components": [{"code": "L5", "name": "Human Trustee", "function": "Ultimate veto and re-coupling authority", "invariant": "Cannot be overridden by any automated layer", "color": "#d93025", "description": "The only layer with authority to force a state transition the automated stack cannot reach on its own -- confirming or overriding a trip verdict, and re-authorizing autonomous operation after a lockout. Every Human Trustee action is written as an HTDR (Human Trustee Decision Record), permanently retained, satisfying DoDD 3000.09 SS4(c)'s requirement that a human remain the final authority in the loop.", "example": "Worked example (Technical Design Document, SS10.4 / SS13.2): SOP-02 Triple-Trip Lockout -- if the deterministic veto activates more than 3 times within any 10-minute window, ALL autonomous AI operation locks out immediately. A designated Human Trustee must review the full CB event log, identify the root cause, and provide authenticated electro
