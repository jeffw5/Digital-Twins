nic authorization before the system resumes -- and the Human-AI Calibration Coefficient (Ktrust) is recalculated before restart, not just rubber-stamped."}, {"code": "L4", "name": "Circuit Breaker + Monitor", "function": "CB state machine; MTBH counter; sanitization gate", "invariant": "Trips at 1.5x tau; Emergency Halt on guardrail violation", "color": "#e8730a", "description": "The central enforcement mechanism: a cross-cutting component that evaluates every AI output before transmission, atomically and synchronously -- the output is physically withheld until the evaluation completes. It holds absolute, deterministic veto authority over every AI-generated assertion regardless of the model's self-reported confidence; a 'Super-Huberous' assertion (high confidence, no physical grounding) is named explicitly as the highest-risk failure mode this layer exists to catch.", "example": "Worked example (Technical Design Document, SS10.2, ECG-specific trip logic): IF (Intent_Delta > Sensor_Ground_Truth_Tolerance) OR (Trust_Metric < Minimum_Trust_Threshold) OR (Semantic_Anomaly_Score > Anomaly_Ceiling) OR (Contextual_Relevancy_Index < CRI_Minimum) THEN activate the deterministic veto, execute the safe-state action for the current severity level, flag the data epoch for SOP-03 exclusion from the training queue, and log {timestamp, AI_assertion, physical_signal_epoch, intent_delta, trust_scores, filter_state, action_taken} -- ELSE transmit the AI assertion with trust-score metadata attached."}, {"code": "L3", "name": "Consistency Manager", "function": "Delta/Tolerance evaluation; impossible-state detection", "invariant": "Impossible states halt coupling unconditionally", "color": "#e8a300", "description": "Encodes the domain's physically/logically impossible states as hard-coded W3C RDF/OWL ontology rules -- not probabilistic models, established clinical/domain knowledge that no AI inference may contradict without triggering an immediate circuit-breaker event. This is what catches a hallucination that is internally self-consistent but ontologically invalid, independent of any numeric distance score passing downstream.", "example": "Worked examples (Technical Design Document, SS11.1, Design-Time Semantic Guardrails): an intrinsic ventricular rate above 300 bpm without documented pre-excitation is physiologically impossible and triggers immediate Level-3 activation; a PR interval under 60 ms or a QRS duration under 60 ms in an adult is an impossible state; a QT interval over 700 ms triggers a mandatory medication-context check; simultaneous ST-segment elevation across all 12 leads without a pericarditis context is reclassified as a sensor-artifact state pending review, not accepted as a primary pathological finding; and asserting both 'P-wave before every QRS with constant PR' and second-degree/complete AV block simultaneously is an ontological contradiction that halts coupling outright."}, {"code": "L2", "name": "Functor Certification", "function": "d_S and d_M monitoring; composition theorem enforcement", "invariant": "Certified iff d_S <= tau_S AND d_M <= tau_M", "color": "#4c8dff", "description": "Monitors structural distance (d_S, did the SHAPE of the representation change crossing this boundary) and semantic distance (d_M, did the MEANING change) independently of Layer 3 -- a pipeline stage can silently distort meaning even when the final output still passes the ontology check downstream. This is the layer that makes the Composition Theorem's fidelity bound an enforced runtime property rather than a design-time proof.", "example": "Worked example of the structural/semantic split in practice (Technical Design Document, SS9.2, Advanced Signal Analysis): before applying a Wigner-Ville Distribution, the signal must first be converted to an Analytical Signal via the Hilbert Transform -- skipping this step (a structural distortion, high d_S) creates pseudo-energy artifacts the AI layer would misinterpret as real high-frequency events, a hallucination caused purely by an uncertified structural transform, not a semantic error. Separately, Skewness and Kurtosis (3rd/4th-order cumulants) are computed per beat as a noise-robust check that non-Gaussian artifacts from electrode motion or electrosurgical interference haven't been misread as genuine morphology."}, {"code": "L1", "name": "Ground Truth Authority", "function": "Live sensor physics; immutable provenance store", "invariant": "Sensor-deterministic ground truth holds deterministic veto", "color": "#1e8e3e", "description": "The physical/logical 'reference standard' every other layer measures against -- live sensor physics and an immutable provenance store. If the signal entering the pipeline is already corrupted, no downstream layer can validate against a reliable baseline, so acquisition fidelity is treated as the zero-tolerance foundation the rest of the architecture is built on.", "example": "Worked example (Technical Design Document, SS4.1, Oversampling Requirements): front-end acquisition runs at 1,000-15,000+ Hz specifically to prevent aliasing of narrow high-frequency events such as pacemaker spikes under 0.5 ms duration, while the processed/output rate is held to a 500 Hz minimum per the Nyquist theorem and AHA recommendations, keeping amplitude measurement error within the AHA fidelity mandate of +/-10 uV and +/-10 ms -- the numeric floor every downstream layer's ground-truth comparison ultimately rests on."}]}, {"id": "TB-03", "title": "Distance Metrics and Verification", "meta": "DARPA S3 | NSF IM S2 | SBIR S2.3 -- ~900 words / 2 pages", "summary": "The two-axis morphism quality framework (d_S vs. d_M) with four operational quadrants, SPC thresholds, and a CUSUM drift rule. Anchors the Composition Theorem.", "components": [{"symbol": "d_S", "name": "Structural distance", "code": "d_S", "function": "A*-based normalized graph edit distance (GED); beam width tuned for <100ms at <=10K nodes", "invariant": "Type A: GED algorithm variance. Type B: beam-width truncation bias.", "description": "Quantifies how much the SHAPE of a representation changed crossing a pipeline boundary -- independent of whether its meaning also changed. A boundary is certified on this axis iff d_S <= tau_S, with tau_S tightening as boundaries approach the final decision.", "example": "Worked example: the ECG morphism chain's four boundaries (TB-04) tighten tau_S from 0.25 at F1 (Acquisition -> Features, where structural change is expected and tolerated) down to 0.04 at F4 (Rhythm -> Decision, where almost no structural drift is acceptable this close to a clinical action) -- the same GED computation, evaluated against a threshold that is itself an engineering decision tied to consequence."}, {"symbol": "d_M", "name": "Semantic distance", "code": "d_M", "function": "Cosine distance between domain encoder embeddings anchored to a reference ontology", "invariant": "Type A: encoder variance across seeds. Type B: reference-ontology boundary ambiguity.", "description": "Quantifies how much the MEANING of a representation changed crossing a pipeline boundary, via cosine distance between domain-encoder embeddings anchored to the reference ontology. Certified iff d_M <= tau_M -- and, per the Composition Theorem, passing d_M at every individual boundary does NOT guarantee the composed pipeline's end-to-end semantic fidelity.", "example": "Worked example: the breaker's own Semantic Anomaly Score (SAS) in the ECG Technical Design Document is a sibling metric on the same axis, engineered with a concrete numeric ceiling of 0.40 (0-1.0 scale) -- above which divergence from the cardiac ontology is treated as evidence of hallucination rather than legitimate novel classification, exactly the same design pattern d_M/tau_M generalizes."}]}, {"id": "TB-04", "title": "Domain Application: ECG Morphism Chain", "meta": "DARPA S6 | NIH Approach -- ~800 words / 2 pages", "summary": "Worked domain instance: five boundaries (F1-F4) with tolerance thresholds, consequence weights, five physiological guardrails, and a Medtronic failure post-mortem.", "components": [{"code": "F1", "name": "Acquisition -> Features", "tau_s": 0.25, "tau_m": 0.2, "w_c": 0.3, "evidence": "ISO 11073-91064; AHA ECG quality", "function": "tau_S=0.25 | tau_M=0.20 | w_c=0.3 -- Evidence: ISO 11073-91064; AHA ECG quality", "description": "The earliest, most tolerant boundary in the chain -- checks the transform from raw electrode signal to extracted waveform features. Consequence weight is lowest here (w_c=0.3) because an error at this stage is furthest from an irreversible clinical action and most likely to be caught by a downstream boundary.", "example": "Worked example (Technical Design Document, SS4, Signal Acquisition Layer): 1,000-15,000+ Hz front-end oversampling collapsed to a 500 Hz minimum processing rate; pacemaker spikes under 0.5 ms duration must survive anti-aliasing intact. The Data Layer's named primary failure modes -- sensor noise, motion artifacts, electrode displacement, powerline interference -- are exactly what F1's tau_S/tau_M are tuned to catch before they propagate."}, {"code": "F2", "name": "Features -> Classification", "tau_s": 0.15, "tau_m": 0.12, "w_c": 0.6, "evidence": "PhysioNet benchmarks; AHA/ACC", "function": "tau_S=0.15 | tau_M=0.12 | w_c=0.6 -- Evidence: PhysioNet benchmarks; AHA/ACC", "description": "Checks the transform from extracted features into a beat classification. Tolerances tighten roughly in half from F1 as the pipeline commits to a specific clinical category, and this boundary's ontological ceiling is the AAMI 5-category mapping itself.", "example": "Worked example (Technical Design Document, SS9.1, AAMI Mapping): the system maps 14 MIT-BIH beat classes into 5 AAMI categories (N/S/V/F/Q), each with its own hard ontological constraint the classifier's assertion must satisfy -- e.g. asserting category 'V' (Ventricular Ectopic) requires QRS duration > 120 ms with no preceding P-wave in fixed relationship; an assertion outside that constraint fails F2 certification regardless of the model's confidence, and unclassifiable beats ('Q') mandatorily route to physician overread."}, {"code": "F3", "name": "Classification -> Rhythm", "tau_s": 0.08, "tau_m": 0.06, "w_c": 0.9, "evidence": "ESC Guidelines; FDA MAUDE cardiac AI", "function": "tau_S=0.08 | tau_M=0.06 | w_c=0.9 -- Evidence: ESC Guidelines; FDA MAUDE cardiac AI", "description": "Checks the transform from individual beat classifications into an overall rhythm assertion. Consequence weight jumps to 0.9 here because this is where the architecture's hard-coded impossible-state guardrails fire -- a rhythm assertion is not just numerically close to ground truth, it must be ontologically POSSIBLE.", "example": "Worked example (Technical Design Document, SS11.1, Impossible State Definitions): intrinsic ventricular rate > 300 bpm without documented pre-excitation triggers immediate Level-3 activation; PR interval < 60 ms or QRS < 60 ms in an adult is impossible; QT > 700 ms forces a medication-context check; simultaneous ST elevation across all 12 leads with no pericarditis context is reclassified as a sensor artifact rather than accepted as pathology -- all four are F3-boundary ontology rules, independent of any numeric distance score."}, {"code": "F4", "name": "Rhythm -> Decision", "tau_s": 0.04, "tau_m": 0.03, "w_c": 1.0, "evidence": "ACC/AHA STEMI; ESC ACS guidelines", "function": "tau_S=0.04 | tau_M=0.03 | w_c=1.0 -- Evidence: ACC/AHA STEMI; ESC ACS guidelines", "description": "The tightest boundary in the chain, feeding directly into the Three-Level Safe-State Activation. Consequence weight is 1.0 -- the same numeric distance error means something categorically different here than at F1, because the next step is a transmitted clinical decision, not an intermediate representation.", "example": "Worked example (Technical Design Document, SS10, Multi-Layer Validation Logic): a 'Super-Huberous' assertion -- high AI confidence with no physical grounding -- is named explicitly as the highest-risk failure mode this boundary exists to catch. This is also the boundary tied to the Medtronic failure post-mortem referenced in TB-04's summary: a real documented case of a high-confidence rhythm output that should have been vetoed before reaching a clinical decision."}]}, {"id": "TB-05", "title": "Probabilistic Functors and Belief Revision", "meta": "DARPA S5 (full, LEC + AGM) | NSF IM S3 | SBIR S2.5 (compressed) | Omitted from Defense Prime", "summary": "Probabilistic functors and AGM belief revision -- how the morphism framework's certification logic composes with genuinely uncertain, learning-enabled components (LECs) rather than the purely deterministic ontology checks in TB-02/TB-04. NSF leads with this block as intellectual merit, framing an AGM (Alchourrn-Grdenfors-Makinson) belief-revision instantiation as closing a documented 40-year gap between the classical AGM theory and its application to runtime-certified AI pipelines. The source material sketches this block's placement and role across every submission shell (DARPA Full S5 pairing LEC theory with AGM; SBIR compressed S2.5; NSF intellectual merit S3; omitted entirely from the Defense Prime shell) but -- unlike TB-02/03/04/06/07b -- its full technical exposition was not included in this version of the source document (the Master Narrative itself notes the underlying claims are 'fully specified in structure... but not yet drafted in final polished form'). It is included here as a placeholder consistent with the nine-block Figure 1 architecture, not padded out with unsourced technical detail.", "components": []}, {"id": "TB-07b", "title": "Wymore / Control Theory", "meta": "DARPA S7 | Defense Prime S2 (primary differentiator) -- ~900 words / 2 pages", "summary": "Wymore 7-tuple Sigma=(T,X,Omega,S,Y,Lambda,delta) mapped to the architecture layers, with the Wymore-Morphism Correspondence Theorem and three gap-closure statements.", "components": [{"code": "T", "name": "Time set", "function": "Cross-cutting -- every layer's evaluation is timestamped and ordered", "invariant": "", "color": "#7b5fd9", "description": "The ordered index every other Wymore component is defined over -- without it, 'state' and 'transition' have no meaning. Every provenance record (TB-06) is written against this same time set, which is what makes the audit chain orderable and replayable.", "example": "Worked example: every one of the five provenance record types (MER, CBER, SR, CER, HTDR) opens with a timestamp field, and the ECG trip-logic LOG statement's first field is literally 'timestamp' -- T is not an abstraction here, it's the first column of every log line."}, {"code": "X", "name": "Input set", "function": "L1 Ground Truth Authority -- raw sensor/context input space", "invariant": "", "color": "#7b5fd9", "description": "The space of raw inputs the system can ever receive -- for L1, this is bounded by physical reality, not by what the AI model expects to see.", "example": "Worked example: the ECG front-end's acquisition space is bounded by 1,000-15,000+ Hz sampling of the electrode/ADC signal -- X is that raw digitized waveform space before any filtering, feature extraction, or classification has touched it."}, {"code": "Omega", "name": "Admissible input segments", "function": "L2 Functor Certification -- which input traversals are within tolerance", "invariant": "", "color": "#7b5fd9", "description": "Not every element of X is admissible for a given transformation -- Omega is the subset of input trajectories Layer 2 will certify as within d_S/d_M tolerance for a given boundary.", "example": "Worked example: F1's tau_S=0.25/tau_M=0.20 defines a much wider admissible segment than F4's tau_S=0.04/tau_M=0.03 -- Omega isn't one fixed set, it's tightened per boundary as the consequence weight w_c rises."}, {"code": "S", "name": "State set", "function": "L3 Consistency Manager -- the space of ontologically valid states", "invariant": "", "color": "#7b5fd9", "description": "The space of states the system is permitted to occupy -- defined not by what's numerically close to ground truth, but by what's ontologically POSSIBLE under the domain's hard-coded RDF/OWL constraints.", "example": "Worked example: 'intrinsic ventricular rate > 300 bpm without documented pre-excitation' is outside S entirely -- it is excluded by ontological definition, not by a distance threshold, which is exactly why Layer 3 halts unconditionally rather than gradedly for these cases."}, {"code": "Y", "name": "Output set", "function": "L4 Circuit Breaker -- the space of actions that may be transmitted", "invariant": "", "color": "#7b5fd9", "description": "The space of actions/assertions the system is allowed to actually transmit downstream -- distinct from S (valid internal states) because an internally valid state can still fail the trip-logic gate on trust-metric or anomaly-score grounds before it reaches Y.", "example": "Worked example: the Three-Level Safe-State Activation defines exactly three admissible shapes for a transmitted output -- a flagged low-confidence classification (Level 1), raw signal with no AI interpretation (Level 2), or nothing but safe monitoring state (Level 3) -- Y is that three-element output space, not the raw classifier logits."}, {"code": "Lambda", "name": "Output / readout function", "function": "L4 -- maps internal state to a transmitted decision + trust metadata", "invariant": "", "color": "#7b5fd9", "description": "The function that reads the internal state and produces the actual transmitted decision plus its attached trust metadata -- this is what turns an internal trust computation into something a downstream consumer (a clinician, an orchestrating agent) can act on.", "example": "Worked example: Lambda is what attaches trust_score_metadata to the output record in the ELSE branch of the ECG trip logic -- the transmitted assertion is never bare; it always carries the readout of the state that produced it."}, {"code": "delta", "name": "State transition function", "function": "L5 Human Trustee -- the only actor authorized to force a state transition outside normal operation", "invariant": "", "color": "#7b5fd9", "description": "The function governing how the system's state changes -- normally driven by the automated layers, but the Wymore formalism reserves one specific transition (forced resumption from a locked-out state) as authorizable only by Layer 5, never by delta acting alone.", "example": "Worked example: SOP-02's lockout cannot be exited by any automated rule, however many trip-free cycles pass -- only a Human Trustee's authenticated authorization is a valid delta transition out of the locked-out state, which is the formal reason L5 is described as holding 're-coupling authority' rather than merely veto authority."}], "extra": {"theorem": "Every Wymore system composition is a morphism in WSys and vice versa.", "gaps": ["Static models -> runtime functor certification (L2 makes certification a continuous runtime process, not a design-time proof)", "No measurement procedure -> GUM-style uncertainty budgets attached to every distance metric", "No composition assurance -> the Composition Theorem gives a provable, not asserted, end-to-end fidelity bound"]}}, {"id": "TB-02/03", "title": "Circuit Breaker / ML Interface Diagram", "meta": "Supports SBIR S2 | DARPA S4/5 technical approach", "summary": "The Circuit Breaker sits in the ML inference pipeline as a tight-coupled interceptor, not a downstream log consumer: every AI/ML output passes through L2 (Functor Certification) and L3 (Consistency Manager) before it is eligible for L4 transmission. The semantic guardrail trigger path runs in parallel to the primary inference path so an Emergency Halt can preempt output delivery -- the CB is architecturally positioned to prevent a bad action, not just to record that one happened. Guardrail violations escalate directly to L5 Human Trustee, bypassing the graduated Alert/Trip path used for ordinary threshold breaches.", "components": [{"code": "PATH-1", "name": "Primary Inference Path", "color": "#4c8dff", "function": "The AI/ML pipeline's normal signal-to-decision flow (Data -> Algorithmic -> LLM/AI -> output layers)", "invariant": "Every output passes through L2 (Functor Certification) and L3 (Consistency Manager) before it is eligible for L4 transmission", "description": "The pipeline's ordinary path: raw signal, through filtering and feature extraction, into AI classification. The circuit breaker is a tight-coupled interceptor on this path, not a downstream log consumer -- nothing reaches the clinical interface without first clearing certification.", "example": "Worked example (Technical Design Document, Section 3.2, Four-Layer Stack): Data Layer (raw acquisition) -> Algorithmic Layer (filtering, template construction, feature extraction) -> LLM/AI Layer (rhythm classification, ST interpretation) -- each with its own named failure mode the certification gate is watching for."}, {"code": "PATH-2", "name": "Semantic Guardrail Trigger Path", "color": "#e8730a", "function": "Runs in parallel to the primary inference path so an Emergency Halt can preempt output delivery", "invariant": "Architecturally positioned to PREVENT a bad action, not just record that one happened", "description": "A parallel monitoring path, not a sequential post-check -- it watches the same inference in flight and can trigger an Emergency Halt before the primary path's output is ever transmitted. This is the structural reason the breaker is called a circuit breaker rather than an audit log.", "example": "Worked example (Technical Design Document, Section 10.2, Core Trip Logic): the evaluation is explicitly 'atomic and synchronous -- the AI output is withheld until the circuit breaker completes its assessment,' which is only possible because the guardrail path runs alongside, not after, the primary inference."}, {"code": "PATH-3", "name": "L5 Escalation Path", "color": "#d93025", "function": "Guardrail violations escalate directly to L5 Human Trustee, bypassing the graduated Alert/Trip path used for ordinary threshold breaches", "invariant": "Not every trip reaches L5 immediately -- only guardrail (impossible-state) violations do", "description": "A second escalation route distinct from the graduated Level 1/2/3 safe-state path: an impossible-state (guardrail) violation skips the graduated response entirely and goes straight to the Human Trustee, because an ontologically impossible assertion is treated as categorically different from a merely low-confidence one.", "example": "Worked example (Technical Design Document, Section 11.1): an intrinsic ventricular rate over 300 bpm without documented pre-excitation triggers immediate Level-3 activation -- there is no Level 1 'soft alert' pathway for an ontologically impossible assertion; it escalates at the top of the severity scale on the first occurrence."}]}, {"id": "TB-06", "title": "Provenance and Regulatory Mapping", "meta": "Defense Prime S3 (centrepiece) | NIH Rigor -- ~1,000 words / 2.5 pages", "summary": "Five record types mapped to five regulatory frameworks -- the compliance backbone that lets one provenance store satisfy MIL-STD-882E, DoDD 3000.09, NIST AI RMF, EU AI Act, and DoD AI Ethics.", "components": [{"code": "MER", "name": "Morphism Evaluation", "function": "Written: Every L2 evaluation cycle | Retention: Op + 7yr", "invariant": "NIST AI RMF -- Measure function", "color": "#2ba0a0", "description": "Written every time Layer 2 (Functor Certification) evaluates a pipeline boundary crossing. This is the record that lets the Composition Theorem's multiplicative fidelity bound be recomputed from real operational history rather than asserted once at design time.", "example": "Worked example of record content (Technical Design Document, SS10.2, Core Trip Logic LOG statement): {timestamp, AI_assertion, physical_signal_epoch, intent_delta, trust_scores, filter_state, action_taken} -- an MER captures the same shape of evidence for every boundary crossing, whether or not that crossing certified."}, {"code": "CBER", "name": "CB Event", "function": "Written: Every CB state transition | Retention: Op + 7yr", "invariant": "MIL-STD-882E hazard log", "color": "#2ba0a0", "description": "Written every time the circuit breaker's own state machine transitions -- Soft Alert -> AI Hold -> Emergency Halt, or a lockout entry/exit. Satisfies MIL-STD-882E's hazard-log requirement: a documented, timestamped account of every safety-relevant state change.", "example": "Worked example (Technical Design Document, SS10.4, Three-Level Safe State Activation): a Level 2 'AI Hold' event withholds the AI classification from the clinical interface while continuing to transmit raw signal and computed measurements -- that transition, and the trip conditions that caused it, is exactly what a CBER captures."}, {"code": "SR", "name": "Sanitization", "function": "Written: Every Trip or Emergency Halt | Retention: Permanent", "invariant": "DoD AI Ethics -- Traceable", "color": "#2ba0a0", "description": "Written every time a tripped or halted epoch is excluded from the recursive-learning training queue under SOP-03 -- the record that proves a hallucinated epoch never re-entered the model's training data, closing the anti-collapse loop.", "example": "Worked example (Technical Design Document, SS11.3, Inbound Data Validation Workflow): any record associated with a prior CB trip is automatically rejected at the SHACL validation step before it can be loaded into the graph store -- the corresponding SR is the permanent, auditable proof that the rejection happened."}, {"code": "CER", "name": "Calibration Event", "function": "Written: Every calibration change | Retention: Permanent", "invariant": "DoDI 5000.97 -- digital thread", "color": "#2ba0a0", "description": "Written every time a threshold, tolerance, or model version is recalibrated -- the digital thread DoDI 5000.97 requires for AI configuration management, so a regulator can reconstruct exactly which tolerance was in force at the time of any historical decision.", "example": "Worked example (Technical Design Document, SS10.4, SOP-02): after a Triple-Trip Lockout, the Human-AI Calibration Coefficient (Ktrust) is explicitly recalculated before autonomous operation resumes -- that recalculation is a CER, distinct from the HTDR that records the Trustee's authorization decision itself."}, {"code": "HTDR", "name": "Human Trustee Decision", "function": "Written: Every HT action | Retention: Permanent", "invariant": "DoDD 3000.09 SS4(c)", "color": "#2ba0a0", "description": "Written every time the Human Trustee (Layer 5) takes an action on a flagged or tripped event -- confirming a hallucination, overriding a false positive, correcting a label into the ontology, escalating, or authorizing resumption from lockout. Permanent, and never edits the original decision record it references -- corrections are new events, not edits to history.", "example": "Worked example (Technical Design Document, SS10.4, SOP-02 Lockout Protocol): after 3+ trips in 10 minutes, the Human Trustee reviews the full CB event log, identifies the root cause, and provides authenticated electronic authorization to resume -- that authorization, timestamped and attributed, is the HTDR."}]}], "tier3_overview": [{"shell": "DARPA BAA", "evaluator": "Research PM + tech advisors", "criterion": "Scientific novelty", "pages": 15, "differentiator": "Three formally novel results; Assumptions Audit"}, {"shell": "DoD SBIR/STTR", "evaluator": "Technical evaluator + CO", "criterion": "Merit + Quals + Commercialization", "pages": 20, "differentiator": "Binary success criteria; TRL advancement with named artifacts"}, {"shell": "NSF/NIH", "evaluator": "Academic reviewers / study section", "criterion": "Intellectual merit + Broader impact", "pages": "15 (NSF) / 12 (R01)", "differentiator": "Scientific question fr
