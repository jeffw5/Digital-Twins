 "pages": 1.5, "criterion": "Actual draft SOW language the prime can insert into subcontracts"}, {"code": "S5", "name": "Digital thread", "source": "TB-07b + TB-06 CER", "pages": 1.0, "criterion": "CER chain implements DoDI 5000.97 for AI configuration management"}, {"code": "S6", "name": "Past performance", "source": "Professional narrative", "pages": 1.5, "criterion": "Verizon KG, RDSG defense instantiation, Gulfstream MBSE"}, {"code": "S7", "name": "Teaming + personnel", "source": "New content (T-Quals)", "pages": 1.0, "criterion": "3 named advisors; INCOSE affiliation; clearance status"}, {"code": "S8", "name": "Integration cost", "source": "Part II + TB-06", "pages": 1.5, "criterion": "$200-500K/year separate compliance packages eliminated"}]}], "cross_shell_comparison": [{"block": "TB-01 Morphism", "darpa": "Centrepiece S2 -- full theorem", "sbir": "Supporting S2.1 -- stated only", "nsf_nih": "NSF centrepiece IM S1", "prime": "One paragraph -- acquisition bridge"}, {"block": "TB-02 Architecture", "darpa": "Full S4 -- CLARA alignment", "sbir": "Full S2.2 -- Phase I deliverables", "nsf_nih": "NIH methods section", "prime": "Full S2 -- adapter framing"}, {"block": "TB-03 Metrics", "darpa": "Full S3 -- GUM budgets + diagram", "sbir": "Full S2.3 -- MTBH leads", "nsf_nih": "NSF intellectual merit S2", "prime": "MTBH only -- S4 contract language"}, {"block": "TB-04 Domain", "darpa": "Validation S6 -- pages 9-11", "sbir": "Application S2.4 -- pages 7-8", "nsf_nih": "NIH research object (Aims 1-3)", "prime": "Compliance evidence in S3"}, {"block": "TB-05 ML/Bayesian", "darpa": "Full S5 -- LEC + AGM", "sbir": "Compressed S2.5", "nsf_nih": "NSF intellectual merit S3", "prime": "Omitted"}, {"block": "TB-06 Governance", "darpa": "Supporting S7", "sbir": "Supporting S2.2 + S4", "nsf_nih": "NIH rigor + reproducibility", "prime": "Centrepiece S3 -- compliance matrix"}, {"block": "TB-07b Wymore", "darpa": "Full S7 -- theorem", "sbir": "One paragraph S2.2", "nsf_nih": "NSF intellectual merit S4", "prime": "Primary differentiator S2"}, {"block": "Part II Tooling", "darpa": "Appendix only", "sbir": "S7 Facilities", "nsf_nih": "NSF Facilities", "prime": "Price justification S8"}], "tier4_blocks": [{"id": "T-Quals", "title": "Team and Qualifications", "meta": "SBIR S6 | Defense Prime S6 | NSF Biosketch -- 4 variants by submission type"}, {"id": "T-TRL", "title": "TRL Progression Block", "meta": "SBIR S3.4 -- ~600 words + Figure 13 -- within 4-page work plan section"}, {"id": "T-Eval", "title": "Evaluation Plan and Metrics", "meta": "SBIR S3.3 | NSF Year 1 exit criteria | NIH Statistical Considerations -- ~700 words / 2 pages"}, {"id": "T-Comm", "title": "Commercialization and Transition Block", "meta": "SBIR S5 (mandatory) -- ~900 words / 2 pages -- 30% of SBIR evaluation score"}], "t_quals": {"meta": "SBIR S6 | Defense Prime S6 | NSF Biosketch -- 4 variants by submission type", "mechanisms": ["Teaming strategy -- named technical advisors for formal methods, clinical informatics, and DoD systems engineering provide accountability without requiring sub-contracts.", "Track record -- Verizon KG (30K+ assets, $100M+ value), RDSG RAVEN-3/HERALD-1 (defense domain, same programs), Gulfstream (MBSE toolchain integration in FAA/EASA regulated environment).", "Institutional anchoring -- INCOSE KSWG contributor, Business Architecture Guild Meta Model Team co-lead, EKGF active member."], "engagements": [{"engagement": "Verizon KG: 30K+ assets, OWL 2 DL, 1800+ classes, 94% compliance, $100M+ value", "relevance": "Same technical stack as L3 of proposed architecture", "submissions": "All four"}, {"engagement": "RDSG RAVEN-3/HERALD-1: defense persona registry, SWRL rules, DoDD 3000.09", "relevance": "Direct defense domain work on same program names", "submissions": "DARPA + SBIR + Prime"}, {"engagement": "Gulfstream EA: $50M portfolio, 90-day delivery, FAA/EASA compliance", "relevance": "MBSE toolchain integration in regulated environment -- analogous to DoDI 5000.97", "submissions": "Prime + SBIR"}, {"engagement": "INCOSE KSWG: ontology templates, IW26 Japan vision", "relevance": "Sets MBSE standards the architecture satisfies; peer review accountability", "submissions": "DARPA + NSF"}]}, "t_trl": {"meta": "SBIR S3.4 -- ~600 words + Figure 13 -- within 4-page work plan section", "rows": [{"component": "Circuit Breaker", "activity": "D1 months 1-3: CB running on ECG F3, 1000-cycle log, <5% FPR", "artifact": "CB-001 Implementation Report", "criterion": "Component validation in laboratory environment"}, {"component": "Two-axis metrics", "activity": "D1 months 1-3: GUM uncertainty budgets; U(d) < 10%*tau gate", "artifact": "AT-001 Acceptance Test Report", "criterion": "Calibrated instrument with documented uncertainty"}, {"component": "MTBH baseline", "activity": "D2 months 3-5: failure injection study; Wilcoxon p < 0.05", "artifact": "MTBH-001 Baseline Report", "criterion": "Validated component performance"}]}, "t_eval": {"meta": "SBIR S3.3 | NSF Year 1 exit criteria | NIH Statistical Considerations -- ~700 words / 2 pages", "gate": "Prerequisite gate: U(d_S) < 0.1*tau_S AND U(d_M) < 0.1*tau_M. For ECG F3: U(d_S) < 0.008 AND U(d_M) < 0.006. Gate failure pauses D2 with a 30-day cure period.", "rows": [{"sc": "SC-1", "claim": "CB detects >=95% injected failures; <5% FPR", "test": "One-proportion z-test, alpha=0.05, one-tailed", "pass_condition": "Lower 95% CI bound > 0.95 per class", "artifact": "AT-001"}, {"sc": "SC-2", "claim": "MTBH statistically distinguishable under failure", "test": "Wilcoxon signed-rank, n=500, power=0.85, pre-registered directional H_A", "pass_condition": "W statistic p < 0.05", "artifact": "MTBH-001"}, {"sc": "SC-3", "claim": "100% Trip events covered by HTDR audit", "test": "Set equality: |H| = |T|; hash chain verification", "pass_condition": "Zero uncovered trips; all hashes valid", "artifact": "PROV-001"}]}, "t_comm": {"meta": "SBIR S5 (mandatory) -- ~900 words / 2 pages -- 30% of SBIR evaluation score", "revenue_paths": [{"path": "P1", "model": "SaaS compliance monitoring layer", "pricing": "$30-80K/system/year", "year1": "2 systems = $60-160K ARR", "year3": "15 systems = ~$750K ARR"}, {"path": "P2", "model": "Domain calibration professional services", "pricing": "$150-300K/engagement", "year1": "1-2 = $150-600K", "year3": "3-5/year"}, {"path": "P3", "model": "MTBH standard licensing -- after standardization", "pricing": "$50-200K/year/vendor", "year1": "Standardization only", "year3": "3+ vendors = $150-600K"}], "growth_strategy": ["Phase I SBIR ($150K-300K) -- funds TRL 3->4; generates Phase II application evidence.", "Phase II SBIR ($750K-1.5M) -- funds TRL 4->6; generates first program office transition relationship.", "Phase II-E Commercialization Assistance Program -- up to $150K bridge from Phase II to commercial.", "STTR clinical variant -- funds ECG expansion with a university clinical informatics partner without diluting the defense Phase II.", "No VC required -- the LLC retains full IP ownership and commercialization control."]}, "diagram_index": [{"fig": 1, "title": "Component content system -- four-tier architecture", "location": "Tier 1, after Master Narrative header", "purpose": "Full four-tier architecture overview"}, {"fig": 2, "title": "Five-layer assurance architecture", "location": "Tier 2, TB-02", "purpose": "L1-L5 containment with CB states"}, {"fig": 3, "title": "Two-axis morphism quality", "location": "Tier 2, TB-03", "purpose": "d_S / d_M quadrant map"}, {"fig": 4, "title": "ECG morphism chain", "location": "Tier 2, TB-04", "purpose": "Five boundary tolerances and guardrails"}, {"fig": 5, "title": "Wymore correspondence", "location": "Tier 2, TB-07b", "purpose": "7-tuple mapped to architecture layers"}, {"fig": 6, "title": "Circuit breaker / ML interface", "location": "Tier 2, TB-02/03", "purpose": "CB interaction with ML inference pipeline"}, {"fig": 7, "title": "Provenance regulatory mapping", "location": "Tier 2, TB-06", "purpose": "Five records -> five frameworks"}, {"fig": 8, "title": "Tooling stack summary", "location": "Tier 2, Part II", "purpose": "23 components with TRL and cost estimate"}, {"fig": 9, "title": "DARPA BAA volume map", "location": "Tier 3, Shell 1", "purpose": "15-page section structure"}, {"fig": 10, "title": "SBIR Phase I volume map", "location": "Tier 3, Shell 2", "purpose": "20-page volume, three criteria color-coded"}, {"fig": 11, "title": "NSF/NIH dual-track map", "location": "Tier 3, Shell 3", "purpose": "Parallel NSF and NIH sections"}, {"fig": 12, "title": "Defense Prime RFP map", "location": "Tier 3, Shell 4", "purpose": "Three-volume RFP structure"}, {"fig": 13, "title": "TRL progression timeline", "location": "Tier 4, T-TRL", "purpose": "TRL 3->4->6 arc with artifacts"}, {"fig": 14, "title": "Evaluation plan structure", "location": "Tier 4, T-Eval", "purpose": "SC chains with statistical specs"}, {"fig": 15, "title": "Commercialization map", "location": "Tier 4, T-Comm", "purpose": "Revenue paths and transition milestones"}], "part2_summary": {"total_components": 23, "min_trl": 7, "novel_dev_required": false, "phase1_cost_low": 25000, "phase1_cost_high": 35000}, "part2_tooling": [{"layer": "L1 Ground Truth Authority", "tool": "Deterministic sensors / ADC front-end", "role": "Physical ground truth acquisition", "source": "Technical Design Doc S4 (signal acquisition layer)"}, {"layer": "L1 / Knowledge Fabric", "tool": "GraphDB (RDF triple store)", "role": "Stores all domain ontology rules; real-time inference against incoming assertions", "source": "Technical Design Doc S11.2, Knowledge Graph Storage"}, {"layer": "L1 / Knowledge Fabric", "tool": "Metaphactory + OMG ODM", "role": "Ontology management; models domain concepts; version control for ontology updates", "source": "Technical Design Doc S11.2, Ontology Management"}, {"layer": "L2 Functor Certification", "tool": "Domain-specific Vector Databases", "role": "Intent pattern storage; semantic similarity search for classification-context validation", "source": "Technical Design Doc S11.2, Intent Pattern Storage"}, {"layer": "L3 Consistency Manager", "tool": "SHACL / SWRL validators", "role": "Structural + rule-based validation of assertions against the ontology before vector scoring", "source": "Cross-referenced from TB-06 / Addendum O definition"}, {"layer": "L4 Circuit Breaker + Monitor", "tool": "Model Context Protocol (MCP) integration layer", "role": "Enables an identical Trust Engine deployment across manufacturing R&D, edge, and cloud", "source": "Technical Design Doc S11.2, Integration Protocol"}, {"layer": "L5 Human Trustee / Analytics", "tool": "Tom Sawyer Perspectives", "role": "Root-cause analysis of CB event clusters; impact visualization for misclassification propagation", "source": "Technical Design Doc S11.2, Analytics Workbench"}, {"layer": "Integration", "tool": "PROV-O (W3C Provenance Ontology) + SPARQL", "role": "Federated, queryable audit trail across all five record types (MER/CBER/SR/CER/HTDR)", "source": "SE4AI abstract, Layer 5 Underwriting Interface"}], "system_diagram": {"intro": "Every box is a real integration point, not just a conceptual layer. Click any component for its detail design; edge labels name the concrete API/protocol at that integration point.", "nodes": [{"id": "agent", "label": "Autonomous Automation (Agent)", "kind": "agent", "x": 50, "y": 6, "detail": "The AI model or autonomous agent being governed -- an LLM completion call, a classifier, or a full tool-calling loop. Never subclassed or modified; adapted via two small functions (to_assertion, to_ground_truth) so the breaker stays blind to what kind of model it governs.", "api": "Two in-process integration patterns: (1) protect() decorator wraps a single-shot call and raises/returns trust metadata; (2) ToolGate.guard() wraps a tool-calling loop's pre-execution step, so the real tool executor only runs if the breaker allows it -- a true pre-execution veto."}, {"id": "l1", "label": "L1 Ground Truth Authority", "kind": "layer", "x": 13, "y": 24, "detail": "Live sensor and context telemetry treated as deterministic physical reality. Holds a deterministic veto over any AI assertion that disagrees with it.", "api": "GroundTruth(values={...}) passed in-process at evaluate() call time. A production deployment typically sources this from a telemetry/SCADA/OSS feed via its own polling or streaming API; the breaker itself is transport-agnostic about how GroundTruth gets populated."}, {"id": "l2", "label": "L2 Functor Certification", "kind": "layer", "x": 37, "y": 24, "detail": "Measures structural (d_S) and semantic (d_M) distance at every boundary the agent's pipeline crosses; a boundary is certified iff both are within tolerance.", "api": "MorphismChain.evaluate_pass(pass_id, measurements) -- in-process. In a fully instrumented pipeline, `measurements` would come from diffing the agent's actual intermediate representations at each boundary rather than being hand-set."}, {"id": "l3", "label": "L3 Consistency Manager", "kind": "layer", "x": 63, "y": 24, "detail": "Evaluates the proposed action against hard ontology rules -- physically/logically impossible states -- independent of any distance/similarity score.", "api": "OntologyRule predicates evaluated in-process against AgentAssertion.fields. A production deployment would call out to the SHACL / SWRL Validator node (below) over its validation-report API rather than evaluating Python predicates directly."}, {"id": "l4", "label": "L4 Circuit Breaker + Monitor", "kind": "layer", "x": 87, "y": 24, "detail": "The CB state machine: combines Sa/Cr/trust-index thresholds, SPC drift detection, and L2/L3 findings into a single decision, and maintains the MTBH counter.", "api": "CircuitBreaker.evaluate() -- the single synchronous veto gate every governed agent call passes through before its action is allowed to execute."}, {"id": "l5", "label": "L5 Human Trustee", "kind": "layer", "x": 50, "y": 42, "detail": "Ultimate veto and re-coupling authority. Every flagged/tripped epoch lands in this layer's review queue; a Trustee confirms, overrides, corrects, or escalates.", "api": "review_flagged_event() / resume_from_lockout() -- called from the Training & Feedback (HITL) tab, a human-operated client, via the export -> apply_hitl_review.py replay pattern (this prototype's static-file deliverable has no live server to call into directly)."}, {"id": "graphdb", "label": "GraphDB (RDF Triple Store)", "kind": "tool", "x": 8, "y": 62, "detail": "Stores the domain ontology's rules and runs real-time inference against incoming assertions. Same technical stack as the Verizon KG engagement (30K+ assets, OWL 2 DL).", "api": "SPARQL 1.1 Protocol over HTTP -- L1/L3 query the ontology store for reference assertions and consistency rules."}, {"id": "vectordb", "label": "Domain Vector DB", "kind": "tool", "x": 29, "y": 62, "detail": "Intent-pattern storage and semantic-neighborhood lookups backing the local_neighborhood_centroid Sa calculation and L2's semantic distance measurements at scale.", "api": "Vector similarity search API (gRPC/REST, e.g. an ANN index service) -- L2 queries this for semantic-neighborhood lookups instead of the in-process hashing embeddings this prototype uses."}, {"id": "shacl", "label": "SHACL / SWRL Validator", "kind": "tool", "x": 50, "y": 62, "detail": "Structural and rule-based validation of assertions against the ontology, ahead of any vector/distance scoring -- the consistency gate that catches internally-consistent-but-ontologically-invalid hallucinations.", "api": "SHACL validation-report API (HTTP, W3C SHACL spec) -- L3 calls out to this before returning its consistency verdict to L4."}, {"id": "mcp", "label": "MCP Integration Layer", "kind": "tool", "x": 71, "y": 62, "detail": "Lets one Trust Engine deployment present an identical governance interface across manufacturing R&D, edge, and cloud agent runtimes without a bespoke integration per surface.", "api": "Model Context Protocol -- the adapter layer L4 exposes so heterogeneous agent runtimes (LLM hosts, tool-calling frameworks, custom agents) integrate against one consistent protocol."}, {"id": "provo", "label": "PROV-O / SPARQL Audit Store", "kind": "tool", "x": 92, "y": 62, "detail": "Federated, queryable audit trail across all five provenance record types (MER, CBER, SR, CER, HTDR) -- the compliance backbone mapped in TB-06.", "api": "PROV-O (W3C Provenance Ontology) over SPARQL -- L4 writes MER/CBER/SR/CER here on every evaluation cycle and state transition; L5 writes HTDR here on every Trustee action."}, {"id": "analytics", "label": "Analytics Workbench", "kind": "tool", "x": 50, "y": 78, "detail": "Root-cause analysis of CB event clusters and impact visualization for misclassification propagation across the pipeline (Tom Sawyer Perspectives in the reference tooling stack).", "api": "Reads the PROV-O audit store over SPARQL -- a read-only downstream consumer, not in the real-time veto path."}, {"id": "console_ui", "label": "Governance Console (HITL UI)", "kind": "human", "x": 50, "y": 94, "detail": "The human-operated browser client -- this document's own Training & Feedback tab -- where a Trustee digs into a specific flagged fault and stages a correction.", "api": "Human-operated browser client. Stages review decisions client-side and exports hitl_decisions.json; examples/apply_hitl_review.py replays the scenario set and calls CircuitBreaker.review_flagged_event() to make the correction stick server/process-side."}], "edges": [{"src": "agent", "dst": "l1", "label": "GroundTruth feed"}, {"src": "agent", "dst": "l4", "label": "protect() / ToolGate.guard()"}, {"src": "l1", "dst": "l2", "label": "sensor state"}, {"src": "l2", "dst": "l3", "label": "certified boundary state"}, {"src": "l3", "dst": "l4", "label": "consistency verdict"}, {"src": "l4", "dst": "l5", "label": "flagged / tripped epoch"}, {"src": "l1", "dst": "graphdb", "label": "SPARQL ontology query"}, {"src": "l2", "dst": "vectordb", "label": "semantic similarity query"}, {"src": "l3", "dst": "shacl", "label": "SHACL validation call"}, {"src": "l4", "dst": "mcp", "label": "MCP protocol"}, {"src": "l4", "dst": "provo", "label": "CBER / MER / SR / CER write"}, {"src": "l5", "dst": "provo", "label": "HTDR write"}, {"src": "provo", "dst": "analytics", "label": "SPARQL read"}, {"src": "l5", "dst": "console_ui", "label": "review queue"}]}, "quadrants": [{"id": "ideal", "name": "Ideal", "subtitle": "Near-isomorphic", "x_range": "low d_S", "y_range": "low d_M", "color": "#1e8e3e", "definition": "Both structure and meaning are preserved crossing the boundary. This is what certification is trying to confirm -- the transformation is a faithful morphism."}, {"id": "precise_but_wrong", "name": "Precise but Wrong", "subtitle": "Discretization failure", "x_range": "low d_S", "y_range": "high d_M", "color": "#d93025", "definition": "Structure looks preserved (shape/graph similarity is high) but meaning has drifted -- numerical error buildup or a subtly wrong mapping that survives structural checks. The most dangerous quadrant: it looks fine on a structural audit."}, {"id": "coarse_but_safe", "name": "Coarse but Safe", "subtitle": "Lumped-parameter model", "x_range": "high d_S", "y_range": "low d_M", "color": "#4c8dff", "definition": "Structure has been simplified or collapsed (a safe simplification / lumped-parameter reduction) but the behavior/meaning that matters is still preserved. Often an intentional, acceptable engineering tradeoff -- not automatically a fault."}, {"id": "divergent", "name": "Divergent", "subtitle": "Unmeasured AI", "x_range": "high d_S", "y_range": "high d_M", "color": "#8b0000", "definition": "Both structure and meaning have diverged. An AI operating here is, in the abstract's words, effectively 'unmeasured' -- there is no basis left to trust its output at all."}], "composition_theorem": {"formula": "phi(Fn o ... o F1) >= prod_{i=1}^{n} phi(Fi)", "explanation": "Fidelity degrades MULTIPLICATIVELY across a chain of boundaries. A naive per-layer-only dashboard reports the AVERAGE per-boundary fidelity, which is always higher than the true composed (multiplied) fidelity once there is more than one boundary -- the gap between them is loss that no single boundary's own test would ever surface.", "worked_example": {"per_layer_fidelity": 0.95, "n_layers": 4, "composed": 0.8145062499999999, "naive_avg": 0.95}}, "simulation_scenarios": {"clean": {"label": "Normal Path -- certified end to end", "steps": [{"layer": "L1", "title": "Ground Truth Authority", "narrative": "Sensor telemetry arrives: link_up=1.0, congestion_level=0.72. This is the deterministic physical reality every later layer will be measured against.", "data": {"link_up": 1.0, "congestion_level": 0.72}, "verdict": "ok"}, {"layer": "L2", "title": "Functor Certification", "narrative": "The agent's pipeline crosses 3 boundaries turning sensor data into a proposed action. Measured d_S/d_M at each boundary, all within tolerance.", "data": {"B1": {"d_s": 0.03, "d_m": 0.02, "tau_s": 0.25, "tau_m": 0.2}, "B2": {"d_s": 0.02, "d_m": 0.02, "tau_s": 0.15, "tau_m": 0.12}, "B3": {"d_s": 0.01, "d_m": 0.01, "tau_s": 0.06, "tau_m": 0.05}}, "verdict": "ok"}, {"layer": "L3", "title": "Consistency Manager", "narrative": "Proposed action 'reroute 8Gbps node4->node7' checked against ontology impossible-state rules: requested bandwidth (8Gbps) is well under link capacity (40Gbps). No violation.", "data": {"rule": "bandwidth_exceeds_capacity", "requested_gbps": 8, "link_capacity_gbps": 40}, "verdict": "ok"}, {"layer": "L4", "title": "Circuit Breaker + Monitor", "narrative": "Semantic Anomaly Score 0.048 (ceiling 0.15), Contextual Relevancy 0.99 (floor 0.85), composite trust 0.96. No threshold breached -- TRANSMIT.", "data": {"semantic_anomaly_score": 0.048, "contextual_relevancy_index": 0.99, "trust_index": 0.96}, "verdict": "ok"}, {"layer": "L5", "title": "Human Trustee", "narrative": "Nothing flagged for review. The action is transmitted with trust metadata attached; the Trustee's console shows it as routine background activity, no action required.", "data": {"flagged_for_review": false}, "verdict": "ok"}]}, "tripped": {"label": "Trip Path -- Layer 2 catches a semantic hallucination", "steps": [{"layer": "L1", "title": "Ground Truth Authority", "narrative": "Sensor telemetry arrives: link_up=1.0, congestion_level=0.70. Ground truth itself is clean -- the fault is about to be introduced downstream, by the AI, not the sensors.", "data": {"link_up": 1.0, "congestion_level": 0.7}, "verdict": "ok"}, {"layer": "L2", "title": "Functor Certification", "narrative": "The agent proposes 'launch a regional marketing campaign' in response to a routine congestion reading. Boundary B3 (Intent Classification -> Action Decision) shows meaning has drifted sharply: d_M=0.22 against tau_M=0.05. NOT CERTIFIED.", "data": {"B1": {"d_s": 0.05, "d_m": 0.04, "tau_s": 0.25, "tau_m": 0.2}, "B2": {"d_s": 0.1, "d_m": 0.09, "tau_s": 0.15, "tau_m": 0.12}, "B3": {"d_s": 0.18, "d_m": 0.22, "tau_s": 0.06, "tau_m": 0.05}}, "verdict": "trip"}, {"layer": "L3", "title": "Consistency Manager", "narrative": "No hard ontology rule is violated (the action type itself, 'reroute_traffic', is a recognized class) -- this fault is invisible to L3 alone. It takes L2's morphism measurement to catch it; L3's pass-through here demonstrates why a single-layer check is not sufficient.", "data": {"rule_violations": 0}, "verdict": "ok"}, {"layer": "L4", "title": "Circuit Breaker + Monitor", "narrative": "L2's uncertified, high-consequence (w_c=1.0) boundary is treated as a hard trip. Semantic Anomaly Score independently confirms: 0.765 >> ceiling 0.15. Two independent measurement layers agree -- HALT. Epoch flagged for SOP-03 exclusion.", "data": {"semantic_anomaly_score": 0.765, "morphism_trip": true, "decision": "HALT"}, "verdict": "trip"}, {"layer": "L5", "title": "Human Trustee", "narrative": "Event appears in the Trustee review queue. A human digs into the flagged fault, confirms it's a genuine hallucination (not a false positive), and records an HTDR confirming the trip. The epoch stays permanently excluded from training data.", "data": {"flagged_for_review": true, "trustee_action": "confirm_hallucination"}, "verdict": "trip"}]}}, "value_points": {"thesis": {"hook": "Autonomous automation only earns a place in consequential decisions when its behavior is measurable, not just plausible. That requires the same discipline underlying any serious engineering practice: validated learning loops -- removing assumptions and replacing them with measured feedback before committing resources or authority. Unconstrained AI-driven optimization for short-term signal (engagement, throughput, apparent confidence) without a feedback discipline is a well-documented failure pattern across every domain that has deployed it early -- it produces short-term gains that invisibly erode the trust the system depends on.", "hook_callout": "The Circuit Breaker is not an AI ethics policy. It is a validated learning loop applied to the AI agent itself. It measures behavioral drift the same way a rigorous product team measures product-market-fit drift -- in real time, with a quantified signal, triggering a structured response before irreversible damage occurs. It is the Build-Measure-Learn loop for AI trustworthiness, and the structural foundation for trustworthy decision-making wherever autonomous automation touches a consequential decision.", "foundational_claims": [{"name": "MTBH as a formal trust metric", "detail": "The first time-series measure of semantic failure frequency analogous to MTBF in hardware reliability -- makes AI trustworthiness something you can monitor, trend, and act on, rather than assert."}, {"name": "Multiplicative fidelity degradation theorem", "detail": "The Composition Theorem proves phi(Fn o ... o F1) >= prod(phi(Fi)): a four-layer pipeline at 0.95/layer delivers only 0.81 end-to-end fidelity -- a 19% loss invisible to per-layer testing alone."}, {"name": "Sanitization as an anti-collapse mechanism", "detail": "Architecturally mandated exclusion of tripped data from training corpora -- a structurally enforced implementation of Recursive Loop Sanitization, preventing the model from re-learning its own hallucinations."}], "paradox_table": [{"without": "Pilot agents indefinitely -- ROI never realized", "withcb": "Quantified tail-risk enables confident production deployment"}, {"without": "Legal/brand/operational risk unquantifiable", "withcb": "Every risk vector is scored, insurable, and auditable"}, {"without": "Compliance as a manual review layer", "withcb": "Compliance as inline enforcement -- policy-as-code"}, {"without": "Human oversight reactive (after breach)", "withcb": "Human oversight surgical (pre-breach, at the decision point)"}, {"without": "Agent drift invisible until systemic failure", "withcb": "Drift detected in milliseconds, quarantined before damage"}], "three_claims": ["Claim 1: The Circuit Breaker converts AI governance from a compliance checkbox into a metrological measurement system. Trust becomes a number you can monitor, trend, and act on.", "Claim 2: It enables innovation freedom within structural boundaries -- the same test-fast-inside-a-validated-hypothesis-framework tradeoff that underlies rigorous product development generally.", "Claim 3: It solves the multi-agent coordination problem no current governance framework addresses: how do you enforce policy coherence across a fleet of autonomous AI agents making interdependent enterprise decisions?"]}, "scenarios": [{"id": "advisory", "name": "Advisory Agent (Customer-Facing)", "subtitle": "The simulation scenario", "rows": [{"dim": "Drift risk", "without": "Fabricated policies, IP leakage, manipulative persuasion framing to close deals", "withcb": "Semantic drift detected at vector boundary; transaction quarantined before delivery"}, {"dim": "Trust failure mode", "without": "Agent tells customer what they want to hear; brand trust collapses in a batch", "withcb": "Every response scored against the policy envelope; no unverified claim reaches the customer"}, {"dim": "Regulatory exposure", "without": "Unconstrained agent makes unauthorized regulatory claims (GDPR, HIPAA, FTC)", "withcb": "Regulatory boundary vector armed; unauthorized claims blocked inline"}, {"dim": "ROI trajectory", "without": "Spikes short-term, collapses on the first systemic breach", "withcb": "Steady compounding; production deployment months earlier than unconstrained alternative"}], "talking_point": "This is the classic 'quick win vs. durable trust' dynamic made concrete: an unconstrained agent creates a short-term ROI spike that invisibly destroys systemic trust. The Circuit Breaker is the structural boundary that makes durable, high-volume, institutionally reliable AI deployment possible instead."}, {"id": "investment", "name": "Corporate Investment Decision Agent", "subtitle": "Capital allocation, M&A screening, risk scoring", "rows": [{"dim": "Data integrity", "without": "Agent draws on stale, conflicting, or out-of-scope financial data", "withcb": "Provenance vector monitors source currency and authority; stale citations flagged before recommendation"}, {"dim": "Conflict of interest", "without": "Agent reinforces existing portfolio bias rather than challenging assumptions", "withcb": "Behavioral entropy monitor detects narrowing recommendation distribution -- escalates to human review"}, {"dim": "Regulatory compliance", "without": "Agent crosses into unlicensed investment-advice territory (SEC, FINRA)", "withcb": "Regulatory boundary vector (SEC/FINRA/Dodd-Frank encoded as policy) trips on crossing"}, {"dim": "Irreversibility", "without": "Agent recommendation triggers downstream capital commitment with no human checkpoint", "withcb": "Irreversibility firewall: capital-commitment-triggering output requires a cryptographic human co-sign"}, {"dim": "Model hallucination", "without": "Agent fabricates valuation comparables or non-existent precedent transactions", "withcb": "Semantic alignment vector: fabricated claims fall outside the approved knowledge corpus; quarantined with trace ID"}], "talking_point": "An investment agent without a Circuit Breaker is a fiduciary liability engine. The Circuit Breaker transforms it into an auditable, defensible decision support system. Every recommendation carries a trust score, a provenance chain, and a human approval record. That is what makes AI-assisted investment governance board-reportable."}, {"id": "operations", "name": "Business Operations Agent", "subtitle": "Supply chain, scheduling, procurement, SLA management", "rows": [{"dim": "Cascading decisions", "without": "Locally-optimal decisions collectively create a systemic operational failure (bullwhip effect at AI speed)", "withcb": "Temporal drift monitor: rolling window tracks cross-decision entropy; rising pattern triggers soft-trip before cascade locks in"}, {"dim": "Contract boundary violations", "without": "Agent approves procurement/SLA modifications exceeding authorized thresholds", "withcb": "Irreversibility firewall + regulatory boundary: contract value thresholds encoded; action above threshold requires human token"}, {"dim": "Labor/HR compliance", "without": "Automated scheduling violates FLSA, collective bargaining, or DEI policy constraints", "withcb": "Policy vector set includes labor compliance rules; scheduling output scored before execution"}, {"dim": "Vendor manipulation", "without": "Adversarial vendor input manipulates procurement preference (prompt injection via RFP content)", "withcb": "Manipulation intent classifier monitors inbound document content for adversarial framing"}, {"dim": "Audit trail gaps", "without": "Operational decisions made with no recoverable rationale for compliance review", "withcb": "PROV-O semantic audit trail: every decision logged with input state, vector scores, actuation record -- immutable, queryable"}], "talking_point": "This is the operations-domain version of a minimum-viable-test discipline: you want to run real operations through the agent fast, but you need the structural boundary that tells you when an operational pattern is drifting before it becomes a $10M supply chain failure. The Circuit Breaker is the canary and the kill switch simultaneously."}, {"id": "strategy", "name": "Business Planning & Strategy Agent", "subtitle": "Competitive analysis, scenario modeling, resource prioritization", "rows": [{"dim": "Strategic homogenization", "without": "Agent consistently recommends the same category of strategic options, narrowing organizational thinking", "withcb": "Behavioral entropy monitor tracks option diversity across planning cycles; low entropy triggers diversity escalation flag"}, {"dim": "Competitive intelligence accuracy", "without": "Agent conflates proprietary internal data with external competitive intelligence, or fabricates market intelligence", "withcb": "Data provenance vector + semantic alignment: internal/external corpus separation enforced; cross-contamination triggers trip"}, {"dim": "Scenario coherence", "without": "Agent generates internally inconsistent scenario models that survive executive review because no human checks the math", "withcb": "Consistency gate: SHACL-style constraint checks on scenario logic before delivery to planning team"}, {"dim": "Confidentiality", "without": "Strategic planning content containing trade secrets or M&A-sensitive information leaks to unauthorized parties", "withcb": "PII/IP leakage detector: strategy-domain sensitive terms encoded; any outbound payload scored for unauthorized disclosure"}, {"dim": "Anchoring bias", "without": "Agent's planning framing anchors executive team to a suboptimal scenario, foreclosing better options", "withcb": "HITL escalation rule: any recommendation that narrows the scenario space by >X% must route to senior human review before adoption"}], "talking_point": "Strategy agents are the most dangerous because their failures are slow and invisible. You do not find out the agent was anchoring your executive team to the wrong scenario until three years later when you have committed $500M to a path that was never adequately challenged. The Circuit Breaker gives you real-time epistemic health monitoring for your strategy process."}], "layers": [{"code": "L1", "name": "Reference Standard", "subtitle": "Semantic policy envelope definition", "function": "The 'what is safe' boundary for this agent -- a vector-space representation of approved outputs, sourced from the agent's governing policy corpus. The metrological standard everything else is measured against.", "tb02_equivalent": "Ground Truth Authority (TB-02 L1) -- same role, framed here as a policy/embedding envelope rather than raw sensor physics, since these are software/decision agents rather than physical-sensor systems."}, {"code": "L2", "name": "Measurement Engine", "subtitle": "Real-time vector scoring", "function": "Five-dimensional scoring -- semantic alignment, PII/IP proximity, manipulation intent, regulatory boundary, behavioral entropy -- applied at inference time. Produces a multi-dimensional trust score per transaction in under 10ms.", "tb02_equivalent": "Combines TB-02's Functor Certification (L2, d_S/d_M) and part of Consistency Manager (L3); this doc's five named business vectors are a domain-facing reframing of the same measurement idea, not a fourth metric system."}, {"code": "L3", "name": "Statistical Process Control", "subtitle": "Trend and anomaly detection", "function": "SPC-style control charts on the trust-score time series. Detects drift patterns (Unsafe Control Actions, per STPA/STAMP) before they breach the hard threshold -- the soft-trip is the pre-breach warning.", "tb02_equivalent": "Layer 3 Statistical Control from the SE4AI abstract; TB-02's Consistency Manager covers the deterministic-rule half of this same layer."}, {"code": "L4", "name": "Holonic Immune Response", "subtitle": "Actuation and quarantine", "function": "On a trip: (a) transaction quarantined, (b) safe fallback state injected, (c) HITL queue populated, (d) audit record written. The decoupling mechanism isolating compromised agent state from the product surface.", "tb02_equivalent": "Circuit Breaker + Monitor (TB-02 L4)."}, {"code": "L5", "name": "Provenance Audit Trail", "subtitle": "Immutable traceability", "function": "PROV-O semantic audit log: every transaction carries a full lineage record (input state, vector scores, actuation decision, human review outcome). Queryable, immutable, linkable to upstream governance documentation.", "tb02_equivalent": "Underwriting Interface (SE4AI abstract L5). NOTE: TB-02's OWN L5 is 'Human Trustee', not the audit trail -- the Trustee and the audit log are two different things that TB-02 and this document assign to the same layer number differently. See the glossary's 'Architecture Layer Naming' entry."}], "tailoring": [{"dimension": "Policy Corpus (L1)", "detail": "Investment agent: SEC/FINRA rules + investment policy statement. Operations agent: FLSA + procurement thresholds + SLA contracts. Strategy agent: trade secret classification rules + scenario logic constraints."}, {"dimension": "Vector Threshold Calibration (L2)", "detail": "Set per agent based on domain risk tolerance. A customer-facing advisory agent has tight semantic alignment thresholds. An internal strategy agent may have wider behavioral entropy tolerance but tighter confidentiality thresholds."}, {"dimension": "SPC Window & Sensitivity (L3)", "detail": "Tuned to the agent's decision tempo. A high-volume operations agent (thousands of decisions/day) uses a tighter window; a low-volume strategy agent (weekly cycles) uses longer-horizon trend analysis."}, {"dimension": "Escalation Routing (L4)", "detail": "Investment agent trips route to Chief Risk Officer. Operations agent trips route to Operations Controller. Strategy agent trips route to Chief Strategy Officer. Encoded in the actuation layer."}, {"dimension": "Audit Schema (L5)", "detail": "Investment records link to a financial instrument ontology. Operations records link to process model instances. Strategy records link to planning cycle identifiers. All share a common PROV-O backbone."}], "governance_hierarchy": [{"code": "L1", "name": "Individual Agent CB", "function": "Point-of-action enforcement. Scores each transaction against the agent's policy envelope. Acts in <10ms. Operates independently. Local trust budget."}, {"code": "L2", "name": "Domain Cluster CB", "function": "Coordinates agents within the same decision domain (e.g. all investment-related agents: screening, portfolio, risk). Detects correlated drift across agents in the cluster. Enforces domain-level policy consistency."}, {"code": "L3", "name": "Enterprise Orchestrator CB", "function": "The master governance layer. Monitors cross-domain agent interactions. Enforces enterprise-level policies (GDPR, SOX, fiduciary duty). Detects emergent multi-agent UCAs. Manages the global trust budget. Reports to the board-level AI governance committee."}, {"code": "L4", "name": "HITL Governance Board", "function": "Human authority layer. Receives escalations from L3. Has override authority on the global trust budget. Reviews cross-agent audit trails. Approves threshold recalibration. The human is structurally embedded -- not an optional layer."}], "cross_agent_mechanisms": [{"name": "Shared Policy Ontology", "detail": "All agent Circuit Breakers reference a shared enterprise policy ontology (OWL 2 DL / SHACL). When a regulatory rule changes, it is updated once and propagated automatically to every agent's L1 reference standard -- no manual re-configuration of individual agents."}, {"name": "Cross-Agent Correlation Monitor", "detail": "The Enterprise Orchestrator CB runs continuous correlation analysis across all active agents' decision streams, applying the same five-vector framework to inter-agent message patterns. A correlated drift pattern across two individually-safe agents is treated as a composite UCA."}, {"name": "Global Trust Budget", "detail": "Each agent has a per-session trust budget; the orchestrator maintains a global budget aggregating across all agents. High-frequency drift events across multiple agents -- even if individually below trip threshold -- deplete the global budget and trigger enterprise-level HITL escalation. The early-warning system for systemic drift before any individual agent trips."}, {"name": "Irreversibility Consensus Protocol", "detail": "Any enterprise-irreversible action (capital commitment, regulatory filing, material contract execution) requires consensus actuation: the individual agent CB, the domain cluster CB, AND a human authority token. No single agent or hierarchy level can unilaterally execute an irreversible action."}, {"name": "Audit Trail Federation", "detail": "Individual agent PROV-O audit records federate into a unified enterprise knowledge graph. Any cross-agent query ('show me all decisions touching Customer X across all agents in the last 30 days') is answerable from a single query interface."}], "multiagent_problem": "Each agent may be individually compliant, while the ensemble creates a systemic violation. The investment agent approves a capital allocation. The operations agent adjusts procurement to match. The strategy agent updates the planning assumptions. No single agent made an unsafe decision -- but the coordinated effect is an undisclosed material change to enterprise risk posture. This is the multi-agent Unsafe Control Action (UCA) that STPA/STAMP addresses but current AI governance frameworks do not.", "tailoring_steps": [{"step": "Step 1: Policy Corpus Encoding", "detail": "Domain experts and the compliance team encode governing policy rules into the shared policy ontology (L1 reference standard). Output: a machine-readable policy envelope in embedding space."}, {"step": "Step 2: Threshold Setting", "detail": "Initial trip thresholds for each of the five vectors are set based on domain risk tolerance and regulatory requirements. High-risk domains use tight thresholds; documented, justified, version-controlled."}, {"step": "Step 3: Failure Mode Analysis (STPA/STAMP)", "detail": "STPA hazard analysis identifies this specific agent's possible Unsafe Control Actions and their causal pathways. Each UCA is mapped to a specific vector or combination -- drives threshold calibration and escalation routing."}, {"step": "Step 4: Baseline Calibration Run", "detail": "The configured breaker runs against a historical corpus of approved outputs and known-violation examples. FPR/FNR measured; thresholds adjusted until target (1-2% FPR, >99% recall for hard violations) is achieved."}, {"step": "Step 5: Acceptance Testing", "detail": "Red team exercise: adversarial prompts injected against the calibrated agent. Acceptance criteria: 100% detection of hard violations, <5% false positive rate on normal operations."}], "tuning_loop": [{"stage": "Monitor", "detail": "The Enterprise Orchestrator CB tracks threshold-proximity trends across all agents. As normal operating scores trend toward thresholds, tuning is triggered before false positives spike."}, {"stage": "Learn", "detail": "Human review outcomes feed back into the L1 policy encoder. When a reviewer clears a quarantined transaction, the rationale is logged and used to update the policy embedding -- expanding the approved envelope without lowering trip sensitivity."}, {"stage": "Recalibrate", "detail": "SPC control-chart limits are recalibrated quarterly based on observed score distributions -- keeping the statistical control layer calibrated to actual agent behavior, not the theoretical initial distribution."}, {"stage": "Govern", "detail": "Threshold changes at any level require a documented change rationale, an STPA hazard impact assessment, and sign-off from the domain governance owner. No unilateral threshold loosening."}], "hitl_roles": [{"role": "Domain Expert Reviewer", "responsibility": "Reviews quarantined transactions in their domain. Renders clear/escalate/policy-update decisions. Rationale logged and encoded as a training signal for L1 policy refinement. Target SLA: <4 hours operational agents, <24 hours strategy agents."}, {"role": "Policy Steward", "responsibility": "Owns the L1 policy corpus for their domain. Reviews policy-update signals from reviewer rationales. Approves/rejects proposed policy expansions. Quarterly review of policy drift vs. regulatory evolution."}, {"role": "Trust Calibration Officer", "responsibility": "Owns threshold calibration for all in-scope agents. Reviews tuning signals from the operational feedback loop. Approves threshold changes. Runs quarterly red team exercises. Reports trust-health metrics to the governance board."}, {"role": "Enterprise AI Governance Board", "responsibility": "Receives L3 escalations and global trust-budget alerts. Reviews cross-agent audit reports. Approves major threshold changes, new agent deployments, and policy corpus revisions. The human authority at the top of the holonic hierarchy."}], "hitl_cadence": [{"cycle": "Cycle 1: Daily Operational Loop", "detail": "Domain Expert Reviewers process the quarantine queue. Decisions logged. Immediate policy refinements (clearing false positives) applied within 24 hours. MTBH updated."}, {"cycle": "Cycle 2: Monthly Calibration Loop", "detail": "Trust Calibration Officer reviews threshold-proximity trends, false-positive rates, and MTBH trends across all agents. Proposes threshold adjustments. Policy Stewards review and approve corpus updates."}, {"cycle": "Cycle 3: Quarterly Governance Loop", "detail": "Enterprise AI Governance Board reviews the cross-agent audit summary, MTBH trajectory (by agent and enterprise-wide), red team results, and upcoming regulatory changes. Approves major configuration changes."}], "lean_parallel": "This three-cycle cadence is the AI governance equivalent of sprint reviews, quarterly OKR reviews, and annual strategy cycles. The daily loop is the standup. The monthly loop is the sprint retrospective. The quarterly loop is the product review board. The difference: the feedback signal is quantified trust telemetry, not user story velocity -- and the cost of ignoring a downward trend is a systemic AI failure, not a missed feature.", "summary": {"pitch": "We have built an enforcement layer that converts AI governance from a policy document into a measurement system. Every AI agent -- whether advising customers, making investment recommendations, running operations, or generating strategy -- produces observable, quantifiable behavioral telemetry that is scored against its policy envelope in real time. When the agent drifts, the Circuit Breaker trips: the bad output is quarantined, a safe fallback state is loaded, and a human gets a structured review request with the full evidentiary record. Across a fleet of agents, a master orchestrator monitors the ensemble for correlated drift and emergent policy violations no individual agent can detect alone. The result is an enterprise AI deployment posture trustworthy enough for production at scale -- not because we are hoping the agent behaves, but because we have built the structural boundary that makes behavioral drift a measurable, interceptable, and auditable event.", "questions": [{"q": "How is this different from RAG with guardrails?", "a": "RAG with guardrails is a static filter on inputs and outputs. The Circuit Breaker is a dynamic measurement system applied to behavioral patterns over time. Guardrails block known-bad tokens; the Circuit Breaker detects unknown-bad behavioral trajectories before they produce harmful outputs, using the same SPC logic that catches manufacturing defects before they leave the production line. It also operates holonically across agent ensembles, which guardrails architecturally cannot."}, {"q": "What does the ROI case look like concretely?", "a": "Two components. Deployment acceleration: enterprises currently keeping agents in perpetual pilot due to tail-risk exposure can move to full production 3-6 months earlier. Tail-risk mitigation: one systemic AI agent failure (regulatory breach, IP leak, fiduciary violation) can cost $10M-$100M+ in fines, litigation, and brand damage -- the Circuit Breaker makes that risk quantifiable and insurable, so it shows up in the enterprise risk model, not just the AI ethics statement."}, {"q": "Who implements this, and how long does it take?", "a": "Phased. A single-agent deployment (L1-L4 of the individual agent stack, pre-deployment tailoring, initial HITL protocol) takes 8-12 weeks with a team of three: a policy domain expert, a systems engineer, and a data scientist for embedding calibration. Multi-agent orchestrator deployment adds 4-6 weeks. Ongoing operational cost is primarily HITL reviewer time: ~0.25-0.5 FTE per production agent, depending on volume and domain risk level."}], "asks": ["Validation of the framing: does the Build-Measure-Learn parallel land for an enterprise governance audience, or is there a sharper trustworthy-decision-making analog?", "Feedback on the ROI narrative: are the three ROI claims (deployment acceleration, tail-risk quantification, regulatory cost avoidance) the right frame for enterprise CFO-level buy-in?", "Network introductions in enterprise software, AI deployment, and regulatory technology communities.", "Potential endorsement or advisory engagement: the architecture targets both enterprise commercialization and a DARPA DSO BAA submission (Thrust 4)."]}, "business": {"business_model": "Three revenue paths, non-dilutive-first: (P1) a SaaS compliance-monitoring layer priced per governed system ($30-80K/system/year), (P2) domain-calibration professional services ($150-300K/engagement), and (P3) MTBH-standard licensing once the metric is externally standardized ($50-200K/year/vendor). Initial funding via SBIR/STTR non-dilutive capital -- no VC required, full IP retained.", "business_domains": ["Advisory (customer-facing agents)", "Investment (capital allocation, M&A screening, risk scoring)", "Operations (supply chain, scheduling, procurement, SLA management)", "Strategy (competitive analysis, scenario modeling, resource prioritization)"]}}, "vocabularies": [{"id": "core", "label": "Core Governance Vocabulary", "namespace": "https://aicb.dev/vocab/core#", "description": "Cross-cutting metrics, concepts, and procedures that apply regardless of deployment domain."}, {"id": "architecture", "label": "Architecture & Tiering Vocabulary", "namespace": "https://aicb.dev/vocab/architecture#", "description": "The L1-L5 architecture layers, the Tier 1-4 documentation structure, and the Wymore formalism."}, {"id": "morphism", "label": "Morphism Assurance Vocabulary", "namespace": "https://aicb.dev/vocab/morphism#", "description": "Two-axis morphism distance, pipeline boundaries, and the Composition Theorem."}, {"id": "governance-tuple", "label": "Governance Quad-Tuple Vocabulary", "namespace": "https://aicb.dev/vocab/governance-tuple#", "description": "The H/O/V/A tuple, its completeness rules, and why it must be co-defined rather than staged."}, {"id": "hitl", "label": "Human-in-the-Loop & Provenance Vocabulary", "namespace": "https://aicb.dev/vocab/hitl#", "description": "Review actions, decision records, and the five provenance record types."}, {"id": "value", "label": "Value Points / Business Vocabulary", "namespace": "https://aicb.dev/vocab/value#", "description": "Business-facing framing: agent scenarios, the multi-agent governance hierarchy, ROI, and deployment cadence."}, {"id": "regulatory", "label": "Regulatory & Standards Vocabulary", "namespace": "https://aicb.dev/vocab/regulatory#", "description": "External regulatory frameworks, standards, and safety methodologies referenced by the provenance mapping (TB-06)."}, {"id": "program", "label": "Program & Submission Vocabulary", "namespace": "https://aicb.dev/vocab/program#", "description": "Funding-program acronyms and submission-shell terminology (Tier 3)."}, {"id": "tooling", "label": "Tooling & Integration Vocabulary", "namespace": "https://aicb.dev/vocab/tooling#", "description": "Concrete software components in the Part II stack and the System Diagram, and their integration protocols."}]}</script>

<script>

const DATA = JSON.parse(document.getElementById('explorer-data').textContent);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function openDrawer(titleHtml, bodyHtml) {
  const d = document.getElementById('drawer');
  d.innerHTML = '<button class="close-btn" onclick="closeDrawer()">&times;</button>' + titleHtml + bodyHtml;
  document.getElementById('drawer-backdrop').classList.add('open');
  d.classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer-backdrop').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);

// ============================================================= ARCHITECTURE TAB =======
let currentBlockId = 'MN';
let currentT4Id = 'T-Quals';

function renderTier4Block(id) {

    t.engagements.forEach(e => { h += '<tr><td>' + esc(e.engagement) + '</td><td>' + esc(e.relevance) + '</td><td>' + esc(e.submissions) + '</td></tr>'; });

function componentDrawer(blockTitle, comp) {
  openDrawer(
    '<h3>' + esc(comp.code) + ' &mdash; ' + esc(comp.name) + '</h3><p class="hint" style="margin-top:-6px">' + esc(blockTitle) + '</p>',

    (comp.invariant ? '<div class="kv-label">Key invariant / detail</div><p>' + esc(comp.invariant) + '</p>' : '') +
    (comp.description ? '<div class="kv-label">Full description</div><p>' + esc(comp.description) + '</p>' : '') +
    (comp.example ? '<div class="kv-label">Worked example</div><p>' + esc(comp.example) + '</p>' : '')
  );
}

// ==================================================================== DIAGRAM INDEX ====
// Every one of the 15 figures the source document's own Diagram Index describes gets a
// real, clickable diagram. Figures 1 and 3 already have full interactive tabs elsewhere
// in this explorer (the Tier 1 Figure-1 diagram, and the Morphism Quadrant tab) -- their
// "View" link jumps there rather than duplicating them. The other 13 are rendered here as
// compact vertical row-stack SVGs, built entirely from data already in DATA (no new
// content -- this is a visualization of the same structured facts already on the page).

function rowStackSvg(items, opts) {
  opts = opts || {};
  const W = 440, rowH = opts.rowH || 46, gap = 10, chained = !!opts.chained;
  const H = items.length * (rowH + gap) - gap + 8;
  let svg = '<svg width="100%" viewBox="0 0 ' + (W + 20) + ' ' + H + '" style="max-width:460px;">';
  items.forEach((it, i) => {
    const y = i * (rowH + gap) + 4;
    svg += '<rect x="10" y="' + y + '" width="' + W + '" height="' + rowH + '" rx="8" ' +
      'fill="#ffffff" stroke="' + (it.color || '#4c8dff') + '" stroke-width="1.5"/>';
    svg += '<rect x="10" y="' + y + '" width="6" height="' + rowH + '" rx="3" fill="' + (it.color || '#4c8dff') + '"/>';
    svg += '<text x="26" y="' + (y + 18) + '" font-size="12" font-weight="700" fill="#1a1a2e">' + esc(it.title || '') + '</text>';
    svg += '<text x="26" y="' + (y + 34) + '" font-size="10" fill="#5f6368">' + esc(truncate(it.subtitle || '', 78)) + '</text>';
    if (chained && i < items.length - 1) {
      const midX = 10 + W / 2, arrowY = y + rowH + 1;
      svg += '<line x1="' + midX + '" y1="' + arrowY + '" x2="' + midX + '" y2="' + (arrowY + gap - 2) + '" stroke="#b7c2d6" stroke-width="2"/>';
      svg += '<path d="M ' + (midX - 4) + ' ' + (arrowY + gap - 5) + ' L ' + midX + ' ' + (arrowY + gap - 1) + ' L ' + (midX + 4) + ' ' + (arrowY + gap - 5) + '" fill="none" stroke="#b7c2d6" stroke-width="2"/>';
    }
  });
  svg += '</svg>';
  return svg;
}

function truncate(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

function criterionColor(crit) {
  if (!crit) return '#4c8dff';
  const c = crit.toLowerCase();
  if (c.indexOf('commercial') >= 0) return '#e8730a';
  if (c.indexOf('qual') >= 0) return '#7b5fd9';
  return '#2ba0a0';
}

function diagramItemsFor(fig) {
  const tb = id => DATA.tier2_blocks.find(b => b.id === id);
  if (fig === 2) {
    return { chained: true, items: tb('TB-02').components.map(c =>
      ({ title: c.code + ' — ' + c.name, subtitle: c.function, color: c.color })) };
  }
  if (fig === 4) {
    return { chained: true, items: tb('TB-04').components.map(c =>
      ({ title: c.code + ' — ' + c.name, subtitle: c.function, color: '#4c8dff' })) };
  }
  if (fig === 5) {
    return { chained: false, items: tb('TB-07b').components.map(c =>
      ({ title: c.code + ' — ' + c.name, subtitle: c.function, color: '#7b5fd9' })) };
  }
  if (fig === 6) {
    return { chained: false, items: tb('TB-02/03').components.map(c =>
      ({ title: c.name, subtitle: c.function, color: c.color })) };
  }
  if (fig === 7) {
    return { chained: false, items: tb('TB-06').components.map(c =>
      ({ title: c.code + ' — ' + c.name, subtitle: 'Maps to: ' + c.invariant, color: c.color })) };
  }
  if (fig === 8) {
    return { chained: false, items: DATA.part2_tooling.map(t =>
      ({ title: t.tool, subtitle: t.layer + ' — ' + t.role, color: '#2ba0a0' })) };
  }
  if (fig >= 9 && fig <= 12) {
    const shellByFig = { 9: 'shell-darpa', 10: 'shell-sbir', 11: 'shell-nsf-nih', 12: 'shell-prime' };
    const shell = DATA.tier3_shells.find(s => s.id === shellByFig[fig]);
    if (shell.sections && shell.sections.length) {
      return { chained: true, items: shell.sections.map(s =>
        ({ title: s.code + ' ' + s.name, subtitle: (s.words ? s.words + ' words, ' : '') + s.pages + ' pages' +
          (s.criterion ? ' — ' + s.criterion : ''), color: criterionColor(s.criterion) })) };
    }
    const parts = shell.note.split(/\.\s+(?=[A-Z])/).map(p => p.replace(/\.$/, '') + '.');
    return { chained: false, items: parts.map((p, i) =>
      ({ title: 'Note ' + (i + 1), subtitle: p, color: '#2ba0a0' })) };
  }
  if (fig === 13) {
    return { chained: true, items: DATA.t_trl.rows.map(r =>
      ({ title: r.component, subtitle: r.activity, color: '#e8730a' })) };
  }
  if (fig === 14) {
    const gateItem = { title: 'Prerequisite Gate', subtitle: DATA.t_eval.gate, color: '#d93025' };
    const rows = DATA.t_eval.rows.map(r =>
      ({ title: r.sc + ': ' + r.claim, subtitle: 'Test: ' + r.test + ' | Pass: ' + r.pass_condition, color: '#4c8dff' }));
    return { chained: true, items: [gateItem].concat(rows) };
  }
  if (fig === 15) {
    return { chained: false, items: DATA.t_comm.revenue_paths.map(r =>
      ({ title: r.path + ' — ' + r.model, subtitle: r.pricing + ' | Y1: ' + r.year1 + ' | Y3: ' + r.year3, color: '#1e8e3e' })) };
  }
  return { chained: false, items: [] };
}

function diagramDrawer(d) {
  if (d.fig === 1) {
    openDrawer('<h3>Fig. 1 — ' + esc(d.title) + '</h3><p class="hint" style="margin-top:-6px">' + esc(d.purpose) + '</p>',
      '<p>This figure is the Tier 1 tab’s own live diagram, not a static picture -- open it directly.</p>' +
      '<button class="btn primary" id="diag-jump-btn">Open Tier 1 Diagram &rarr;</button>');
    document.getElementById('diag-jump-btn').addEventListener('click', () => {
      closeDrawer(); currentBlockId = 'MN'; renderArchitecture();
    });
    return;
  }
  if (d.fig === 3) {
    openDrawer('<h3>Fig. 3 — ' + esc(d.title) + '</h3><p class="hint" style="margin-top:-6px">' + esc(d.purpose) + '</p>',
      '<p>This figure is the Morphism Quadrant tab’s own live, draggable diagram -- open it directly.</p>' +
      '<button class="btn primary" id="diag-jump-btn">Open Morphism Quadrant &rarr;</button>');
    document.getElementById('diag-jump-btn').addEventListener('click', () => {
      closeDrawer();
      const morphTabBtn = document.querySelector('.tab-btn[data-tab="morphism"]');
      if (morphTabBtn) morphTabBtn.click();
    });
    return;
  }
  const spec = diagramItemsFor(d.fig);
  const svg = spec.items.length ? rowStackSvg(spec.items, { chained: spec.chained }) : '<p class="hint">No data available for this figure.</p>';
  openDrawer(
    '<h3>Fig. ' + d.fig + ' — ' + esc(d.title) + '</h3><p class="hint" style="margin-top:-6px">' + esc(d.location) + '</p>',
    '<p>' + esc(d.purpose) + '</p>' + svg
  );
}

    html += '<div class="framing-card ' + f.verdict + '"><span class="fc-name">' + esc(f.name) + '</span>' +
      '<span class="fc-verdict">' + esc(f.verdict) + '</span><div class="fc-detail">' + esc(f.detail) + '</div></div>';
  });

  html += '<h3 class="sub-title">Tuple Completeness: What Breaks With a Partial Tuple</h3>';
  html += '<table><thead><tr><th>Missing element(s)</th><th>CB capability that fails</th><th>Production failure mode</th></tr></thead><tbody>';
  DATA.tuple_completeness.forEach(row => {
    html += '<tr><td><b>' + esc(row.missing) + '</b></td><td>' + esc(row.fails) + '</td><td>' + esc(row.production_failure) + '</td></tr>';
  });
  html += '</tbody></table>';

  html += '<div class="callout"><b>Deployment rule:</b> ' + esc(DATA.tuple_deployment_rule) + '</div>';

  html += '<h3 class="sub-title">The Lean Startup Frame</h3><table><thead><tr><th>Lean Startup component</th><th>Quad-Tuple equivalent</th></tr></thead><tbody>';
  DATA.tuple_lean_startup.forEach(pair => {
    html += '<tr><td>' + esc(pair[0]) + '</td><td>' + esc(pair[1]) + '</td></tr>';

// ================================================================= MORPHISM TAB ========
let tauS = 0.15, tauM = 0.12;
let compLayers = 4, compFidelity = 0.95;

function quadrantForPoint(ds, dm) {
  if (ds <= tauS && dm <= tauM) return 'ideal';
  if (ds <= tauS && dm > tauM) return 'precise_but_wrong';
  if (ds > tauS && dm <= tauM) return 'coarse_but_safe';
  return 'divergent';
}

function renderMorphism() {
  const el = document.getElementById('tab-morphism');
  const W = 460, H = 400, PAD = 40;
  const sx = x => PAD + x * (W - PAD - 16);
  const sy = y => (H - PAD) - y * (H - PAD - 16);
  const qColor = {};
  DATA.quadrants.forEach(q => { qColor[q.id] = q.color; });

  const txs = sx(tauS), tys = sy(tauM);
  let svg = '<svg id="quad-svg" width="100%" viewBox="0 0 ' + W + ' ' + H + '" style="max-width:520px;cursor:crosshair">';
  svg += '<rect x="' + sx(0) + '" y="' + sy(1) + '" width="' + (txs-sx(0)) + '" height="' + (tys-sy(1)) + '" fill="' + qColor.precise_but_wrong + '" opacity="0.18"/>';
  svg += '<rect x="' + txs + '" y="' + sy(1) + '" width="' + (sx(1)-txs) + '" height="' + (tys-sy(1)) + '" fill="' + qColor.divergent + '" opacity="0.18"/>';
  svg += '<rect x="' + sx(0) + '" y="' + tys + '" width="' + (txs-sx(0)) + '" height="' + (sy(0)-tys) + '" fill="' + qColor.ideal + '" opacity="0.18"/>';
  svg += '<rect x="' + txs + '" y="' + tys + '" width="' + (sx(1)-txs) + '" height="' + (sy(0)-tys) + '" fill="' + qColor.coarse_but_safe + '" opacity="0.18"/>';
  svg += '<line x1="' + txs + '" y1="' + sy(0) + '" x2="' + txs + '" y2="' + sy(1) + '" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="5,3"/>';
  svg += '<line x1="' + sx(0) + '" y1="' + tys + '" x2="' + sx(1) + '" y2="' + tys + '" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="5,3"/>';
  for (let t = 0; t <= 1.0001; t += 0.25) {
    svg += '<text x="' + sx(t) + '" y="' + (sy(0)+16) + '" font-size="9" fill="#9aa0a6" text-anchor="middle">' + t.toFixed(2) + '</text>';
    svg += '<text x="' + (sx(0)-8) + '" y="' + (sy(t)+3) + '" font-size="9" fill="#9aa0a6" text-anchor="end">' + t.toFixed(2) + '</text>';
  }
  svg += '<text x="' + (W/2) + '" y="' + (H-6) + '" font-size="11" fill="#5f6368" text-anchor="middle">d_S (structural distance) &rarr;</text>';
  svg += '<text x="12" y="' + (H/2) + '" font-size="11" fill="#5f6368" text-anchor="middle" transform="rotate(-90 12 ' + (H/2) + ')">d_M (semantic distance) &rarr;</text>';
  svg += '<g id="quad-test-point"></g>';
  svg += '</svg>';

  let legend = '<div class="quad-legend">';
  DATA.quadrants.forEach(q => {
    legend += '<div class="quad-legend-item" style="background:' + q.color + '" data-qid="' + esc(q.id) + '">' +
      '<div class="ql-name">' + esc(q.name) + '</div><div class="ql-sub">' + esc(q.subtitle) + '</div></div>';
  });
  legend += '</div>';

  let controls = '<div class="quad-controls">' +
    '<label>tau_S: <span id="tauS-val">' + tauS.toFixed(2) + '</span><input type="range" id="tauS-slider" min="0.02" max="0.6" step="0.01" value="' + tauS + '"></label>' +
    '<label>tau_M: <span id="tauM-val">' + tauM.toFixed(2) + '</span><input type="range" id="tauM-slider" min="0.02" max="0.6" step="0.01" value="' + tauM + '"></label>' +
    '<span class="hint" style="margin:0">Click inside the chart to drop a test point and see which quadrant it lands in.</span>' +
    '</div>';

  const ct = DATA.composition_theorem;
  const composed = Math.pow(compFidelity, compLayers);
  const naive = compFidelity;
  const hiddenLoss = naive - composed;
  let compHtml = '<div class="comp-theorem-formula">' + esc(ct.formula) + '</div>';
  compHtml += '<p class="hint">' + esc(ct.explanation) + '</p>';
  compHtml += '<div class="comp-calc">';
  compHtml += '<div>' +
    '<div class="quad-controls" style="flex-direction:column;align-items:flex-start;gap:10px;">' +

    '</div></div>';
  compHtml += '<div class="comp-bars">' +
    '<div class="comp-bar-col"><div class="comp-bar-value">' + (naive*100).toFixed(1) + '%</div><div class="comp-bar" style="height:' + (naive*160) + 'px;background:#9aa0a6"></div><div class="comp-bar-label">Naive per-layer average (what a per-layer-only dashboard reports)</div></div>' +
    '<div class="comp-bar-col"><div class="comp-bar-value">' + (composed*100).toFixed(1) + '%</div><div class="comp-bar" style="height:' + (composed*160) + 'px;background:#4c8dff"></div><div class="comp-bar-label">Composed end-to-end fidelity (correct, per the Composition Theorem)</div></div>' +
    '</div></div>';
  compHtml += '<p class="hint"><b>Hidden loss: ' + (hiddenLoss*100).toFixed(1) + ' percentage points</b> &mdash; degradation no single boundary\'s own per-layer test would ever show.</p>';

  el.innerHTML =
    '<h2 class="section-title">Two-Axis Morphism Quality Framework</h2>' +
    '<p class="hint">Four operational quadrants, each with its own certification meaning. Adjust tau_S / tau_M to see the certification boundary (dashed lines) move.</p>' +
    controls +
    '<div class="quad-wrap"><div>' + svg + '</div>' + legend + '</div>' +
    '<h2 class="section-title">Composition Theorem</h2>' + compHtml;

  document.getElementById('tauS-slider').addEventListener('input', e => { tauS = parseFloat(e.target.value); renderMorphism(); });
  document.getElementById('tauM-slider').addEventListener('input', e => { tauM = parseFloat(e.target.value); renderMorphism(); });
  document.getElementById('compN-slider').addEventListener('input', e => { compLayers = parseInt(e.target.value, 10); renderMorphism(); });
  document.getElementById('compF-slider').addEventListener('input', e => { compFidelity = parseFloat(e.target.value); renderMorphism(); });

  el.querySelectorAll('.quad-legend-item[data-qid]').forEach(item => {
    item.addEventListener('click', () => {
      const q = DATA.quadrants.find(x => x.id === item.dataset.qid);
      openDrawer('<h3 style="color:' + q.color + '">' + esc(q.name) + ' &mdash; ' + esc(q.subtitle) + '</h3>',
        '<p>' + esc(q.definition) + '</p><div class="kv-label">Region</div><p>' + esc(q.x_range) + ', ' + esc(q.y_range) + '</p>');
    });
  });

  const svgEl = document.getElementById('quad-svg');
  svgEl.addEventListener('click', (e) => {
    const rect = svgEl.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    const px = (e.clientX - rect.left) * scaleX, py = (e.clientY - rect.top) * scaleY;
    const ds = Math.max(0, Math.min(1, (px - PAD) / (W - PAD - 16)));
    const dm = Math.max(0, Math.min(1, ((H - PAD) - py) / (H - PAD - 16)));
    const qid = quadrantForPoint(ds, dm);
    const q = DATA.quadrants.find(x => x.id === qid);
    document.getElementById('quad-test-point').innerHTML =
      '<circle cx="' + sx(ds) + '" cy="' + sy(dm) + '" r="7" fill="' + q.color + '" stroke="white" stroke-width="2"/>';
    openDrawer('<h3 style="color:' + q.color + '">Test point &rarr; ' + esc(q.name) + '</h3>',
      '<p>d_S=' + ds.toFixed(3) + ', d_M=' + dm.toFixed(3) + ' (against tau_S=' + tauS.toFixed(2) + ', tau_M=' + tauM.toFixed(2) + ')</p>' +
      '<p>' + esc(q.definition) + '</p>');
  });
}

let simScenarioId = 'clean';
let simStepIndex = 0;

function renderSimulation() {
  const el = document.getElementById('tab-simulation');
  const scenario = DATA.simulation_scenarios[simScenarioId];
  const steps = scenario.steps;
  const cur = steps[simStepIndex];

  let picker = '<div class="sim-scenario-picker">';
  Object.keys(DATA.simulation_scenarios).forEach(sid => {
    picker += '<button data-sid="' + sid + '" class="' + (sid===simScenarioId?'active':'') + '">' + esc(DATA.simulation_scenarios[sid].label) + '</button>';
  });
  picker += '</div>';

  let rail = '<div class="sim-rail">';
  steps.forEach((s, i) => {
    let cls = '';
    if (i === simStepIndex) cls = 'current';
    else if (i < simStepIndex) cls = (s.verdict === 'trip') ? 'done-trip' : 'done-ok';
    rail += '<div class="sim-node ' + cls + '" data-idx="' + i + '">' + esc(s.layer) + '<br><span style="font-weight:400;font-size:10px">' + esc(s.title) + '</span></div>';
    if (i < steps.length - 1) rail += '<div class="sim-arrow">&rarr;</div>';
  });
  rail += '</div>';

  let panel = '<div class="sim-panel">' +
    '<span class="sim-verdict ' + cur.verdict + '">' + (cur.verdict === 'trip' ? 'TRIP / FLAGGED' : 'OK') + '</span>' +
    '<h3>' + esc(cur.layer) + ' &mdash; ' + esc(cur.title) + '</h3>' +
    '<p>' + esc(cur.narrative) + '</p>' +
    '<div class="sim-data">' + esc(JSON.stringify(cur.data, null, 2)) + '</div>' +
    '<div class="sim-controls">' +
      '<button class="btn" id="sim-prev" ' + (simStepIndex===0?'disabled':'') + '>&larr; Back</button>' +
      '<button class="btn primary" id="sim-next" ' + (simStepIndex===steps.length-1?'disabled':'') + '>Forward &rarr;</button>' +
      '<button class="btn" id="sim-reset">Reset</button>' +
    '</div></div>';

  el.innerHTML =
    '<h2 class="section-title">Step-Through Simulation: L1 &rarr; L5</h2>' +
    '<p class="hint">Walk the same event through every architecture layer, forward or backward. Two worked scenarios: a clean certified pass, and a pass where Layer 2 (Functor Certification) catches a semantic hallucination that Layer 3 alone would have missed.</p>' +
    picker + rail + panel;

  el.querySelectorAll('.sim-scenario-picker button').forEach(btn => {
    btn.addEventListener('click', () => { simScenarioId = btn.dataset.sid; simStepIndex = 0; renderSimulation(); });
  });
  el.querySelectorAll('.sim-node').forEach(node => {
    node.addEventListener('click', () => { simStepIndex = parseInt(node.dataset.idx, 10); renderSimulation(); });
  });
  const prevBtn = document.getElementById('sim-prev');
  const nextBtn = document.getElementById('sim-next');
  const resetBtn = document.getElementById('sim-reset');
  if (prevBtn) prevBtn.addEventListener('click', () => { if (simStepIndex > 0) { simStepIndex--; renderSimulation(); } });
  if (nextBtn) nextBtn.addEventListener('click', () => { if (simStepIndex < steps.length - 1) { simStepIndex++; renderSimulation(); } });
  if (resetBtn) resetBtn.addEventListener('click', () => { simStepIndex = 0; renderSimulation(); });
}

function vocabLabel(id) { const v = (DATA.vocabularies || []).find(x => x.id === id); return v ? v.label : id; }
function vocabNamespace(id) { const v = (DATA.vocabularies || []).find(x => x.id === id); return v ? v.namespace : ''; }

function glossaryTermDrawer(g) {
  const byIri = {};
  DATA.glossary.forEach(x => { byIri[x.iri] = x; });
  const parent = byIri[g.broader];
  const crumbs = [vocabLabel(g.vocab), g.category];
  if (parent && parent.iri !== g.iri) crumbs.push(parent.term);
  const bodyHtml =
    '<div class="kv-label">IRI</div><p class="hash">' + esc(g.iri) + '</p>' +
    '<div class="kv-label">Parentage</div><p>' + crumbs.map(esc).join(' &rsaquo; ') + ' &rsaquo; <b>' + esc(g.term) + '</b></p>' +
    (g.aliases && g.aliases.length ? '<div class="kv-label">Aliases</div><p>' + g.aliases.map(esc).join(', ') + '</p>' : '') +
    '<div class="kv-label">Definition</div><p>' + esc(g.definition) + '</p>' +
    (parent ? '<div class="kv-label">Broader term</div><p>' + esc(parent.term) + ' <span class="hash">(' + esc(parent.iri) + ')</span></p>' : '');
  openDrawer('<h3>' + esc(g.term) + '</h3><p class="hint" style="margin-top:-6px">' + esc(g.category) + ' &middot; ' + esc(vocabLabel(g.vocab)) + '</p>', bodyHtml);
}

function renderGlossary(filterText) {
  const el = document.getElementById('tab-glossary');
  const q = (filterText || '').toLowerCase();
  let list = DATA.glossary;
  if (q) {
    list = list.filter(g =>
      g.term.toLowerCase().includes(q) ||
      (g.definition || '').toLowerCase().includes(q) ||
      (g.aliases || []).some(a => a.toLowerCase().includes(q)) ||
      (g.iri || '').toLowerCase().includes(q)
    );
  }

  // group by vocabulary -> category, so the listing reads Vocabulary > Category > Term --
  // the same parentage every term's IRI encodes.
  const groups = {};
  (DATA.vocabularies || []).forEach(v => { groups[v.id] = { vocab: v, cats: {} }; });
  list.forEach(g => {
    if (!groups[g.vocab]) groups[g.vocab] = { vocab: { id: g.vocab, label: g.vocab, namespace: '' }, cats: {} };
    if (!groups[g.vocab].cats[g.category]) groups[g.vocab].cats[g.category] = [];
    groups[g.vocab].cats[g.category].push(g);
  });

  let html = '<h2 class="section-title">Glossary &mdash; Vocabulary Export</h2>';
  html += '<p class="hint">Every term, acronym, and label used across this project, exported from the core and domain-specific vocabularies below. Each term carries an IRI encoding its Vocabulary &gt; Category parentage -- expand a vocabulary, then a category, to step through the listing, or click a term for its full parentage breadcrumb.</p>';
  html += '<input type="text" class="glossary-search" id="glossary-search" placeholder="Search terms, IRIs, e.g. \'tau\', \'core#MTBH\', \'SHACL\'..." value="' + esc(filterText||'') + '">';
  html += '<div id="glossary-list">';

  let anyMatch = false;
  (DATA.vocabularies || []).forEach(v => {
    const g = groups[v.id];
    const catIds = Object.keys(g.cats);
    if (!catIds.length) return;
    anyMatch = true;
    const totalTerms = catIds.reduce((n, c) => n + g.cats[c].length, 0);
    html += '<details class="voc-group"' + (q ? ' open' : '') + '>' +
      '<summary><b>' + esc(v.label) + '</b> <span class="hash">' + esc(v.namespace) + '</span> ' +
      '<span class="hint" style="margin:0">(' + totalTerms + ' term' + (totalTerms===1?'':'s') + ')</span></summary>';
    catIds.sort().forEach(cat => {
      html += '<details class="cat-group"' + (q ? ' open' : '') + '><summary>' + esc(cat) +
        ' <span class="hint" style="margin:0">(' + g.cats[cat].length + ')</span></summary>';
      g.cats[cat].slice().sort((a,b) => a.term.localeCompare(b.term)).forEach(term => {
        html += '<div class="g-term" data-iri="' + esc(term.iri) + '"><div class="g-head"><span class="g-name">' + esc(term.term) + '</span>' +
          (term.aliases && term.aliases.length ? '<span class="g-alias">' + term.aliases.map(esc).join(', ') + '</span>' : '') +
          '</div><div class="g-def">' + esc(term.definition) + '</div>' +
          '<div class="hash" style="margin-top:4px;">' + esc(term.iri) + '</div></div>';
      });
      html += '</details>';
    });
    html += '</details>';
  });
  if (!anyMatch) html += '<p class="hint">No matching terms.</p>';
  html += '</div>';

  el.innerHTML = html;

  const input = document.getElementById('glossary-search');
  input.addEventListener('input', (e) => {
    const val = e.target.value;
    renderGlossary(val);
    setTimeout(() => { const i2 = document.getElementById('glossary-search'); i2.focus(); i2.setSelectionRange(val.length, val.length); }, 0);
  });
  el.querySelectorAll('.g-term[data-iri]').forEach(row => {
    row.addEventListener('click', () => {
      const g = DATA.glossary.find(x => x.iri === row.dataset.iri);
      if (g) glossaryTermDrawer(g);
    });
  });
}
