<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Model - HR Services v2.0</title>
<script>
(function(){
  var t=null;
  try{ t=localStorage.getItem('hrmap-theme'); }catch(e){}
  if(t!=='light' && t!=='dark'){ t=(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a2332;
  --ink-soft:#3c4657;
  --muted:#5b6577;
  --paper:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#eef1f5;
  --border:#dde1e8;
  --border-soft:#e8ebf0;
  --accent:#2f5d78;
  --accent-soft:#e3edf3;
  --grid-line: rgba(47,93,120,0.09);

  --dom-workforce:#0e7c86;
  --dom-benefits:#3454a6;
  --dom-compliance:#b5482a;
  --dom-talent:#3f7d5c;
  --dom-client:#c17f17;
  --dom-tech:#6b4c93;
  --dom-development:#a3367a;
  --dom-values:#5f7f1a;

  --font-display:"Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body:"Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --shadow-panel: 0 1px 2px rgba(20,30,45,0.06), 0 8px 24px -12px rgba(20,30,45,0.18);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e7ecf3;
    --ink-soft:#c3ccda;
    --muted:#8b95a8;
    --paper:#11151c;
    --surface:#171c25;
    --surface-2:#1e2530;
    --border:#2a3241;
    --border-soft:#242c39;
    --accent:#6ba3c7;
    --accent-soft:rgba(107,163,199,0.14);
    --grid-line: rgba(107,163,199,0.08);

    --dom-workforce:#2bb4bc;
    --dom-benefits:#7292d6;
    --dom-compliance:#e08361;
    --dom-talent:#67b78d;
    --dom-client:#e0a94a;
    --dom-tech:#a68ad4;
    --dom-development:#e07ab8;
    --dom-values:#a4c75a;

    --shadow-panel: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --ink:#e7ecf3;
  --ink-soft:#c3ccda;
  --muted:#8b95a8;
  --paper:#11151c;
  --surface:#171c25;
  --surface-2:#1e2530;
  --border:#2a3241;
  --border-soft:#242c39;
  --accent:#6ba3c7;
  --accent-soft:rgba(107,163,199,0.14);
  --grid-line: rgba(107,163,199,0.08);

  --dom-workforce:#2bb4bc;
  --dom-benefits:#7292d6;
  --dom-compliance:#e08361;
  --dom-talent:#67b78d;
  --dom-client:#e0a94a;
  --dom-tech:#a68ad4;
  --dom-development:#e07ab8;
  --dom-values:#a4c75a;

  --shadow-panel: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  height:100vh;
  width:100vw;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

button{ font-family:inherit; }
::selection{ background:var(--accent-soft); }

/* ---------- Header ---------- */
header{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:0.7rem 1.25rem;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.brand{
  display:flex;
  align-items:center;
  gap:0.65rem;
  min-width:0;
}
.brand-mark{ flex:none; color:var(--accent); }
.brand-text{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
.brand-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.28rem;
  letter-spacing:0.01em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.brand-version{
  font-family:var(--font-mono); font-size:0.72rem; font-weight:600; letter-spacing:0.02em;
  color:var(--accent); background:var(--accent-soft); border-radius:4px;
  padding:0.12rem 0.4rem; margin-left:0.4rem; vertical-align:0.2em;
}
.brand-sub{
  font-size:0.72rem;
  color:var(--muted);
  letter-spacing:0.04em;
  text-transform:uppercase;
  white-space:nowrap;
}
.header-right{ display:flex; align-items:center; gap:1.3rem; flex:none; }
.header-stats{
  display:flex;
  gap:1.4rem;
  flex:none;
}
.theme-toggle{
  display:inline-flex; align-items:center; gap:0.4rem;
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
  border-radius:6px; padding:0.4rem 0.7rem; font-size:0.74rem; font-weight:600;
  cursor:pointer; white-space:nowrap; transition:border-color 0.15s, color 0.15s;
}
.theme-toggle:hover{ border-color:var(--accent); color:var(--ink); }
.theme-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.theme-toggle svg{ width:15px; height:15px; flex:none; }
.stat{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  line-height:1.1;
}
.stat b{
  font-family:var(--font-mono);
  font-size:1rem;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
}
.stat span{
  font-size:0.66rem;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:0.05em;
}

/* ---------- Controls bar ---------- */
.controls-bar{
  flex:none;
  display:flex;
  align-items:center;
  gap:0.9rem;
  padding:0.6rem 1.25rem;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.search-box{
  position:relative;
  width:270px;
  flex:none;
}
.search-box svg{
  position:absolute; left:0.6rem; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--muted); pointer-events:none;
}
.search-box input{
  width:100%;
  padding:0.45rem 0.6rem 0.45rem 2rem;
  border:1px solid var(--border);
  border-radius:5px;
  background:var(--surface-2);
  color:var(--ink);
  font-family:var(--font-mono);
  font-size:0.8rem;
  outline:none;
}
.search-box input:focus{ border-color:var(--accent); background:var(--surface); }
.search-results{
  position:absolute; top:calc(100% + 4px); left:0; right:0;
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  box-shadow:var(--shadow-panel); max-height:260px; overflow-y:auto; z-index:30;
  display:none;
}
.search-results.open{ display:block; }
.search-result-item{
  padding:0.45rem 0.65rem; font-size:0.78rem; cursor:pointer;
  display:flex; align-items:center; gap:0.5rem; border-bottom:1px solid var(--border-soft);
}
.search-result-item:last-child{ border-bottom:none; }
.search-result-item:hover{ background:var(--surface-2); }
.sri-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.sri-type{ font-family:var(--font-mono); font-size:0.62rem; color:var(--muted); text-transform:uppercase; flex:none; }

.field{
  display:flex; flex-direction:column; gap:0.25rem; flex:none;
}
.field label{
  font-size:0.65rem; font-weight:600; color:var(--muted);
  text-transform:uppercase; letter-spacing:0.06em;
}
select{
  padding:0.42rem 1.6rem 0.42rem 0.6rem;
  border:1px solid var(--border);
  border-radius:5px;
  background:var(--surface-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%235b6577" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 0.55rem center;
  color:var(--ink);
  font-size:0.78rem;
  font-family:var(--font-body);
  appearance:none;
  cursor:pointer;
  min-width:172px;
}
select:focus{ outline:none; border-color:var(--accent); }

.view-toggle{
  display:flex; background:var(--surface-2); border:1px solid var(--border);
  border-radius:6px; padding:2px; flex:none; gap:1px;
}
.view-toggle button{
  border:none; background:transparent; padding:0.4rem 0.55rem;
  font-size:0.74rem; font-weight:600; color:var(--muted); border-radius:4px; cursor:pointer;
  white-space:nowrap;
}
.view-toggle button.active{ background:var(--accent); color:#fff; }

.slider-field{
  display:flex; flex-direction:column; gap:0.3rem; width:230px; flex:none;
  transition:opacity 0.15s;
}
.slider-field.disabled{ opacity:0.4; pointer-events:none; }
.slider-labels{
  display:flex; justify-content:space-between; font-size:0.65rem; color:var(--muted);
  text-transform:uppercase; letter-spacing:0.04em;
}
.slider-labels b{ color:var(--ink); font-weight:700; }
input[type=range]{
  width:100%; accent-color:var(--accent); cursor:pointer; height:4px;
}
.tick-row{
  display:flex; justify-content:space-between; font-size:0.58rem; color:var(--muted);
  font-family:var(--font-mono);
}

.spacer{ flex:1; }

.legend-strip{
  display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;
}
.legend-chip{
  display:flex; align-items:center; gap:0.35rem;
  padding:0.28rem 0.55rem 0.28rem 0.4rem;
  border-radius:999px; border:1px solid var(--border);
  background:var(--surface-2);
  font-size:0.7rem; font-weight:600; color:var(--ink-soft);
  cursor:pointer; user-select:none;
  transition:opacity 0.15s, border-color 0.15s;
}
.legend-chip .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.legend-chip.dim{ opacity:0.35; }
.legend-chip:hover{ border-color:var(--accent); }

/* ---------- Workspace ---------- */
.workspace{ flex:1; display:flex; min-height:0; position:relative; }

.canvas-wrap{
  flex:1; position:relative; overflow:hidden;
  background:
    radial-gradient(circle at 50% 46%, var(--grid-line) 0, transparent 62%),
    var(--paper);
}
svg#stage{ width:100%; height:100%; display:block; cursor:grab; }
svg#stage.grabbing{ cursor:grabbing; }

.ring-grid circle{ fill:none; stroke:var(--border-soft); stroke-width:1; }
.ring-grid .tick{ stroke:var(--border-soft); stroke-width:1; }
.ring-grid text{
  font-family:var(--font-mono); font-size:9px; fill:var(--muted); opacity:0.7;
}
.sector-arc{ opacity:0.07; transition:opacity 0.2s; }
.sector-arc.dim{ opacity:0.02; }

.link{
  fill:none; stroke:var(--border); stroke-width:1.1; opacity:0.55;
  transition:stroke 0.2s, opacity 0.2s, stroke-width 0.2s;
}
.link.on-path{ stroke:var(--accent); stroke-width:2; opacity:1; }
.link.dim{ opacity:0.08; }

.link-label{ pointer-events:none; opacity:0.82; transition:opacity 0.2s; }
.link-label rect{
  fill:var(--surface); stroke:var(--border-soft); stroke-width:1;
}
.link-label text{
  font-family:var(--font-mono); font-size:7.5px; fill:var(--muted);
  letter-spacing:0.01em;
}
.link-label.dim{ opacity:0.08; }
.link-label.on-path rect{ stroke:var(--accent); }
.link-label.on-path text{ fill:var(--accent); font-weight:600; }

.node{ cursor:grab; }
.node:active{ cursor:grabbing; }
.node .core{ transition:r 0.15s, stroke-width 0.15s, opacity 0.2s, filter 0.2s; stroke:var(--surface); }
.node.pinned .core{ stroke-dasharray:2.5 2; stroke:var(--ink-soft); }
.node .label{
  font-family:var(--font-body); font-weight:600; fill:var(--ink);
  pointer-events:none; transition:opacity 0.2s;
  paint-order:stroke; stroke:var(--paper); stroke-width:3px; stroke-linejoin:round;
}
.node.dim .core{ opacity:0.14; }
.node.dim .label{ opacity:0; }
.node.on-path .core{ filter:drop-shadow(0 0 5px rgba(0,0,0,0.25)); }
.node.selected .core{ stroke:var(--ink); stroke-width:2.5; }
.node.op-hit .core{ stroke:var(--ink); stroke-width:1.6; filter:drop-shadow(0 0 3px rgba(0,0,0,0.3)); }
.node:hover .core{ stroke-width:2.5; }
.link.op-hit{ stroke-opacity:0.85 !important; stroke-width:1.8; }

.domain-band-label{
  font-family:var(--font-display); font-weight:600; letter-spacing:0.02em;
  pointer-events:none;
}

.hub circle{ fill:var(--surface); stroke:var(--border); stroke-width:1.4; }
.hub text{ font-family:var(--font-display); font-weight:600; fill:var(--ink-soft); font-size:11px; }

.tooltip{
  position:absolute; pointer-events:none; z-index:40;
  background:var(--ink); color:var(--paper);
  padding:0.4rem 0.6rem; border-radius:5px; font-size:0.72rem;
  max-width:240px; line-height:1.35; box-shadow:var(--shadow-panel);
  opacity:0; transform:translate(-50%,-100%); transition:opacity 0.1s;
}
.tooltip.show{ opacity:1; }
.tooltip .tt-type{
  font-family:var(--font-mono); font-size:0.6rem; text-transform:uppercase;
  letter-spacing:0.05em; opacity:0.65; display:block; margin-bottom:0.15rem;
}

.canvas-controls{
  position:absolute; bottom:1.1rem; right:1.1rem; z-index:20;
  display:flex; flex-direction:column; gap:0.25rem;
  background:var(--surface); border:1px solid var(--border); border-radius:7px;
  box-shadow:var(--shadow-panel); padding:0.25rem;
}
.icon-btn{
  border:none; background:transparent; width:30px; height:30px; border-radius:5px;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted);
}
.icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
.icon-btn svg{ width:16px; height:16px; }

.canvas-hint{
  position:absolute; top:1rem; left:1rem; z-index:20;
  font-family:var(--font-mono); font-size:0.68rem; color:var(--muted);
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  padding:0.4rem 0.65rem; opacity:0.85;
}

/* ---------- Shared chips / section titles (Values & Privacy view) ---------- */
.insp-section-title{
  font-size:0.66rem; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:0.06em; margin-bottom:0.6rem;
}
.chip-row{ display:flex; flex-wrap:wrap; gap:0.4rem; }
.chip{
  font-family:var(--font-mono); font-size:0.7rem; padding:0.25rem 0.55rem;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--border);
  color:var(--ink-soft);
}
.op-tag{
  font-family:var(--font-mono); font-size:0.62rem; padding:0.12rem 0.4rem;
  border-radius:3px; background:var(--surface); border:1px solid var(--border); color:var(--muted);
}

/* ---------- Tree view ---------- */
#view-tree{ display:none; position:absolute; inset:0; overflow:auto; padding:1.75rem; }
.tree-shell{
  max-width:880px; margin:0 auto; background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:1.5rem 1.75rem 2rem; box-shadow:var(--shadow-panel);
}
.tree-shell h2{
  font-family:var(--font-display); font-size:1.3rem; font-weight:600; margin-bottom:1.1rem;
}
ul.tnode-list{ list-style:none; margin:0; padding:0; font-size:0.85rem; }
ul.tnode-list ul{ list-style:none; margin:0.2rem 0 0.2rem 1.1rem; padding-left:0.75rem; border-left:1px solid var(--border-soft); }
.tnode{
  display:flex; align-items:center; gap:0.45rem; padding:0.32rem 0.4rem; border-radius:5px; cursor:pointer;
}
.tnode:hover{ background:var(--surface-2); }
.tnode .twisty{ width:12px; height:12px; flex:none; color:var(--muted); transition:transform 0.15s; }
.tnode .twisty.open{ transform:rotate(90deg); }
.tnode .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.tnode .name{ flex:1; }
.tnode .n{ font-family:var(--font-mono); font-size:0.65rem; color:var(--muted); }
.tnode.dim{ opacity:0.32; }
.tnode.selected{ background:var(--accent-soft); }
.tchildren{ display:none; }
.tnode.flash{ box-shadow:0 0 0 2px var(--accent); }

/* ---------- List view side panel: Service Line breakdown ---------- */
.list-panel{
  display:none; width:380px; flex:none; background:var(--surface);
  border-left:1px solid var(--border); flex-direction:column; min-height:0;
}
.list-panel.show{ display:flex; }
.lp-head{ padding:1.05rem 1.2rem 0.9rem; border-bottom:1px solid var(--border); flex:none; }
.lp-kicker{
  font-family:var(--font-mono); font-size:0.62rem; color:var(--muted);
  text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.3rem;
}
.lp-title{ font-family:var(--font-display); font-size:1.22rem; font-weight:600; line-height:1.2; }
.lp-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:0.5rem; margin-top:0.8rem; }
.lp-stat{
  background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
  padding:0.45rem 0.4rem; text-align:center;
}
.lp-stat b{ display:block; font-family:var(--font-mono); font-size:1rem; font-variant-numeric:tabular-nums; }
.lp-stat span{ font-size:0.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
.lp-actions{ display:flex; gap:0.4rem; margin-top:0.75rem; flex-wrap:wrap; }
.lp-btn{
  font-size:0.68rem; font-weight:600; padding:0.25rem 0.55rem; border-radius:4px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft); cursor:pointer;
}
.lp-btn:hover{ border-color:var(--accent); color:var(--ink); }
.lp-body{ flex:1; overflow-y:auto; padding:0.6rem 0.9rem 1.4rem; }
.lp-domain{
  display:flex; align-items:center; gap:0.45rem; margin:0.9rem 0.3rem 0.4rem;
  font-family:var(--font-display); font-size:0.95rem; font-weight:600; color:var(--ink-soft);
}
.lp-domain:first-child{ margin-top:0.3rem; }
.lp-domain .dot, .lp-sl .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
.lp-sl{
  border:1px solid var(--border); border-left:3px solid var(--sl-color, var(--accent));
  border-radius:6px; background:var(--surface-2); margin-bottom:0.5rem;
}
.lp-sl.selected{ box-shadow:0 0 0 1px var(--accent); }
.lp-sl > summary{
  list-style:none; cursor:pointer; padding:0.55rem 0.65rem; display:flex; gap:0.5rem; align-items:flex-start;
}
.lp-sl > summary::-webkit-details-marker{ display:none; }
.lp-sl > summary .twisty{ width:11px; height:11px; flex:none; margin-top:0.2rem; color:var(--muted); transition:transform 0.15s; }
.lp-sl[open] > summary .twisty{ transform:rotate(90deg); }
.lp-sl-text{ flex:1; min-width:0; }
.lp-sl-name{ font-size:0.8rem; font-weight:700; line-height:1.3; }
.lp-sl-count{ font-family:var(--font-mono); font-size:0.62rem; color:var(--muted); margin-top:0.15rem; }
.lp-svc-list{ list-style:none; margin:0; padding:0 0.65rem 0.6rem 1.55rem; display:flex; flex-direction:column; gap:0.45rem; }
.lp-svc-name{
  font-size:0.76rem; font-weight:600; line-height:1.3; cursor:pointer; padding:0.15rem 0.3rem;
  border-radius:4px; display:flex; gap:0.4rem; align-items:baseline;
}
.lp-svc-name:hover{ background:var(--surface); }
.lp-svc-name .n{ margin-left:auto; font-family:var(--font-mono); font-size:0.6rem; color:var(--muted); font-weight:500; flex:none; }
.lp-proc-list{
  list-style:none; margin:0.2rem 0 0 0.35rem; padding:0 0 0 0.6rem;
  border-left:1px solid var(--border); display:flex; flex-direction:column; gap:0.1rem;
}
.lp-proc{
  font-size:0.7rem; color:var(--ink-soft); line-height:1.35; padding:0.15rem 0.3rem;
  border-radius:4px; cursor:pointer;
}
.lp-proc:hover{ background:var(--surface); color:var(--ink); }
.lp-svc-name.selected, .lp-proc.selected{ background:var(--accent-soft); color:var(--ink); }
.lp-proc.dim{ opacity:0.35; }
@media (max-width: 900px){ .list-panel{ width:300px; } }
.tchildren.open{ display:block; }


/* ---------- v2: chips, indicators, Values & Privacy view ---------- */
.chip.nav{ cursor:pointer; display:inline-flex; align-items:center; gap:0.35rem; }
.chip.nav:hover{ border-color:var(--accent); color:var(--ink); }
.chip.nav.on{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
.chip .dot{ width:6px; height:6px; border-radius:50%; flex:none; }
.chip.reg{ font-size:0.64rem; }
.ind-card{ border:1px solid var(--border); border-radius:6px; padding:0.5rem 0.6rem; background:var(--surface-2); }
.ind-name{ font-size:0.8rem; font-weight:600; }
.ind-formula{ font-family:var(--font-mono); font-size:0.66rem; color:var(--muted); margin:0.2rem 0 0.35rem; line-height:1.45; }
.ind-flags{ display:flex; flex-wrap:wrap; gap:0.3rem; margin-top:0.3rem; }
.flag{ font-family:var(--font-mono); font-size:0.62rem; padding:0.12rem 0.4rem; border-radius:3px; border:1px solid var(--border); }
.flag.no{ color:var(--dom-talent); border-color:color-mix(in srgb, var(--dom-talent) 45%, transparent); }
.flag.warn{ color:var(--dom-compliance); border-color:color-mix(in srgb, var(--dom-compliance) 45%, transparent); }

#view-values{ display:none; flex:1; overflow:auto; padding:1.75rem; position:absolute; inset:0; }
.vp-shell{ max-width:1120px; margin:0 auto; display:flex; flex-direction:column; gap:1.25rem; }
.vp-shell section{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.25rem 1.5rem 1.4rem; box-shadow:var(--shadow-panel); }
.vp-shell h2{ font-family:var(--font-display); font-size:1.5rem; font-weight:600; margin:0 0 0.4rem; }
.vp-shell h3{ font-family:var(--font-display); font-size:1.15rem; font-weight:600; margin:0 0 0.8rem; display:flex; align-items:center; gap:0.5rem; }
.vp-shell h3 .count{ font-family:var(--font-mono); font-size:0.7rem; color:var(--muted); font-weight:500; }
.vp-intro p, .vp-sub{ font-size:0.85rem; color:var(--ink-soft); line-height:1.55; margin:0; max-width:72ch; }
.vp-sub{ margin:-0.4rem 0 0.9rem; color:var(--muted); font-size:0.78rem; }
.sl-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:0.75rem; }
.sl-card{ border:1px solid var(--border); border-radius:8px; padding:0.75rem 0.8rem; background:var(--surface-2); display:flex; flex-direction:column; gap:0.45rem; }
.sl-card.on{ border-color:var(--accent); background:var(--accent-soft); }
.sl-head{ display:flex; align-items:center; justify-content:space-between; gap:0.5rem; }
.sl-name{ font-weight:700; font-size:0.9rem; }
.sl-meta{ font-family:var(--font-mono); font-size:0.64rem; color:var(--muted); }
.lens-btn{ font-size:0.66rem; padding:0.2rem 0.5rem; border-radius:4px; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; flex:none; }
.lens-btn:hover{ border-color:var(--accent); color:var(--ink); }
.pr-list{ display:flex; flex-direction:column; gap:0.75rem; }
.pr-card, .sg-card{ border:1px solid var(--border); border-radius:8px; padding:0.85rem 0.95rem; background:var(--surface-2); scroll-margin-top:1rem; transition:box-shadow 0.3s; }
.pr-card.flash, .sg-card.flash{ box-shadow:0 0 0 2px var(--accent); }
.pr-head{ display:flex; align-items:center; gap:0.6rem; margin-bottom:0.25rem; }
.pr-name, .sg-name{ font-family:var(--font-display); font-size:1.1rem; font-weight:600; }
.sg-name{ font-size:1rem; margin-bottom:0.25rem; }
.pr-comment{ font-size:0.78rem; color:var(--ink-soft); line-height:1.5; margin-bottom:0.7rem; }
.pr-cols{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr); gap:1rem; }
.ind-list{ display:flex; flex-direction:column; gap:0.45rem; }
.kind{ font-family:var(--font-mono); font-size:0.6rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; padding:0.14rem 0.45rem; border-radius:4px; }
.kind-value{ background:color-mix(in srgb, var(--dom-values) 16%, transparent); color:var(--dom-values); }
.kind-objective{ background:color-mix(in srgb, var(--dom-client) 16%, transparent); color:var(--dom-client); }
.kind-value-objective{ background:color-mix(in srgb, var(--dom-development) 16%, transparent); color:var(--dom-development); }
.sg-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:0.75rem; }
.sg-card .insp-section-title{ margin:0.6rem 0 0.35rem; }
.ban-list{ margin:0; padding-left:1.1rem; font-size:0.76rem; line-height:1.5; color:var(--ink-soft); }
.ban-list li::marker{ color:var(--dom-compliance); }
.ban-list.big{ columns:2 320px; column-gap:2rem; font-size:0.82rem; }
.ban-list.big li{ margin-bottom:0.35rem; break-inside:avoid; }
@media (max-width: 760px){
  .pr-cols{ grid-template-columns:1fr; }
  #view-values{ padding:1rem; }
  .vp-shell section{ padding:1rem; }
}

/* Scrollbars */
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }
::-webkit-scrollbar-thumb:hover{ background:var(--muted); }

a{ color:var(--accent); }
</style>

<script>
const MODEL = JSON.parse(document.getElementById('model-json').textContent);

const DOMAIN_COLOR_VARS = {};
const DOMAIN_KEYS = ['workforce','benefits','compliance','talent','client','tech','development','values'];
MODEL.tree.forEach((d,i)=>{ DOMAIN_COLOR_VARS[d.id] = 'var(--dom-'+DOMAIN_KEYS[i % DOMAIN_KEYS.length]+')'; });

function domainColor(domainId){ return DOMAIN_COLOR_VARS[domainId] || 'var(--muted)'; }

/* ---------------- Flatten + index ---------------- */
const NODES = {};      // id -> node record
const ROOT_ID = '__root__';

function indexNode(n, parentId, domainId, ancestry){
  const rec = {
    id:n.id, label:n.label, type:n.type,
    parentId, domainId, ancestry: ancestry.slice(),
    childIds: [],
    concepts:n.concepts||null, operations:n.operations||null,
    comment:n.comment||'', promotes:n.promotes||[], safeguards:n.safeguards||[],
    complements:n.complements||[], enforces:n.enforces||[],
    pos:{}, pinned:false
  };
  NODES[n.id] = rec;
  if(n.children){
    n.children.forEach(c=>{
      rec.childIds.push(c.id);
      indexNode(c, n.id, domainId, ancestry.concat([n.id]));
    });
  }
  return rec;
}
MODEL.tree.forEach(d=>indexNode(d, ROOT_ID, d.id, []));

/* Synthetic root node so Domain->SubDomain->Service->Process and the
   root itself share one uniform graph structure across every view. */
NODES[ROOT_ID] = {
  id:ROOT_ID, label:'HR / PEO', type:'root',
  parentId:null, domainId:null, ancestry:[],
  childIds: MODEL.tree.map(d=>d.id),
  concepts:null, operations:null, pos:{}, pinned:false
};

const leafCountCache = {};
function leafCountById(id){
  if(leafCountCache[id]!==undefined) return leafCountCache[id];
  const rec = NODES[id];
  const v = rec.childIds.length ? rec.childIds.reduce((s,cid)=>s+leafCountById(cid),0) : 1;
  leafCountCache[id] = v;
  return v;
}

const OPAREAS = {};
MODEL.operationalAreas.forEach(o=>OPAREAS[o.id]=o);

const OPAREA_TO_PROCESSES = {};   // lens id (operational area OR service line) -> process ids
const SERVICE_LINES = {};
const SVC_TO_LINES = {};
function descendantProcesses(id){
  const r = NODES[id]; if(!r) return [];
  if(r.type==='process') return [id];
  return r.childIds.flatMap(descendantProcesses);
}
Object.values(NODES).forEach(n=>{
  if(n.type==='process' && n.operations){
    n.operations.forEach(o=>{
      (OPAREA_TO_PROCESSES[o.id] = OPAREA_TO_PROCESSES[o.id]||[]).push(n.id);
    });
  }
});

const TYPE_LABELS = {root:'Enterprise Model', domain:'Business Domain', subdomain:'Service Line', service:'Domain Service', process:'Business Process'};

/* ---------------- Shared geometry helpers ---------------- */
const svgns = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const e = document.createElementNS(svgns, tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function polar(r, angleRad){ return { x: r*Math.sin(angleRad), y: -r*Math.cos(angleRad) }; }
function octagon(cx,cy,r){
  const pts=[];
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4 + Math.PI/8;
    pts.push(`${cx+r*Math.sin(a)},${cy-r*Math.cos(a)}`);
  }
  return pts.join(' ');
}
function truncate(s, n){ return s.length>n ? s.slice(0,n-1)+'…' : s; }

const NODE_R = {0:13, 1:15, 2:9.5, 3:5.5, 4:2.6};
const LABEL_SIZE = {0:12, 1:14, 2:10.5, 3:9, 4:8};

let spacingMult = 1; // global "distance between nodes" multiplier, driven by the spacing slider

/* =================================================================
   LAYOUT 1 — Radial orbit (domain wedge dendrogram)
   ================================================================= */
const RING_R_BASE = {0:0, 1:128, 2:245, 3:355, 4:465};
const RING_R = {...RING_R_BASE};
function computeRingR(){
  Object.keys(RING_R_BASE).forEach(k=>{ RING_R[k] = RING_R_BASE[k] * spacingMult; });
}

function layoutRadialSubtree(id, a0, a1, depth){
  const rec = NODES[id];
  rec.radialAngle = (a0+a1)/2;
  rec.radialR = RING_R[depth] !== undefined ? RING_R[depth] : RING_R[4];
  const p = polar(rec.radialR, rec.radialAngle);
  rec.pos.radial = {x:p.x, y:p.y};
  rec.sectorA0 = a0; rec.sectorA1 = a1;
  if(rec.childIds.length){
    const total = leafCountById(id);
    let cursor = a0;
    rec.childIds.forEach(cid=>{
      const span = (a1-a0) * (leafCountById(cid)/total);
      layoutRadialSubtree(cid, cursor, cursor+span, depth+1);
      cursor += span;
    });
  }
}
layoutRadialSubtree(ROOT_ID, 0, 2*Math.PI, 0);

function radialLinkPath(a, b){
  const pa = getPos(NODES[a]), pb = getPos(NODES[b]);
  const ra = Math.hypot(pa.x, pa.y), rb = Math.hypot(pb.x, pb.y);
  const aa = Math.atan2(pa.x, -pa.y), ab = Math.atan2(pb.x, -pb.y);
  const midR = (ra + rb) / 2;
  const m0 = polar(midR, aa), m1 = polar(midR, ab);
  return {
    d: `M ${pa.x} ${pa.y} C ${m0.x} ${m0.y}, ${m1.x} ${m1.y}, ${pb.x} ${pb.y}`,
    mid: bezierPoint(pa, m0, m1, pb, 0.5)
  };
}

/* =================================================================
   LAYOUT 2 — Cluster (left-to-right dendrogram, elbow connectors)
   Every label is shown in full and wraps (at every level) after
   CLUSTER_WRAP characters; columns and rows are sized from the measured
   text so nothing is truncated or overlaps.
   ================================================================= */
const CLUSTER_WRAP = 25;
const CLUSTER_WRAP_TYPES = new Set(['root','domain','subdomain','service','process']);  // every level wraps
const CLUSTER_LINK_SPAN = 120;              // horizontal room for the connector + its relation pill
const CLUSTER_GROUP_PAD = {0:0, 1:20, 2:12, 3:4};
let lastClusterDepth = null;
let clusterBounds = null;

const measureCtx = document.createElement('canvas').getContext('2d');
function textWidth(str, size){
  measureCtx.font = `600 ${size}px "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
  return measureCtx.measureText(str).width;
}
function wrapLabel(str, max){
  const lines = []; let cur = '';
  str.split(/\s+/).filter(Boolean).forEach(word=>{
    while(word.length > max){                     // hard-break a single over-long token
      if(cur){ lines.push(cur); cur=''; }
      lines.push(word.slice(0,max)); word = word.slice(max);
    }
    if(!cur) cur = word;
    else if((cur+' '+word).length <= max) cur += ' '+word;
    else { lines.push(cur); cur = word; }
  });
  if(cur) lines.push(cur);
  return lines;
}
function clusterLineHeight(depth){ return LABEL_SIZE[depth]*1.25; }

function layoutCluster(maxDepth){
  /* 1 — label metrics */
  const colLabelW = {};
  Object.values(NODES).forEach(n=>{
    if(n.depth > maxDepth) return;
    const lines = CLUSTER_WRAP_TYPES.has(n.type) ? wrapLabel(n.label, CLUSTER_WRAP) : [n.label];
    n.clusterLines = lines;
    n.clusterLabelW = Math.max(...lines.map(l=>textWidth(l, LABEL_SIZE[n.depth])));
    n.clusterLabelH = lines.length * clusterLineHeight(n.depth);
    colLabelW[n.depth] = Math.max(colLabelW[n.depth]||0, n.clusterLabelW);
  });

  /* 2 — column x positions sized to the widest label in the previous column */
  const colX = {0:0};
  for(let d=1; d<=maxDepth; d++){
    colX[d] = colX[d-1] + NODE_R[d-1] + 8 + colLabelW[d-1] + 6 + CLUSTER_LINK_SPAN*spacingMult + NODE_R[d] + 2;
  }
  const totalW = colX[maxDepth] + NODE_R[maxDepth] + 8 + (colLabelW[maxDepth]||0);

  /* 3 — row heights: each node reserves room for its own (wrapped) label
         or for its visible children, whichever is taller */
  function blockH(id){
    const n = NODES[id];
    const own = Math.max(n.clusterLabelH, NODE_R[n.depth]*2) + 9*spacingMult;
    if(n.depth >= maxDepth || !n.childIds.length){ n._blockH = own; return own; }
    const kids = n.childIds.reduce((s,c)=>s+blockH(c),0) + (CLUSTER_GROUP_PAD[n.depth]||0)*spacingMult;
    n._blockH = Math.max(own, kids);
    return n._blockH;
  }
  const totalH = blockH(ROOT_ID);

  function place(id, y0){
    const n = NODES[id];
    n.pos.cluster = { x: colX[n.depth] - totalW/2, y: y0 + n._blockH/2 - totalH/2 };
    if(n.depth < maxDepth && n.childIds.length){
      const kidsH = n.childIds.reduce((s,c)=>s+NODES[c]._blockH,0);
      let cursor = y0 + (n._blockH - kidsH)/2;
      n.childIds.forEach(c=>{ place(c, cursor); cursor += NODES[c]._blockH; });
    }
  }
  place(ROOT_ID, 0);
  clusterBounds = { w: totalW, h: totalH };
  lastClusterDepth = maxDepth;
}

/* Connector leaves the parent after the end of its label, bends halfway
   across the gap, and enters the child from the left. */
function elbowLinkPath(a, b){
  const A = NODES[a], B = NODES[b];
  const pa = getPos(A), pb = getPos(B);
  const ex = pb.x - NODE_R[B.depth] - 2;
  let sx = pa.x + NODE_R[A.depth] + 8 + (A.clusterLabelW||0) + 6;
  if(sx > ex - 24) sx = pa.x + NODE_R[A.depth];   // node was dragged out of column order
  const bend = (sx + ex) / 2;
  return {
    d: `M ${sx} ${pa.y} H ${bend} V ${pb.y} H ${ex}`,
    mid: {x:bend, y:(pa.y+pb.y)/2}
  };
}

/* =================================================================
   LAYOUT 4 — Force-directed (custom lightweight physics)
   ================================================================= */
const LINK_TARGET_BASE = {1:115, 2:78, 3:52, 4:34};
let forceRAF = null;

function seedForcePositions(){
  Object.values(NODES).forEach(n=>{
    if(!n.pos.force){
      const rp = n.pos.radial || {x:0,y:0};
      n.pos.force = { x:rp.x + (Math.random()-0.5)*14, y:rp.y + (Math.random()-0.5)*14, vx:0, vy:0 };
    }
  });
}

function forceTick(){
  const nodesArr = collectVisible();
  const visibleSet = new Set(nodesArr.map(n=>n.id));
  const n = nodesArr.length;
  nodesArr.forEach(rec=>{ rec._fx=0; rec._fy=0; });

  for(let i=0;i<n;i++){
    const a = nodesArr[i], pa = a.pos.force;
    for(let j=i+1;j<n;j++){
      const b = nodesArr[j], pb = b.pos.force;
      let dx = pa.x-pb.x, dy = pa.y-pb.y;
      let d2 = dx*dx+dy*dy;
      if(d2 < 1){ dx = (Math.random()-0.5); dy = (Math.random()-0.5); d2 = 1; }
      const d = Math.sqrt(d2);
      const force = Math.min((2400*spacingMult*spacingMult)/d2, 46*spacingMult);
      const fx = (dx/d)*force, fy = (dy/d)*force;
      a._fx += fx; a._fy += fy;
      b._fx -= fx; b._fy -= fy;
    }
  }

  nodesArr.forEach(rec=>{
    if(rec.parentId && visibleSet.has(rec.parentId)){
      const p = NODES[rec.parentId];
      const pa = rec.pos.force, pb = p.pos.force;
      const dx = pb.x-pa.x, dy = pb.y-pa.y;
      const d = Math.sqrt(dx*dx+dy*dy) || 0.01;
      const target = (LINK_TARGET_BASE[rec.depth] || 90) * spacingMult;
      const f = (d-target)*0.058;
      const fx = (dx/d)*f, fy = (dy/d)*f;
      rec._fx += fx; rec._fy += fy;
      p._fx -= fx*0.4; p._fy -= fy*0.4;
    }
  });

  nodesArr.forEach(rec=>{
    if(rec.domainId){
      const anchor = NODES[rec.domainId].pos.radial;
      rec._fx += (anchor.x - rec.pos.force.x)*0.0065;
      rec._fy += (anchor.y - rec.pos.force.y)*0.0065;
    }
    rec._fx += (0-rec.pos.force.x)*0.0018;
    rec._fy += (0-rec.pos.force.y)*0.0018;
  });

  let maxSpeed = 0;
  nodesArr.forEach(rec=>{
    const p = rec.pos.force;
    if(rec.pinned){ p.vx=0; p.vy=0; return; }
    p.vx = (p.vx + rec._fx) * 0.8;
    p.vy = (p.vy + rec._fy) * 0.8;
    p.x += p.vx; p.y += p.vy;
    maxSpeed = Math.max(maxSpeed, Math.abs(p.vx)+Math.abs(p.vy));
  });

  render();

  if(maxSpeed > 0.07){
    forceRAF = requestAnimationFrame(forceTick);
  } else {
    forceRAF = null;
  }
}
function startForce(){
  seedForcePositions();
  if(forceRAF) cancelAnimationFrame(forceRAF);
  forceRAF = requestAnimationFrame(forceTick);
}
function stopForce(){
  if(forceRAF){ cancelAnimationFrame(forceRAF); forceRAF=null; }
}
function reheatForce(){
  if(viewMode!=='force') return;
  seedForcePositions();
  if(!forceRAF) forceRAF = requestAnimationFrame(forceTick);
}
/* Restarts the settle loop WITHOUT reseeding positions — used when the
   target link/repulsion distances change (spacing slider) so the sim
   eases into the new spacing instead of jumping back near its radial seed. */
function wakeForce(){
  if(viewMode!=='force') return;
  if(!forceRAF) forceRAF = requestAnimationFrame(forceTick);
}
function straightLinkPath(a, b){
  const pa = getPos(NODES[a]), pb = getPos(NODES[b]);
  return {
    d: `M ${pa.x} ${pa.y} L ${pb.x} ${pb.y}`,
    mid: {x:(pa.x+pb.x)/2, y:(pa.y+pb.y)/2}
  };
}
function bezierPoint(p0, c0, c1, p1, t){
  const it = 1-t;
  return {
    x: it*it*it*p0.x + 3*it*it*t*c0.x + 3*it*t*t*c1.x + t*t*t*p1.x,
    y: it*it*it*p0.y + 3*it*it*t*c0.y + 3*it*t*t*c1.y + t*t*t*p1.y
  };
}

/* =================================================================
   View-mode plumbing
   ================================================================= */
const LINK_PATH_FN = { radial:radialLinkPath, cluster:elbowLinkPath, force:straightLinkPath };
/* Every visible node gets a label automatically. Radial keeps domain (depth 1)
   off the node itself since the curved sector-rim label already names it. */
const LABEL_DEPTHS = { radial:[0,2,3,4], cluster:[0,1,2,3,4], force:[0,1,2,3,4] };
/* Relation label shown at the midpoint of each edge, keyed by the child's depth. */
const EDGE_LABELS = { 1:'hasDomain', 2:'hasSubDomain', 3:'providesService', 4:'executedByProcess' };
const CANVAS_HINTS = {
  radial: 'drag node to reposition &middot; drag canvas to pan &middot; scroll to zoom',
  cluster: 'drag node to reposition &middot; drag canvas to pan &middot; scroll to zoom',
  force: 'drag node to pin in place (dashed ring) &middot; double-click to release &middot; scroll to zoom'
};

let viewMode = 'radial';
const manualPos = {}; // `${mode}:${id}` -> {x,y}, ignored in force mode (uses pos.force + pinned instead)

function getPos(n){
  if(viewMode==='force') return n.pos.force || {x:0,y:0};
  const key = viewMode+':'+n.id;
  if(manualPos[key]) return manualPos[key];
  return n.pos[viewMode] || {x:0,y:0};
}
function setManualPos(n, x, y){ manualPos[viewMode+':'+n.id] = {x,y}; }

function resetLayout(){
  Object.keys(manualPos).forEach(k=>{ if(k.startsWith(viewMode+':')) delete manualPos[k]; });
  if(viewMode==='force'){
    Object.values(NODES).forEach(n=>{ n.pinned=false; n.pos.force=null; });
    startForce();
  } else {
    render();
  }
}

/* ---------------- Rendering ---------------- */
let currentDetail = 3;
let selectedId = null;
let opAreaFilter = '';
let dimmedDomains = new Set();

const ringGridG = document.getElementById('ring-grid');
const sectorLayerG = document.getElementById('sector-layer');
const linkLayerG = document.getElementById('link-layer');
const nodeLayerG = document.getElementById('node-layer');
const hubLayerG = document.getElementById('hub-layer');

function buildRingGrid(){

  [1,2,3,4].forEach(depth=>{ el('circle', {cx:0, cy:0, r:RING_R[depth]}, ringGridG); });
  for(let deg=0; deg<360; deg+=15){

    const p1 = polar(RING_R[4]+16, rad);
    el('line', {class:'tick', x1:p0.x, y1:p0.y, x2:p1.x, y2:p1.y, opacity:0.35}, ringGridG);
  }
}
buildRingGrid();

function buildHub(){
  hubLayerG.innerHTML = '';
  el('circle', {cx:0, cy:0, r:34}, hubLayerG);
  const t = el('text', {x:0, y:4, 'text-anchor':'middle'}, hubLayerG);
  t.textContent = 'HR / PEO';
}
buildHub();

function buildSectors(){
  sectorLayerG.innerHTML = '';
  MODEL.tree.forEach(d=>{
    const rec = NODES[d.id];
    const rOuter = RING_R[4] + 30;
    const rInner = RING_R[1] - 40;
    const a0 = rec.sectorA0, a1 = rec.sectorA1;
    const p0o = polar(rOuter, a0), p1o = polar(rOuter, a1);
    const p0i = polar(rInner, a0), p1i = polar(rInner, a1);
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const dpath = `M ${p0i.x} ${p0i.y} L ${p0o.x} ${p0o.y} A ${rOuter} ${rOuter} 0 ${large} 1 ${p1o.x} ${p1o.y} L ${p1i.x} ${p1i.y} A ${rInner} ${rInner} 0 ${large} 0 ${p0i.x} ${p0i.y} Z`;
    el('path', {d:dpath, fill:domainColor(d.id), class:'sector-arc', 'data-domain':d.id}, sectorLayerG);

    const labelR = rOuter + 2;
    const midA = (a0+a1)/2;
    const lp = polar(labelR, midA);
    let rot = (midA*180/Math.PI);
    let anchor = 'start';
    if(rot > 90 && rot < 270){ rot += 180; anchor='end'; }
    const txt = el('text', {
      x:lp.x, y:lp.y, class:'domain-band-label', fill:domainColor(d.id),
      'font-size':13, 'text-anchor':anchor,
      transform:`rotate(${rot} ${lp.x} ${lp.y})`
    }, sectorLayerG);
    txt.textContent = rec.label.replace(' Domain','');
  });
}
buildSectors();

function collectVisible(){
  const maxDepth = currentDetail;
  return Object.values(NODES).filter(n=>depthOf(n)<=maxDepth);
}
function depthOf(n){
  if(n.id===ROOT_ID) return 0;
  return n.ancestry.length; // domain=1(0 ancestors+1? ) -- computed below via explicit map instead
}
/* Precompute a stable integer depth per node (root=0..process=4) once,
   independent of which layout is active. */
(function assignDepths(){
  function walk(id, d){ NODES[id].depth = d; NODES[id].childIds.forEach(c=>walk(c, d+1)); }
  walk(ROOT_ID, 0);
})();
depthOf = (n)=>n.depth;

function pathToRoot(id){
  const set = new Set();
  let cur = NODES[id];
  while(cur){ set.add(cur.id); cur = cur.parentId ? NODES[cur.parentId] : null; }
  return set;
}

function isDescendantOfAnyProcess(n, procSet){
  if(n.type==='process') return procSet.has(n.id);
  return anyDescendantProcessMatches(n.id, procSet);
}
function anyDescendantProcessMatches(id, procSet){
  const rec = NODES[id];
  if(rec.type==='process') return procSet.has(id);
  for(const cid of rec.childIds){ if(anyDescendantProcessMatches(cid, procSet)) return true; }
  return false;
}

function syncLayoutDepth(){
  if(viewMode==='cluster' && lastClusterDepth!==currentDetail) layoutCluster(currentDetail);
}

function render(){
  if(viewMode==='list' || viewMode==='values') return; // list view renders via renderTree()

  syncLayoutDepth();

  const visible = collectVisible();
  const visibleIds = new Set(visible.map(n=>n.id));
  const linkFn = LINK_PATH_FN[viewMode];
  const labelDepths = LABEL_DEPTHS[viewMode];

  let onPathSet = null;
  if(selectedId && NODES[selectedId]){ onPathSet = pathToRoot(selectedId); }

  let opFilterProcessSet = null;
  if(opAreaFilter){ opFilterProcessSet = new Set(OPAREA_TO_PROCESSES[opAreaFilter]||[]); }

  sectorLayerG.querySelectorAll('.sector-arc').forEach(p=>{
    p.classList.toggle('dim', dimmedDomains.has(p.getAttribute('data-domain')));
  });

  /* links */
  linkLayerG.innerHTML = '';
  visible.forEach(n=>{
    if(!n.parentId || !visibleIds.has(n.parentId)) return;
    const parent = NODES[n.parentId];
    const geom = linkFn(parent.id, n.id);
    const isOnPath = onPathSet && onPathSet.has(n.id) && onPathSet.has(parent.id);
    let dim = dimmedDomains.has(n.domainId);
    let opHit = false;
    if(opFilterProcessSet){
      opHit = isDescendantOfAnyProcess(n, opFilterProcessSet);
      dim = dim || !opHit;
    }
    el('path', {
      d:geom.d, class:'link'+(isOnPath?' on-path':'')+(dim?' dim':'')+(opHit&&!dim?' op-hit':''),
      stroke: isOnPath ? null : domainColor(n.domainId || parent.domainId),
      'stroke-opacity': isOnPath ? null : 0.4
    }, linkLayerG);

    const relLabel = EDGE_LABELS[n.depth];
    if(relLabel){
      const w = relLabel.length*5.1 + 9;
      const lg = el('g', {
        class:'link-label'+(isOnPath?' on-path':'')+(dim?' dim':''),
        transform:`translate(${geom.mid.x},${geom.mid.y})`
      }, linkLayerG);
      el('rect', {x:-w/2, y:-7.5, width:w, height:14, rx:3}, lg);
      const lt = el('text', {x:0, y:3.5, 'text-anchor':'middle'}, lg);
      lt.textContent = relLabel;
    }
  });

  /* nodes */
  nodeLayerG.innerHTML = '';
  visible.forEach(n=>{
    if(viewMode==='radial' && n.depth===0) return; // hub-layer already represents root

    const r = NODE_R[n.depth];
    const p = getPos(n);
    const isOnPath = onPathSet && onPathSet.has(n.id);
    let dim = dimmedDomains.has(n.domainId);
    let opHit = false;
    if(opFilterProcessSet){
      opHit = isDescendantOfAnyProcess(n, opFilterProcessSet);
      dim = dim || !opHit;
    }
    const isPinned = viewMode==='force' && n.pinned;
    const g = el('g', {
      class:'node'+(isOnPath?' on-path':'')+(n.id===selectedId?' selected':'')+(dim?' dim':'')+(opHit&&!dim&&n.type==='process'?' op-hit':'')+(isPinned?' pinned':''),
      transform:`translate(${p.x},${p.y})`,
      'data-id':n.id
    }, nodeLayerG);
    g.addEventListener('mousedown', (e)=>{ e.stopPropagation(); startNodeDrag(e, n); });
    g.addEventListener('dblclick', (e)=>{
      e.stopPropagation();
      if(viewMode==='force' && n.pinned){ n.pinned=false; reheatForce(); }
    });
    g.addEventListener('mouseenter', (e)=>showTooltip(e, n));
    g.addEventListener('mousemove', (e)=>moveTooltip(e));
    g.addEventListener('mouseleave', hideTooltip);

    const fill = n.type==='root' ? 'var(--accent)' : domainColor(n.domainId);
    if(n.type==='domain'){
      el('polygon', {points:octagon(0,0,r), class:'core', fill, 'stroke-width':2.5}, g);
    } else {
      el('circle', {r, class:'core', fill}, g);
    }

    if(labelDepths.includes(n.depth)){
      if(viewMode==='cluster'){
        /* full text, pre-wrapped at CLUSTER_WRAP chars for every level */
        const lines = n.clusterLines || [n.label];
        const lh = clusterLineHeight(n.depth);
        const lx = r + 8;
        const y0 = LABEL_SIZE[n.depth]*0.35 - (lines.length-1)*lh/2;
        const t = el('text', {x:lx, y:y0, class:'label', 'text-anchor':'start', 'font-size':LABEL_SIZE[n.depth]}, g);
        lines.forEach((ln,i)=>{ const ts = el('tspan', {x:lx, y:y0 + i*lh}, t); ts.textContent = ln; });
      } else {
        let lx=0, ly=r+13, anchor='middle';
        if(viewMode==='radial'){
          const gap = r + 15;
          const s = Math.sin(n.radialAngle);
          anchor = s > 0.22 ? 'start' : (s < -0.22 ? 'end' : 'middle');
          const padded = gap + (anchor==='middle' ? 3 : 0);
          lx = padded*Math.sin(n.radialAngle); ly = -padded*Math.cos(n.radialAngle)+4;
        }
        const t = el('text', {x:lx, y:ly, class:'label', 'text-anchor':anchor, 'font-size':LABEL_SIZE[n.depth]}, g);
        t.textContent = truncate(n.label, 22);
      }
    }
  });

  renderLegend();
  renderStats();
}

/* ---------------- Node drag (reposition) ---------------- */
let nodeDragState = null;
function startNodeDrag(e, n){
  if(viewMode==='list') return;
  const wrap = document.getElementById('canvas-wrap').getBoundingClientRect();
  nodeDragState = { id:n.id, moved:false, startClientX:e.clientX, startClientY:e.clientY };

  function toWorld(clientX, clientY){
    return { x:(clientX-wrap.left-vw/2-tx)/scale, y:(clientY-wrap.top-vh/2-ty)/scale };
  }
  function onMove(ev){
    if(!nodeDragState) return;
    const dx = ev.clientX-nodeDragState.startClientX, dy = ev.clientY-nodeDragState.startClientY;
    if(!nodeDragState.moved && Math.hypot(dx,dy) > 3) nodeDragState.moved = true;
    if(!nodeDragState.moved) return;
    const w = toWorld(ev.clientX, ev.clientY);
    if(viewMode==='force'){
      n.pinned = true;
      n.pos.force = { x:w.x, y:w.y, vx:0, vy:0 };
      reheatForce();
    } else {
      setManualPos(n, w.x, w.y);
      render();
    }
  }
  function onUp(){
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    if(nodeDragState && !nodeDragState.moved) selectNode(n.id);
    nodeDragState = null;
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

function octagonOrCircleRadius(n){ return NODE_R[n.depth]; }

/* ---------------- Service line lens index ---------------- */
MODEL.serviceLines.forEach(sl=>{
  SERVICE_LINES[sl.id] = sl;
  const roots = sl.subdomains.map(x=>x.id).concat(sl.services.map(x=>x.id));
  OPAREA_TO_PROCESSES[sl.id] = [...new Set(roots.flatMap(descendantProcesses))];
  roots.forEach(r=>{
    const r0 = NODES[r];
    const svcs = r0.type==='service' ? [r] : r0.childIds;
    svcs.forEach(sv=>{ (SVC_TO_LINES[sv] = SVC_TO_LINES[sv]||new Set()).add(sl.id); });
  });
});
const INDICATORS = {}; MODEL.indicators.forEach(i=>INDICATORS[i.id]=i);
const PRINCIPLES = {}; MODEL.principles.forEach(p=>PRINCIPLES[p.id]=p);
const SVC_TO_INDICATORS = {};
MODEL.indicators.forEach(i=>i.collectedBy.forEach(c=>{ (SVC_TO_INDICATORS[c.id]=SVC_TO_INDICATORS[c.id]||[]).push(i); }));
function principleKindLabel(p){ return p.kinds.length>1 ? 'Value + Objective' : (p.kinds[0]==='value' ? 'Value' : 'Objective'); }
function lensLabel(id){ return (SERVICE_LINES[id]||OPAREAS[id]||{label:id}).label; }

/* ---------------- Pan / zoom ---------------- */
const stage = document.getElementById('stage');
const viewport = document.getElementById('viewport');
let vw=0, vh=0, tx=0, ty=0, scale=1;
let dragging=false, dragStart=null;

function fitStage(){
  const rect = document.getElementById('canvas-wrap').getBoundingClientRect();
  vw = rect.width; vh = rect.height;
  stage.setAttribute('viewBox', `${-vw/2} ${-vh/2} ${vw} ${vh}`);
}
function applyTransform(){
  viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}
function resetView(){
  tx = 0; ty = 0;
  syncLayoutDepth();
  if(viewMode==='radial'){
    scale = Math.min(1, 640/(RING_R[currentDetail]+80));
  } else if(viewMode==='cluster' && clusterBounds){
    const fitW = (vw-80)/clusterBounds.w, fitH = (vh-80)/clusterBounds.h;
    scale = Math.min(fitW, fitH, 1.15);
    if(scale < 0.55){                      // too small to read: fit width, start at the top
      scale = Math.max(0.15, Math.min(fitW, 1));
      ty = -vh/2 + 40 + (clusterBounds.h/2)*scale;
    }
  } else {
    const vis = collectVisible();
    let maxAbsX = 60, maxAbsY = 60;
    vis.forEach(n=>{ const p=getPos(n); maxAbsX=Math.max(maxAbsX,Math.abs(p.x)); maxAbsY=Math.max(maxAbsY,Math.abs(p.y)); });
    const fitScale = Math.min((vw/2-70)/maxAbsX, (vh/2-70)/maxAbsY, 1.15);
    scale = (isFinite(fitScale) && fitScale>0) ? fitScale : 1;
  }
  applyTransform();
}

stage.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.12 : 0.89);
}, {passive:false});

function zoomBy(factor){
  scale = Math.max(0.15, Math.min(4, scale*factor));
  applyTransform();
}

stage.addEventListener('mousedown', (e)=>{
  dragging = true; dragStart = {x:e.clientX, y:e.clientY, tx, ty};
  stage.classList.add('grabbing');
});
window.addEventListener('mousemove', (e)=>{
  if(!dragging) return;
  tx = dragStart.tx + (e.clientX - dragStart.x);
  ty = dragStart.ty + (e.clientY - dragStart.y);
  applyTransform();
});
window.addEventListener('mouseup', ()=>{ dragging=false; stage.classList.remove('grabbing'); });
stage.addEventListener('click', ()=>{ selectNode(null); });
window.addEventListener('resize', ()=>{ fitStage(); });

function renderStats(){
  const box = document.getElementById('header-stats');
  if(box.dataset.built) return;
  box.dataset.built = '1';
  const s = MODEL.stats;
  const entries = [['serviceLines','Core svc lines'],['domains','Domains'],['subdomains','Service Lines'],['services','Services'],['processes','Processes'],['operationalAreas','Op. Areas'],['principles','Values & obj.']];
  box.innerHTML = entries.map(([k,label])=>`<div class="stat"><b>${s[k]}</b><span>${label}</span></div>`).join('');
}

/* ---------------- Operational area filter ---------------- */
const opSelect = document.getElementById('oparea-filter');
(function buildLensOptions(){
  const g1 = document.createElement('optgroup'); g1.label = 'Core service line';
  MODEL.serviceLines.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.id; opt.textContent = o.label.replace(/ \(.*\)$/,'');
    g1.appendChild(opt);
  });
  const g2 = document.createElement('optgroup'); g2.label = 'Operational area';
  MODEL.operationalAreas.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.id; opt.textContent = o.label;
    g2.appendChild(opt);
  });
  opSelect.appendChild(g1); opSelect.appendChild(g2);
})();
opSelect.addEventListener('change', ()=>{
  opAreaFilter = opSelect.value;
  if(viewMode==='list') renderTree(); else if(viewMode==='values') renderValuesView(); else render();
});

/* ---------------- Selection ---------------- */
function selectNode(id){
  selectedId = id;
  if(viewMode==='list') renderTree(); else render();
}

/* Jump from anywhere (search, Values & Privacy chips) to a node on the map. */
let lastMapView = 'radial';
function focusNode(id){
  if(!NODES[id]) return;
  if(viewMode==='values') setView(lastMapView);
  const targetDepth = NODES[id].depth;
  if(viewMode!=='list' && targetDepth > currentDetail){
    currentDetail = targetDepth;
    detailSlider.value = targetDepth;
    detailLabelEl.textContent = DETAIL_LABELS[targetDepth];
    if(viewMode==='cluster') resetView();
    if(viewMode==='force') reheatForce();
  }
  selectNode(id);
  if(viewMode==='list') revealInTree(id); else panToNode(id);
}

function toggleOpAreaLens(id){
  opAreaFilter = (opAreaFilter===id) ? '' : id;
  opSelect.value = opAreaFilter;
  if(viewMode==='list') renderTree(); else if(viewMode==='values') renderValuesView(); else render();
}

/* ---------------- Detail slider ---------------- */
const detailSlider = document.getElementById('detail-slider');
const detailLabelEl = document.getElementById('detail-label');
const detailFieldEl = detailSlider.closest('.slider-field');
const DETAIL_LABELS = {1:'Domains',2:'Service Lines',3:'Services',4:'Processes'};
detailSlider.addEventListener('input', ()=>{
  currentDetail = parseInt(detailSlider.value,10);
  detailLabelEl.textContent = DETAIL_LABELS[currentDetail];
  render();
  if(viewMode==='force') reheatForce();
});

/* ---------------- Node spacing ---------------- */
const spacingSlider = document.getElementById('spacing-slider');
const spacingLabelEl = document.getElementById('spacing-label');
const spacingFieldEl = spacingSlider.closest('.slider-field');
spacingSlider.addEventListener('input', ()=>{
  spacingMult = parseFloat(spacingSlider.value);
  spacingLabelEl.textContent = spacingMult.toFixed(1) + '×';
  applySpacing();
});
function applySpacing(){
  computeRingR();
  buildRingGrid();
  buildSectors();
  layoutRadialSubtree(ROOT_ID, 0, 2*Math.PI, 0);
  lastClusterDepth = null;
  if(viewMode==='list' || viewMode==='values') return;
  // Deliberately do NOT call resetView() here: fitting the new (larger or
  // smaller) layout back to the viewport would rescale it right back to
  // the same on-screen size, cancelling out the whole point of the slider.
  // Keep the current pan/zoom so the added distance is actually visible;
  // the user can hit "reset view" to re-fit if they want.
  if(viewMode==='force') wakeForce();
  render();
}

/* ---------------- View switch ---------------- */
function setView(mode){
  viewMode = mode;
  if(mode==='radial' || mode==='cluster' || mode==='force') lastMapView = mode;
  document.querySelectorAll('#view-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  const isPanel = mode==='list' || mode==='values';
  document.getElementById('view-map').style.display = isPanel ? 'none' : 'block';
  document.getElementById('view-tree').style.display = mode==='list' ? 'block' : 'none';
  document.getElementById('view-values').style.display = mode==='values' ? 'block' : 'none';
  document.getElementById('list-panel').classList.toggle('show', mode==='list');
  detailFieldEl.classList.toggle('disabled', isPanel);
  spacingFieldEl.classList.toggle('disabled', isPanel);

  ringGridG.style.display = mode==='radial' ? '' : 'none';
  sectorLayerG.style.display = mode==='radial' ? '' : 'none';
  hubLayerG.style.display = mode==='radial' ? '' : 'none';

  document.getElementById('canvas-hint').innerHTML =
    '<svg width="11" height="11" style="vertical-align:-1px; margin-right:3px;"><use href="#ic-cursor"/></svg>' + (CANVAS_HINTS[mode]||'');

  if(mode==='force'){
    startForce();
  } else {
    stopForce();
  }

  fitStage();
  if(mode==='list'){
    renderTree();
  } else if(mode==='values'){
    renderValuesView();
  } else {
    resetView();
    render();
  }
}

const treeOpen = new Set();   // ids of expanded rows in the List view
function renderTree(){
  const target = document.getElementById('tree-target');
  target.innerHTML = `<ul class="tnode-list">${MODEL.tree.map(d=>treeNodeHTML(d)).join('')}</ul>`;
  renderListPanel();
}
function treeNodeHTML(n){
  const rec = NODES[n.id];
  const color = domainColor(rec.domainId);
  const hasKids = n.children && n.children.length;
  const countLabel = n.type==='process' ? '' : `<span class="n">${leafCountById(n.id)} proc</span>`;

  let dim = dimmedDomains.has(rec.domainId);
  if(opAreaFilter){
    const set = new Set(OPAREA_TO_PROCESSES[opAreaFilter]||[]);
    dim = dim || !isDescendantOfAnyProcess(rec, set);
  }
  const selCls = n.id===selectedId ? ' selected' : '';
  const dimCls = dim ? ' dim' : '';
  const openCls = treeOpen.has(n.id) ? ' open' : '';

  if(!hasKids){
    return `<li><div class="tnode${selCls}${dimCls}" data-id="${n.id}" onclick="selectNode('${n.id}')"><span class="dot" style="background:${color}"></span><span class="name">${n.label}</span></div></li>`;
  }
  return `<li>
    <div class="tnode${selCls}${dimCls}" data-id="${n.id}" onclick="toggleTwisty('${n.id}')">
      <svg class="twisty${openCls}"><use href="#ic-chevron"/></svg>
      <span class="dot" style="background:${color}"></span>
      <span class="name">${n.label}</span>
      ${countLabel}
    </div>
    <ul class="tchildren${openCls}">${n.children.map(c=>treeNodeHTML(c)).join('')}</ul>
  </li>`;
}
function toggleTwisty(id){
  if(treeOpen.has(id)) treeOpen.delete(id); else treeOpen.add(id);
  selectNode(id);
}

/* Expand the tree down to a node, select it and scroll it into view. */
function revealInTree(id){
  const n = NODES[id]; if(!n) return;
  n.ancestry.forEach(a=>treeOpen.add(a));
  selectNode(id);
  const row = document.querySelector(`#tree-target .tnode[data-id="${id}"]`);
  if(row){
    row.scrollIntoView({behavior:'smooth', block:'center'});
    row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'), 1100);
  }
}

/* ---------------- List view side panel ----------------
   Breakdown of Services and Processes under each Service Line (L2),
   scoped to whatever is selected in the list. */
function serviceLinesInScope(){
  const n = selectedId ? NODES[selectedId] : null;
  if(!n || n.type==='root') return Object.values(NODES).filter(x=>x.type==='subdomain');
  if(n.type==='domain') return n.childIds.map(id=>NODES[id]);
  if(n.type==='subdomain') return [n];
  if(n.type==='service') return [NODES[n.parentId]];
  return [NODES[NODES[n.parentId].parentId]];          // process
}
function renderListPanel(){
  const panel = document.getElementById('list-panel');
  if(viewMode!=='list'){ return; }
  const sel = selectedId ? NODES[selectedId] : null;
  const lines = serviceLinesInScope();
  const svcIds = lines.flatMap(l=>l.childIds);
  const procCount = svcIds.reduce((s,id)=>s+NODES[id].childIds.length, 0);
  const lensSet = opAreaFilter ? new Set(OPAREA_TO_PROCESSES[opAreaFilter]||[]) : null;
  const many = lines.length > 1;

  let title = 'All Service Lines';
  if(sel){
    if(sel.type==='domain') title = sel.label;
    else title = lines[0].label;
  }

  let html = `<div class="lp-head">
    <div class="lp-kicker">Service Line breakdown${opAreaFilter ? ' &middot; lens: '+lensLabel(opAreaFilter).replace(/ \(.*\)$/,'') : ''}</div>
    <div class="lp-title">${title}</div>
    <div class="lp-stats">
      <div class="lp-stat"><b>${lines.length}</b><span>Service Line${lines.length===1?'':'s'}</span></div>
      <div class="lp-stat"><b>${svcIds.length}</b><span>Services</span></div>
      <div class="lp-stat"><b>${procCount}</b><span>Processes</span></div>
    </div>
    <div class="lp-actions">
      ${sel ? `<button class="lp-btn" onclick="selectNode(null)">Show all Service Lines</button>` : ''}
      ${many ? `<button class="lp-btn" onclick="setPanelOpen(true)">Expand all</button><button class="lp-btn" onclick="setPanelOpen(false)">Collapse all</button>` : ''}
    </div>
  </div><div class="lp-body">`;

  let lastDomain = null;
  lines.forEach(sl=>{
    const color = domainColor(sl.domainId);
    if(many && sl.domainId!==lastDomain){
      lastDomain = sl.domainId;
      html += `<div class="lp-domain"><span class="dot" style="background:${color}"></span>${NODES[sl.domainId].label.replace(' Domain','')}</div>`;
    }
    const nProc = sl.childIds.reduce((s,id)=>s+NODES[id].childIds.length,0);
    const open = !many || panelOpenDefault;
    html += `<details class="lp-sl${sel && sel.id===sl.id ? ' selected':''}" style="--sl-color:${color}" ${open?'open':''}>
      <summary>
        <svg class="twisty"><use href="#ic-chevron"/></svg>
        <div class="lp-sl-text">
          <div class="lp-sl-name">${sl.label}</div>
          <div class="lp-sl-count">${sl.childIds.length} services &middot; ${nProc} processes</div>
        </div>
      </summary>
      <ol class="lp-svc-list">
        ${sl.childIds.map(sid=>{
          const sv = NODES[sid];
          return `<li>
            <div class="lp-svc-name${selectedId===sid?' selected':''}" onclick="revealInTree('${sid}')">${sv.label}<span class="n">${sv.childIds.length}</span></div>
            <ul class="lp-proc-list">
              ${sv.childIds.map(pid=>{
                const pr = NODES[pid];
                const dim = lensSet && !lensSet.has(pid);
                return `<li class="lp-proc${selectedId===pid?' selected':''}${dim?' dim':''}" onclick="revealInTree('${pid}')">${pr.label}</li>`;
              }).join('')}
            </ul>
          </li>`;
        }).join('')}
      </ol>
    </details>`;
  });
  html += `</div>`;
  const prevScroll = panel.querySelector('.lp-body') ? panel.querySelector('.lp-body').scrollTop : 0;
  const prevKey = panel.dataset.scope, key = lines.map(l=>l.id).join(',');
  panel.innerHTML = html;
  panel.dataset.scope = key;
  if(prevKey===key) panel.querySelector('.lp-body').scrollTop = prevScroll;
  const selRow = panel.querySelector('.lp-svc-name.selected, .lp-proc.selected');
  if(selRow && prevKey!==key) selRow.scrollIntoView({block:'nearest'});
}
let panelOpenDefault = true;
function setPanelOpen(open){
  panelOpenDefault = open;
  document.querySelectorAll('#list-panel details.lp-sl').forEach(d=>d.open = open);
}

/* ---------------- Search ---------------- */
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const SEARCH_INDEX = Object.values(NODES).filter(n=>n.id!==ROOT_ID).map(n=>({id:n.id, label:n.label, type:n.type, domainId:n.domainId}));

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ searchResults.classList.remove('open'); return; }
  const matches = SEARCH_INDEX.filter(n=>n.label.toLowerCase().includes(q)).slice(0,18);
  if(!matches.length){ searchResults.innerHTML = '<div class="search-result-item">No matches</div>'; searchResults.classList.add('open'); return; }
  searchResults.innerHTML = matches.map(m=>`
    <div class="search-result-item" data-id="${m.id}">
      <span class="sri-dot" style="background:${domainColor(m.domainId)}"></span>
      <span class="sri-type">${m.type}</span>
      <span>${m.label}</span>
    </div>`).join('');
  searchResults.classList.add('open');
});
searchResults.addEventListener('click', (e)=>{
  const item = e.target.closest('.search-result-item');
  if(!item || !item.dataset.id) return;
  const id = item.dataset.id;
  searchResults.classList.remove('open');
  searchInput.value = NODES[id].label;
  focusNode(id);
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-box')) searchResults.classList.remove('open');
});

function panToNode(id){
  const n = NODES[id];
  const p = getPos(n);
  tx = -p.x * scale;
  ty = -p.y * scale;
  applyTransform();
}


/* ---------------- Values & Privacy view ---------------- */
function flag(v, yes, no, warnOnYes){
  if(v===null || v===undefined) return '<span class="flag">&mdash;</span>';
  return `<span class="flag ${v ? (warnOnYes?'warn':'yes') : 'no'}">${v?yes:no}</span>`;
}
function indicatorCardHTML(i){
  return `<div class="ind-card">
    <div class="ind-name">${i.label}</div>
    ${i.formula ? `<div class="ind-formula">${i.formula}</div>` : ''}
    <div class="ind-flags">
      <span class="op-tag">${i.mode.label}</span>
      <span class="op-tag">${i.granularity.label}</span>
      ${i.k ? `<span class="op-tag">k &ge; ${i.k}</span>` : ''}
      ${flag(i.attributable,'Named individual','Not attributable', true)}
      ${flag(i.decisionUse,'Employment decisions','No decision use', true)}
    </div>
  </div>`;
}
function svcChip(c){
  const col = NODES[c.id] ? domainColor(NODES[c.id].domainId) : 'var(--muted)';
  return `<span class="chip nav" onclick="focusNode('${c.id}')" title="Show on map"><span class="dot" style="background:${col}"></span>${c.label}</span>`;
}
function renderValuesView(){
  const t = document.getElementById('values-target');
  const S = MODEL.stats;
  const decisionGrade = MODEL.indicators.filter(i=>i.decisionUse);
  let html = `
  <section class="vp-intro">
    <h2>Values &amp; Privacy Stewardship</h2>
    <p>How the business model promotes, monitors and measures its values and objectives. Most signals are aggregated or anonymous,
    and only <b>${decisionGrade.length} of ${S.indicators}</b> indicators may inform employment decisions. Those require human review,
    notice to the employee, and a retention limit.</p>
  </section>

  <section>
    <h3>Core service lines <span class="count">${S.serviceLines}</span></h3>
    <div class="sl-grid">
      ${MODEL.serviceLines.map(sl=>`
        <div class="sl-card ${opAreaFilter===sl.id?'on':''}">
          <div class="sl-head">
            <div class="sl-name">${sl.label.replace(/ \(.*\)$/,'')}</div>
            <button class="lens-btn" onclick="toggleOpAreaLens('${sl.id}'); renderValuesView();">${opAreaFilter===sl.id?'Lens on':'Use as lens'}</button>
          </div>
          <div class="sl-meta">${OPAREA_TO_PROCESSES[sl.id].length} processes</div>
          <div class="chip-row">${sl.subdomains.concat(sl.services).map(svcChip).join('')}</div>
        </div>`).join('')}
    </div>
  </section>

  <section>
    <h3>Values &amp; corporate objectives <span class="count">${S.principles}</span></h3>
    <p class="vp-sub">Values describe conduct and objectives describe outcomes. Innovation is modeled as both.</p>
    <div class="pr-list">
      ${MODEL.principles.map(p=>`
        <article class="pr-card" id="pr-${p.id}">
          <div class="pr-head">
            <div class="pr-name">${p.label}</div>
            <span class="kind kind-${p.kinds.join('-')}">${principleKindLabel(p)}</span>
          </div>
          <div class="pr-comment">${p.comment}</div>
          <div class="pr-cols">
            <div>
              <div class="insp-section-title">Promoted by</div>
              <div class="chip-row">${p.promotedBy.map(svcChip).join('')}</div>
            </div>
            <div>
              <div class="insp-section-title">Evidenced by</div>
              <div class="ind-list">${p.indicators.map(id=>indicatorCardHTML(INDICATORS[id])).join('')}</div>
            </div>
          </div>
        </article>`).join('')}
    </div>
  </section>

  <section>
    <h3>Privacy safeguards <span class="count">${S.safeguards}</span></h3>
    <div class="sg-grid">
      ${MODEL.safeguards.map(g=>`
        <article class="sg-card" id="sg-${g.id}">
          <div class="sg-name">${g.label}</div>
          ${g.comment?`<div class="pr-comment">${g.comment}</div>`:''}
          ${g.prohibits.length?`<div class="insp-section-title">Prohibits</div><ul class="ban-list">${g.prohibits.map(x=>`<li>${x.label}</li>`).join('')}</ul>`:''}
          ${g.enforcedBy.length?`<div class="insp-section-title">Enforced by</div><div class="chip-row">${g.enforcedBy.map(svcChip).join('')}</div>`:''}
          ${g.regulations.length?`<div class="insp-section-title">Derived from</div><div class="chip-row">${g.regulations.map(r=>`<span class="chip reg">${r.label}</span>`).join('')}</div>`:''}
        </article>`).join('')}
    </div>
  </section>

  <section>
    <h3>Explicitly prohibited practices <span class="count">${S.prohibited}</span></h3>
    <ul class="ban-list big">${MODEL.prohibitedPractices.map(x=>`<li>${x.label}</li>`).join('')}</ul>
  </section>`;
  t.innerHTML = html;
}

/* ---------------- Light / dark theme ---------------- */
function syncThemeButton(){
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('theme-icon').setAttribute('href', dark ? '#ic-sun' : '#ic-moon');
  document.getElementById('theme-text').textContent = dark ? 'Light' : 'Dark';
  const btn = document.getElementById('theme-toggle');
  btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('hrmap-theme', next); }catch(e){}
  syncThemeButton();
}
syncThemeButton();

/* ---------------- Init ---------------- */
fitStage();
setView('radial');
/* Cluster columns are sized from measured text; re-measure once web fonts arrive. */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ lastClusterDepth = null; if(viewMode==='cluster'){ syncLayoutDepth(); render(); } });
}
